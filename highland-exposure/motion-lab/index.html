<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Highland Exposure · Motion Lab</title>
<style>
:root{color-scheme:dark}html,body{margin:0;height:100%;background:#0c0e0d;overflow:hidden;font:15px/1.4 system-ui,sans-serif;color:#f2eee4;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0c0e0d;font:16px Georgia,serif;color:#cfc9bb;z-index:9}
[hidden]{display:none!important}
#spd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));font:600 13px ui-monospace,monospace;color:#f2eee4;text-shadow:0 1px 2px #000;opacity:.85}
#acts{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#acts button{font:15px system-ui,sans-serif;color:#f2eee4;background:rgba(14,18,16,.72);border:1px solid rgba(242,238,228,.35);border-radius:22px;padding:10px 16px;backdrop-filter:blur(4px)}
#acts b{display:inline-block;min-width:1.2em;color:#e0b123}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid rgba(242,238,228,.3);background:rgba(14,18,16,.25)}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(242,238,228,.55)}
@media (hover:hover) and (pointer:fine){#joy{display:none}}
#bub{position:fixed;transform:translate(-50%,-100%);max-width:min(380px,80vw);background:rgba(14,18,16,.86);border-radius:12px;padding:9px 13px;pointer-events:none;font:15px/1.4 Georgia,serif}
#bub b{display:block;font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#e0b123;margin-bottom:2px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(14,18,16,.8);border-radius:16px;padding:7px 14px;font:14px system-ui,sans-serif}
#help{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));font:12px system-ui,sans-serif;color:#cfc9bb;text-align:right;opacity:.8;text-shadow:0 1px 2px #000}
@media (pointer:coarse){#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(14,18,16,.8);border-radius:16px;padding:7px 14px;font:14px system-ui,sans-serif}
#help{display:none}}
</style></head>
<body>
<canvas id="c"></canvas><div id="boot">Loading</div>
<div id="spd"></div><div id="help">W A S D move · Shift run · drag to look<br>E talk · F bajaj · G lead the donkey · Space brake · R radio<br>Sound starts with your first tap or key</div>
<div id="acts"></div><div id="joy"><div id="knob"></div></div>
<div id="toast" hidden></div><div id="bub" hidden><b id="bub-name"></b><span id="bub-text"></span></div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="./main.js"></script>
</body></html>
