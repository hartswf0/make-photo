<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a151d">
<title>World Atlas · make-photo</title>
<style>
:root{--ink:#0a151d;--fg:#e6f1ec;--cyan:120,245,236;--amber:255,206,140;--violet:200,170,255;--pale:214,236,240}
html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);overflow:hidden;overscroll-behavior:none;font:italic 15px/1.35 Georgia,'Iowan Old Style',serif}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;z-index:2}
#bar button{flex:none;border:0;color:var(--fg);font:inherit;padding:7px 12px;border-radius:999px;background:rgba(20,44,54,.72);backdrop-filter:blur(6px)}
#sheet{position:fixed;left:10px;right:10px;bottom:10px;max-width:560px;margin:0 auto;padding:14px 16px 16px;border-radius:22px;background:rgba(10,26,34,.9);backdrop-filter:blur(8px);z-index:3;transform:translateY(130%);transition:transform .25s}
#sheet.on{transform:none}#sheet h2{margin:0 0 4px;font-weight:400;font-size:20px}#sheet .k{font-style:normal;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
#sheet p{margin:6px 0;opacity:.85}#sheet a{display:inline-block;margin-top:6px;margin-right:8px;color:#0a151d;background:rgb(var(--cyan));padding:8px 14px;border-radius:999px;text-decoration:none;font-style:normal}
#sheet a.alt{background:rgba(var(--pale),.18);color:var(--fg)}#sheet .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--fg);font-size:22px}
#key{position:fixed;left:12px;bottom:12px;font-size:12px;font-style:normal;opacity:.7;z-index:1;line-height:1.6}
#key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="key"><div><i style="background:rgb(120,245,236)"></i>real place</div><div><i style="background:rgb(255,206,140)"></i>composite of real places</div><div><i style="background:#fff"></i>Donkey Water montage</div><div><i style="background:rgb(200,170,255)"></i>fictional, anchored</div></div>
<div id="sheet" role="dialog" aria-live="polite"><button class="x" aria-label="Close">×</button><div class="k"></div><h2></h2><p class="n"></p><div class="go"></div></div>
<script>
// One map for every world in make-photo. Worlds register in worlds.json with WGS84 places.
// It streams in stages: the registry first (20 KB), then a land outline, then real elevation only for what is on screen
// and big enough to read: the Ethiopia regional DEM (450 KB) at country scale, each 2.4 km tile DEM (295 KB) at valley scale.
(async () => {
const cv = document.getElementById('c'), g = cv.getContext('2d'), sheet = document.getElementById('sheet');
let W = 0, H = 0, dpr = 1;
const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; draw(); };
const X = lon => (lon + 180) / 360, Y = lat => { const s = Math.sin(lat * Math.PI / 180); return .5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
const LAT = y => 360 / Math.PI * Math.atan(Math.exp((.5 - y) * 2 * Math.PI)) - 90;
const V = { cx: X(-20), cy: Y(25), s: 0 };                         // view centre in mercator units, scale in px per unit
const P = (lat, lon) => [(X(lon) - V.cx) * V.s + W / 2, (Y(lat) - V.cy) * V.s + H / 2];
const KIND = { real: '120,245,236', composite: '255,206,140', montage: '255,255,255', fictional: '200,170,255' };
const reg = await (await fetch('./worlds.json?v=1')).json();
// flatten every place with its world, so the map can draw and pick them
const places = [], worlds = reg.worlds;
for (const w of worlds) { const add = (l, sub) => { if (l.latlon) places.push({ w, sub, name: l.name, lat: l.latlon[0], lon: l.latlon[1], approx: l.approx || (sub && sub.approx) }); };
  (w.landmarks || []).forEach(l => add(l)); (w.pieces || []).forEach(p => p.landmarks.forEach(l => add(l, p))); (w.tiles || []).forEach(t => t.landmarks.forEach(l => add(l, t))); }
for (const w of worlds) { const ps = places.filter(p => p.w === w); if (!ps.length) continue; w.lat = ps.reduce((a, p) => a + p.lat, 0) / ps.length; w.lon = ps.reduce((a, p) => a + p.lon, 0) / ps.length; }
// ---- land outline (Natural Earth 110m through world-atlas); a graticule stands in if it does not load ----
let land = null;
(async () => { try { await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
  const t = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json')).json(); land = topojson.feature(t, t.objects.land); draw(); } catch { } })();
// ---- elevation streaming: decode a normalized uint16 grid into a hillshaded image, on demand ----
const dems = new Map();
function dem(key, url, w, h, tint) { let d = dems.get(key); if (d) return d.img; d = { img: null }; dems.set(key, d);
  fetch(url).then(r => r.arrayBuffer()).then(buf => { const u = new Uint16Array(buf), c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), im = x.createImageData(w, h);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = j * w + i, e = u[k] / 65535, ex = u[j * w + Math.min(w - 1, i + 1)] / 65535 - e, ez = u[Math.min(h - 1, j + 1) * w + i] / 65535 - e;
      const sh = Math.max(0, Math.min(1, .62 - ex * 22 - ez * 14)), a = 70 + e * 150; im.data[k * 4] = tint[0] * sh; im.data[k * 4 + 1] = tint[1] * sh; im.data[k * 4 + 2] = tint[2] * sh; im.data[k * 4 + 3] = a; }
    x.putImageData(im, 0, 0); d.img = c; draw(); }).catch(() => { }); return null; }
const onScreen = (s, w, n, e) => { const [x0, y0] = P(n, w), [x1, y1] = P(s, e); return { x0, y0, x1, y1, vis: x1 > 0 && x0 < W && y1 > 0 && y0 < H, px: Math.max(x1 - x0, y1 - y0) }; };
function draw() {
  if (!V.s) { V.s = Math.min(W, H) * 1.6; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#0a151d'; g.fillRect(0, 0, W, H);
  // land
  g.lineJoin = 'round';
  if (land) { g.beginPath(); for (const f of land.features) { const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates; for (const poly of polys) for (const ring of poly) ring.forEach(([lo, la], i) => { const [x, y] = P(la, lo); i ? g.lineTo(x, y) : g.moveTo(x, y); }); }
    g.fillStyle = '#15262f'; g.fill(); g.strokeStyle = 'rgba(160,220,225,.22)'; g.lineWidth = 1; g.stroke(); }
  g.strokeStyle = 'rgba(160,220,225,.07)'; g.lineWidth = 1; const step = V.s > 6000 ? 1 : V.s > 1500 ? 5 : 15;
  for (let lo = -180; lo <= 180; lo += step) { const [x] = P(0, lo); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let la = -75; la <= 75; la += step) { const [, y] = P(la, 0); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // streamed elevation
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  for (const w of worlds) { if (w.region_dem) { const r = w.region_dem, b = onScreen(r.bbox[0], r.bbox[1], r.bbox[2], r.bbox[3]); if (b.vis && b.px > 140) { const im = dem(w.id, r.url, r.w, r.h, [170, 230, 226]); if (im) { g.globalAlpha = Math.max(0, Math.min(1, (9000 - b.px) / 5000)); if (g.globalAlpha > 0) g.drawImage(im, b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); g.globalAlpha = 1; } } }   // the coarse country grid gives way to the tiles
    for (const t of w.tiles || []) { const b = onScreen(t.bbox[0], t.bbox[1], t.bbox[2], t.bbox[3]); if (b.vis && b.px > 36) { const im = dem(t.id, t.dem, t.grid, t.grid, [200, 245, 236]); if (im) g.drawImage(im, b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); }
      if (b.vis && b.px > 24) { g.strokeStyle = 'rgba(120,245,236,.5)'; g.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); }
      if (b.vis && b.px > 120 && t.trail && t.trail.length > 1) { g.setLineDash([4, 5]); g.strokeStyle = 'rgba(255,206,140,.8)'; g.lineWidth = 2; g.beginPath(); t.trail.forEach(([la, lo], i) => { const [x, y] = P(la, lo); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]); g.lineWidth = 1; } } }
  // corridor routes and the montage's seams
  for (const w of worlds) { if (w.route) { g.strokeStyle = 'rgba(255,206,140,.55)'; g.lineWidth = 2; g.beginPath(); w.route.forEach(([la, lo], i) => { const [x, y] = P(la, lo); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.lineWidth = 1; }
    for (const s of w.seams || []) { const [ax, ay] = P(s.a[0], s.a[1]), [bx, by] = P(s.b[0], s.b[1]), mx = (ax + bx) / 2, my = Math.min(ay, by) - Math.hypot(bx - ax, by - ay) * .25;
      g.setLineDash([2, 7]); g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(mx, my, bx, by); g.stroke(); g.setLineDash([]); g.lineWidth = 1; } }
  // places: worlds as drops at a distance, their places when you come close
  const near = V.s > 9000, labels = []; g.textAlign = 'left';
  for (const w of worlds) { if (w.lat == null) continue; const ps = places.filter(p => p.w === w), [x, y] = P(w.lat, w.lon), spread = ps.reduce((m, p) => { const [px, py] = P(p.lat, p.lon); return Math.max(m, Math.hypot(px - x, py - y)); }, 0), col = KIND[w.kind];
    if (spread < 26) { drop(x, y, 7 + Math.min(6, ps.length), col, 1); labels.push([w.title, x + 14, y + 4, col, 15]); w.hit = [x, y, 22]; }
    else { w.hit = null; for (const p of ps) { const [px, py] = P(p.lat, p.lon); drop(px, py, 5, col, p.approx ? .55 : 1); p.hit = [px, py, 18]; if (near || ps.length < 6) labels.push([p.name, px + 9, py + 4, col, 13]); } labels.push([w.title, x + 10, y - 14, col, 15]); } }
  // de-overlap labels greedily
  const taken = []; g.font = "italic 14px Georgia,'Iowan Old Style',serif";
  for (const [t, x, y, col, sz] of labels) { g.font = `italic ${sz}px Georgia,'Iowan Old Style',serif`; const w = g.measureText(t).width; if (taken.some(r => x < r[2] && x + w > r[0] && y - sz < r[3] && y > r[1])) continue; taken.push([x, y - sz, x + w, y + 3]);
    g.lineWidth = 3; g.strokeStyle = 'rgba(10,21,29,.85)'; g.strokeText(t, x, y); g.fillStyle = `rgb(${col})`; g.fillText(t, x, y); }
}
function drop(x, y, r, col, a) { if (x < -20 || x > W + 20 || y < -20 || y > H + 20) return; const gr = g.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r * 1.6); gr.addColorStop(0, `rgba(${col},${.95 * a})`); gr.addColorStop(.55, `rgba(${col},${.35 * a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.6, 0, 7); g.fill(); g.fillStyle = `rgba(255,255,255,${.8 * a})`; g.beginPath(); g.arc(x - r * .35, y - r * .4, r * .22, 0, 7); g.fill(); }
// ---- pan, zoom, pick ----
const ptrs = new Map(); let pinch = null, moved = 0;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: V.s }; } });
cv.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p[0], dy = e.clientY - p[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.hypot(dx, dy);
  if (ptrs.size === 1) { V.cx -= dx / V.s; V.cy -= dy / V.s; } else if (pinch) { const [a, b] = [...ptrs.values()]; zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d / V.s); } draw(); });
const up = e => { const was = ptrs.size; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (was === 1 && moved < 8) pick(e.clientX, e.clientY); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); draw(); }, { passive: false });
function zoomAt(x, y, k) { const mx = V.cx + (x - W / 2) / V.s, my = V.cy + (y - H / 2) / V.s; V.s = Math.max(Math.min(W, H) * .9, Math.min(4e7, V.s * k)); V.cx = mx - (x - W / 2) / V.s; V.cy = my - (y - H / 2) / V.s; }
function fly(s, w, n, e) { const x0 = X(w), x1 = X(e), y0 = Y(n), y1 = Y(s); V.cx = (x0 + x1) / 2; V.cy = (y0 + y1) / 2; V.s = Math.min(W / Math.max(1e-9, x1 - x0), (H - 120) / Math.max(1e-9, y1 - y0)) * .8; draw(); }
function pick(x, y) { let best = null, bd = 1e9; for (const w of worlds) if (w.hit) { const d = Math.hypot(x - w.hit[0], y - w.hit[1]); if (d < w.hit[2] && d < bd) { bd = d; best = { w }; } }
  for (const p of places) if (p.hit && !p.w.hit) { const d = Math.hypot(x - p.hit[0], y - p.hit[1]); if (d < p.hit[2] && d < bd) { bd = d; best = { w: p.w, p }; } }
  for (const w of worlds) for (const t of w.tiles || []) { const b = onScreen(t.bbox[0], t.bbox[1], t.bbox[2], t.bbox[3]); if (!best && b.px > 24 && x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1) best = { w, t }; }
  if (!best) { sheet.classList.remove('on'); return; } show(best); }
function show({ w, p, t }) { const kind = { real: 'Real place', composite: 'Composite of real places', montage: 'Montage: real places stitched together', fictional: 'Fictional, anchored' }[w.kind];
  sheet.querySelector('.k').textContent = kind + (p && p.approx ? ' · position approximate' : ''); sheet.querySelector('h2').textContent = p ? p.name : t ? t.title : w.title;
  sheet.querySelector('.n').textContent = [p || t ? w.title : '', w.note || w.anchor_note || w.compression || w.source || ''].filter(Boolean).join(' · ');
  const go = sheet.querySelector('.go'); go.replaceChildren(); const a = document.createElement('a'); a.href = (t && t.entry) || (p && p.sub && p.sub.entry) || w.entry; a.textContent = 'Enter'; go.append(a);
  if (p) { const m = document.createElement('a'); m.className = 'alt'; m.textContent = 'Closer'; m.href = '#'; m.onclick = ev => { ev.preventDefault(); const d = .01; fly(p.lat - d, p.lon - d, p.lat + d, p.lon + d); }; go.append(m); }
  sheet.classList.add('on'); }
sheet.querySelector('.x').onclick = () => sheet.classList.remove('on');
// ---- places to jump to ----
const bar = document.getElementById('bar'), jumps = [['Earth', -55, -170, 70, 170], ['Ethiopia', 6, 34, 15.5, 42.5], ['Simien', 13.2, 38.03, 13.31, 38.16], ['Yosemite & Tetons', 36.8, -121.5, 44.6, -108.5], ['Grand Teton', 43.73, -110.66, 43.77, -110.6], ['Chesapeake', 37.6, -77.2, 39.6, -74.8], ['Mexico City', 19, -99.5, 19.9, -98.6]];
for (const [name, s, w, n, e] of jumps) { const b = document.createElement('button'); b.textContent = name; b.onclick = () => fly(s, w, n, e); bar.append(b); }
const q = new URLSearchParams(location.search).get('at'); const j = jumps.find(x => x[0].toLowerCase() === (q || '').toLowerCase());
addEventListener('resize', size); size(); if (j) fly(j[1], j[2], j[3], j[4]); else fly(-5, -125, 50, 45);
window.__atlas = { V, places, worlds, fly, draw, dems };
})();
</script>
</body></html>
