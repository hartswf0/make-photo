;white-space:nowrap}.live{display:inline-block;width:7px;height:7px;background:var(--teal);border-radius:50%;margin-right:7px}.playgrid{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:clamp(24px,4.1vw,64px);align-items:start}.left-side,.story,.subbody,.sidecol{min-width:0}.plate{margin:0;border:1px solid #222923;background:var(--black);color:#e8ece2}.plate-image{width:100%;height:clamp(275px,32vw,465px);position:relative;overflow:hidden}.plate-image img{display:block;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.plate-image::before,.plate-image::after{content:"";pointer-events:none;position:absolute;width:15px;height:15px;z-index:1;opacity:.78}.plate-image::before{left:15px;top:15px;border-left:1px solid white;border-top:1px solid white}.plate-image::after{right:15px;bottom:15px;border-right:1px solid white;border-bottom:1px solid white}.plate-meta{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;gap:10px;font-size:10px}.plate-meta span:first-child{color:var(--aqua);white-space:nowrap}.plate-meta span:last-child{text-align:right;letter-spacing:.01em;text-transform:none;font-family:var(--sans);font-size:12px}.readout{margin:15px 0 0;padding:12px 0;display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}.readout div+div{border-left:1px solid var(--line);padding-left:14px}.readout dt{color:var(--muted);font-size:10px}.readout dd{margin:3px 0 0;font:21px/1.15 var(--serif)}.readout small{text-transform:none;font-size:10px;letter-spacing:0;color:var(--muted)}.readout strong{font-weight:400}.route-note{display:flex;align-items:flex-start;gap:10px;margin-top:17px;line-height:1.45;color:var(--muted);font-size:14px}.route-note b{color:var(--teal);font-weight:600}.route-note button{white-space:nowrap;padding:0;border:0;background:none;text-decoration:underline;text-decoration-color:#96aba0;text-underline-offset:3px;color:var(--teal);font:inherit}.kicker{margin:0 0 7px}.story h1,.subpage h1{font:clamp(34px,4.15vw,63px)/1.04 var(--serif);font-weight:400;letter-spacing:-.044em;margin:0 0 15px;text-wrap:balance}.storytext{font:clamp(18px,1.56vw,23px)/1.47 var(--serif);margin:0 0 17px;max-width:66ch}.quote{font-family:var(--italic);font-style:italic}.brief{padding:12px 0 13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 15px}.brief b{font:11px var(--mono);color:var(--teal);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}.brief p{margin:0;font-size:14px;color:var(--ink)}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 9px;flex-wrap:wrap}.tabs button{padding:8px 11px 10px;border:0;background:transparent;color:var(--muted);font:13px var(--sans)}.tabs button:first-child{padding-left:0}.tabs button[aria-pressed=true]{color:var(--teal);box-shadow:inset 0 -2px var(--teal);font-weight:650}.choices{display:grid;gap:6px}.act{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;border:1px solid var(--line);text-align:left;background:var(--light);padding:10px 12px;min-height:44px;width:100%}.act .actiontitle{font-weight:580;font-size:14px}.act .cost{font:11px var(--mono);color:var(--muted);white-space:nowrap}.act .explain{grid-column:1/-1;color:var(--muted);font-size:12px}.act[data-main=true]{background:var(--black);border-color:var(--black);color:var(--light)}.act[data-main=true] .cost,.act[data-main=true] .explain{color:#b7d9ce}.act[data-danger=true]:enabled{border-left:3px solid var(--warm)}.act:disabled{background:transparent;border-color:#d3d7cb;color:#5d655e}.act:hover:enabled,.plain:hover,.thin:hover,nav button:hover{filter:brightness(.94)}.empty{font:italic 16px/1.5 var(--italic);color:var(--muted);margin:10px 0}.minor{font-size:13px;color:var(--muted)}.minor a,.linkish{color:var(--teal)}.command{margin-top:15px}.command summary,.tools summary,details summary{cursor:pointer;color:var(--teal);font:12px/1.6 var(--mono);padding:4px 0}.command form{display:flex;gap:6px;margin:8px 0}.command input{flex:1;min-width:0;padding:10px;background:var(--light);border:1px solid var(--line);color:var(--ink)}.plain,.thin,.actionlink{border:1px solid var(--line);background:transparent;padding:9px 12px;font-size:13px;min-height:40px}.plain{background:var(--black);color:var(--light);border-color:var(--black)}.actionlink{display:inline-block;text-decoration:none;color:var(--teal)}.plain:disabled,.thin:disabled{opacity:.55}.foot{margin-top:32px;display:flex;justify-content:space-between;align-items:center;padding-block:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);gap:12px}.foot button,.linkish{background:transparent;border:none;padding:5px 0;font-size:12px;text-underline-offset:3px;text-decoration:underline}.notice{border-left:3px solid var(--teal);padding:8px 12px;background:#e8eee4;font:14px/1.4 var(--sans);margin:10px 0}.confirm{background:#eee5d8;border-left-color:var(--warm)}.rowbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.subpage{padding-top:26px}.subpage>.smallcap{color:var(--teal);margin:0 0 6px}.subwrap{display:grid;grid-template-columns:minmax(0,1.17fr) minmax(0,.83fr);gap:clamp(20px,4vw,62px)}.subpage h2{font:29px/1.15 var(--serif);letter-spacing:-.025em;margin:20px 0 9px}.subpage h3,.story h3{font:19px/1.2 var(--serif);margin:15px 0 6px}.subpage p{max-width:75ch}.subpage .intro{font:20px/1.45 var(--serif);margin:11px 0 20px}.muted{color:var(--muted)}.atlasfig{background:var(--black);color:#f3f0e3;margin:4px 0 10px;padding:11px 12px}.atlasfig svg{width:100%;height:auto;display:block}.atlasfig figcaption{font:10px/1.4 var(--mono);color:#c3d6c8;margin-top:6px}.place-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.stop{border:1px solid var(--line);background:transparent;text-align:left;padding:8px 10px;min-height:40px;font:13px/1.25 var(--sans)}.stop[aria-pressed=true]{border-color:var(--teal);background:#e4eae0}.stop .fieldnu <script id="world-data" type="application/json">{"title":"Donkey Water · Night Post","year":2086,"edition":1,"locale":"en","author":"A text game in Watson Hartsoe’s Donkey Water / Ahiya Area Network","limits":{"capacity":20,"reserve":4,"watches":18,"maxStrength":6,"restGain":3,"emergencyLiters":4,"overdraftShifts":2,"cooling":9,"tap":4,"screen":3},"circuits":{"west":{"name":"Western Basin","carrier":"Imani","animal":"Mistletoe","home":"overlook","permission":"ford","hub":"plaza","yard":"oxbow","flight":true,"request":"The last eight seconds","record":"WF–08","sender":"June","keeper":"Etta","publicTitle":"The wedding at Silver Ford","privateTitle":"Eight seconds after the shoe","returnTitle":"Ruth’s camera credit","intro":"June knows where the bride loses her shoe. Her mother left the camera running afterward. There are eight more seconds on the hill master. June wants to hear them.","opening":"June’s wedding film ends when the bride drops her shoe. “Mum left the camera running,” she says, winding one earphone around her thumb. Mistletoe waits under the cold pump.","publicDesc":"The bride steps off the ferry. A shoe falls through the boards. In the front row the bride, now an old woman, raises her own foot a second before it happens.","privateDesc":"A thumbnail against a latch. A breath close to the microphone. A laugh from farther down the ferry. June turns her phone face down to listen again.","returnDesc":"Tess takes June’s correction. The catalog now names Ruth as camera operator. A separate space stays open for the voice at the end.","permissionText":"Etta signs two slips. The yard may see the wedding through the falling shoe. June may keep the last eight seconds on her own phone. Etta offers to witness the household claim as well.","coolText":"Tess takes nine liters on the clean side of the exchanger. The inner rack comes up. Ruth’s reel appears under a blank maker’s name.","dockText":"The dock keeps the family tail separate from the public edit. Two slips travel under the same can strap. Tess seals the cap before Imani lifts it.","tailWords":["A thumbnail finds the camera latch.","A breath lands very close.","A second laugh comes from down the boards."],"replyLine":"“Put down that she made the picture. Leave a space for who was laughing.”","storyEnd":"Ruth is credited on the next yard print. The voice on the last eight seconds remains for the family to name."},"ahiya":{"name":"Ahiya Highlands","carrier":"Rahel","animal":"Saba’s gray donkey","home":"basalt","permission":"beacon","hub":"hill","yard":"compound","flight":false,"request":"The chair in the harmony","record":"AR–03","sender":"Rahel’s aunt","keeper":"Rahel’s aunt","publicTitle":"The verse with a live answer","privateTitle":"Three rehearsal takes","returnTitle":"A second harmony from the yard","intro":"Rahel can tell her cousin’s recording by a chair scraping just before the first note. Her aunt wants the three rehearsal takes back. She will sing the answer herself if the compound gives her a night.","opening":"Saba unties the chalk from the lower pump. Rahel wants the rehearsal her cousin recorded on the far side of the ridge. She knows the take by the sound of a chair scraping before the first note.","publicDesc":"Her aunt sings the answer in the flesh while the approved backing plays from the root bowl. Someone catches the wrong-key entrance and sings it back. The whole yard knows that take.","privateDesc":"Rahel passes her aunt the earphone. In the third take a chair scrapes stone. She knows at once which cousin sat where. The aunt keeps a listening copy on her own phone.","returnDesc":"The hill keeper files the aunt’s new answer beside the cousin’s first take. Both names stay with the rehearsal, and only their households receive the listening copies.","permissionText":"At the white wall the aunt grants household listening. She will allow the backing at one public performance if she can sing the answer there herself.","coolText":"The hill keeper opens the inner rack. Nine liters pass into the clean cooling branch. Three versions of the same verse turn up in the catalog.","dockText":"The hill keeper writes the listening takes and the permitted backing to the saddle water. The sealed lacquer label names the aunt as custodian.","tailWords":["A chair leg scrapes the floor.","A cousin comes in early on the held note.","The aunt hums a second line over the first."],"replyLine":"“Keep the wrong one too. That’s the only one where we all came in together.”","storyEnd":"Two versions of the harmony can now come home. A future public performance will need the aunt’s leave again."}},"places":{"overlook":{"circuit":"west","name":"Overlook Wellhead","land":"Western Basin · Rim","image":"saddle","summary":"The pump keeper has chalked a white line across the can. Four liters belong to the animal and the return.","look":"The casting says HAND PUMP. Somebody has scratched two smaller words into the handle. BOTH WAYS. A girl in the yard is holding a cup in exactly the way grown people hold a microphone.","caption":"Mistletoe at the lower pump","altitude":20,"map":[74,44]},"switchback":{"circuit":"west","name":"Moraine Switchback Cistern","land":"Western Basin · Moraine","image":"saddle","summary":"A wooden trough sits in the lee of the bluff. The relief keeper has hung the resting animals’ names beside the wage book.","look":"A mended saddle pad is drying inside out. From the cut in the road you can make out five loops of perforated film against the lighter pines. A stallholder chalks the price of meal onto a box.","caption":"The pack-frame repair yard","altitude":48,"map":[64,16]},"ford":{"circuit":"west","name":"Silver Ford Relay","land":"Western Basin · River landing","image":"village","summary":"Etta keeps the key to the wedding master on a length of cotton. She is sitting where the old ferry rope once met the bank.","look":"One ferryman points to the wet post. His brother points to a stone some distance away. From the camera’s height the two landmarks line up. An enamel bowl has taken root on the island.","caption":"The landing below the survey camera","altitude":94,"map":[48,40]},"oxbow":{"circuit":"west","name":"Cottonwood Oxbow Kiosk","land":"Western Basin · Film grove","image":"grove","summary":"Two sheets hang at different depths. The cup, the root bowl and June’s phone all wait on the same bench.","look":"Etta bound a damaged reel along a young cottonwood shoot. Three wet seasons later the shoot put out a leaf with square holes along its edge. A baker has a price slip for the far bank.","caption":"The public sheet and the family awning","altitude":108,"map":[54,82]},"plaza":{"circuit":"west","name":"Highland Pueblo Plaza","land":"Western Basin · Archive intake","image":"window","summary":"Tess can see the coolant gauge in the reflection of June’s empty cup. The archive dock and the household tap face the same line.","look":"Behind the wire glass, a hose knocks twice. The registrar has a line for a deed holder. She keeps the rest of the page blank for guardians who bring their own witness.","caption":"Public water and the archive intake","altitude":124,"map":[32,52]},"fluke":{"circuit":"west","name":"Whale Fluke Cistern","land":"Western Basin · Abyssal sheet","image":"grove","summary":"The roofs give way to the ribs of a wreck. Between them the projectionist stretches a strip of cloth wide enough for two endings.","look":"Two screenings went out on the tide. Both poles kept their seats. The film keeper has a comedy in two captions and two wooden chairs for people who remember the joke differently.","caption":"Film drying between the ribs","altitude":8,"map":[13,30]},"apron":{"circuit":"west","name":"Half Dome East Apron","land":"Western Basin · Granite shelf","image":"village","summary":"A second licensed pump draws from a narrow seep. A retired keeper wants the missing angle of a brass float recorded.","look":"The keeper can free the float with half a turn of her wrist. In the old film her sleeve covers her hand. She has left a flat place on the shelf for a new camera.","caption":"The east pump and the granite shelf","altitude":90,"map":[91,64]},"tetons":{"circuit":"west","name":"Teton Range Landing","land":"Western Basin · High landing","image":"flight","summary":"The survey cairn throws a short shadow. The road below bends out of sight well before the next gleam of water.","look":"On the roof deck the tripod holes sit under the saddle cradle. Looking down, you can count three valleys by the turns a carrier would have to make. The cairn holds a dry dispatch box.","caption":"Woody and Mistletoe above the pass","altitude":190,"map":[83,13]},"basalt":{"circuit":"ahiya","name":"Basalt Pump","land":"Ahiya · Lower pump","image":"convoy","summary":"Saba listens for the short stroke before she opens the valve. A clean line of chalk marks the well’s reserve.","look":"The wind between pump strokes sounds like somebody breathing in to sing. In the handle’s shadow a piece of thread marks the height of the last entirely public draw.","caption":"Rahel meets the pack below the ridge","altitude":16,"map":[20,73]},"beacon":{"circuit":"ahiya","name":"Cross-Beacon Watch","land":"Ahiya · Night ridge","image":"convoy","summary":"The congregation lends its high wall to the watch. Different people give the beam different names.","look":"Rahel’s aunt has folded a rehearsal sheet into her pocket. She lets people hear an early entrance in the wrong key if they will listen to what the other singer did next.","caption":"The ridge above the night convoy","altitude":85,"map":[43,24]},"hill":{"circuit":"ahiya","name":"Hill Archive","land":"Ahiya · Upper intake","image":"desk","summary":"One operator logs the crossing. Another clears a space on the shelf for the returning rehearsal. The fans carry on between sightings.","look":"A map can tell the operator where a can was seen. To learn who sang the lower voice she needs a recording and someone who knows the family. Saba’s signed gauge reading lies under the keyboard.","caption":"The radio desk at the hill master","altitude":71,"map":[75,22]},"compound":{"circuit":"ahiya","name":"Daylight Compound","land":"Ahiya · Unloading yard","image":"village","summary":"Two people take the handles before the pack frame comes away. The phones go dark in the direct morning sun.","look":"A clay bowl sits beside the household tap. There is a stool for a singer under the awning. Somebody has pegged an ordinary sheet between the walls for tonight’s backing reel.","caption":"The unloading yard at first light","altitude":24,"map":[79,76]}},"roads":[{"a":"overlook","b":"switchback","watches":1},{"a":"switchback","b":"ford","watches":1},{"a":"ford","b":"oxbow","watches":1},{"a":"oxbow","b":"plaza","watches":1},{"a":"plaza","b":"fluke","watches":2},{"a":"overlook","b":"apron","watches":2},{"a":"apron","b":"tetons","watches":2},{"a":"basalt","b":"beacon","watches":1},{"a":"beacon","b":"hill","watches":1},{"a":"hill","b":"compound","watches":1},{"a":"compound","b":"basalt","watches":2}],"wells":{"overlook":{"stock":32,"capacity":40,"floor":12,"recharge":6},"apron":{"stock":29,"capacity":36,"floor":9,"recharge":5},"basalt":{"stock":30,"capacity":38,"floor":10,"recharge":6}},"groves":[{"id":"g1","name":"Overlook Rim Film Grove","station":"overlook","trees":4,"open":true,"height":0,"bearing":"Overlook · 23 m NW","program":"The pump keeper’s first test roll"},{"id":"g2","name":"Bluff Switchback Kelp Stand","station":"switchback","trees":5,"open":false,"height":42,"bearing":"Switchback · 27 m SW","program":"Saddle repairs in close-up"},{"id":"g3","name":"Moraine Bench Ribbon Wood","station":"ford","trees":5,"open":false,"height":68,"bearing":"Silver Ford · 102 m E","program":"Two cuts of the same thaw"},{"id":"g4","name":"Silver Ford Island Canopy","station":"ford","trees":5,"open":false,"height":88,"bearing":"Silver Ford · 24 m S","program":"The wedding at the ferry"},{"id":"g5","name":"Cottonwood Oxbow Film Forest","station":"oxbow","trees":5,"open":false,"height":102,"bearing":"Oxbow · 30 m NE","program":"A double bill chosen by the yard"},{"id":"g6","name":"Cathedral Pueblo High Wood","station":"plaza","trees":5,"open":false,"height":118,"bearing":"Plaza · 31 m SE","program":"Voices naming the old streets"},{"id":"g7","name":"Whale Fluke Filmstrip Cathedral","station":"fluke","trees":7,"open":true,"height":0,"bearing":"Whale Fluke · 8 m S","program":"The drowned hall, heard empty"},{"id":"g8","name":"Galleon Arch Kelp Cinema","station":"fluke","trees":7,"open":true,"height":0,"bearing":"Whale Fluke · 39 m NW","program":"A comedy dubbed on two shores"},{"id":"g9","name":"Half Dome Cloud Notch Stand","station":"apron","trees":5,"open":false,"height":24,"bearing":"East Apron · 128 m E","program":"A pilot’s cloud and shadow tests"},{"id":"g10","name":"Half Dome East Apron Forest","station":"apron","trees":5,"open":false,"height":85,"bearing":"East Apron · 16 m N","program":"The same cliff in three prints"}],"zones":[{"zone":"0","terrain":"Overlook Rim Shadow"},{"zone":"I","terrain":"Upper Moraine Timber"},{"zone":"II","terrain":"Half Dome Cloud Notch"},{"zone":"III","terrain":"Bluff Switchback Pines"},{"zone":"IV","terrain":"Snake River Overlook"},{"zone":"V","terrain":"Juniper Sage Bench"},{"zone":"VI","terrain":"The Silver Ford"},{"zone":"VII","terrain":"Cottonwood Oxbow Kiosk"},{"zone":"VIII","terrain":"Abyssal Whale Fluke Sanctuary"},{"zone":"IX","terrain":"Half Dome East Apron"},{"zone":"X","terrain":"Far-Bank Highland Pueblo"}],"people":[["Imani","A western saddle mechanic and June’s guardian. She hears a split in the pack frame before she sees water at the seam."],["June","Ruth’s daughter. She wants to hear the end of her mother’s film and decide what can be played outside the family."],["Etta","Print keeper at Silver Ford. She can license the wedding and witness June’s household claim."],["Tess","Cooling operator at the plaza. She records public water and rack water on two different slips."],["Saba","Keeper of the basalt pump. She can close the intake even when the remote map shows a full tank."],["Rahel","Sound runner on the night route. She knows the singers by the chairs they move before a take."],["The aunt","Custodian of three rehearsal takes. She can grant listening at home and sing a single public answer in person."],["Mistletoe","A living carrier. The wet saddle keeps the recording legible in motion, including on Woody’s roof. Her western namesake traveled into the Sierra with Ansel Adams and Francis Holman."]],"law":[["Water and WiFi","A live can holds up to 20 L. A donkey keeps its moving recording in order. A dry can loses its traveling copies. An approved recording saved on its recipient’s phone survives."],["At a marked pump","A routine draw stops at the well’s reserve. An emergency draw below the line closes that well for at least two local shift changes and until its level recovers. Cisterns receive water. Only wells produce it."],["The return mark","The first four liters aboard are set aside for travel and animal care. Cooling, the public tap and the grove draw from the water above that mark. An explicit emergency release can empty the whole can."],["Flight","Imani and Mistletoe fly together in Woody. A local flight drinks 1 L. A direct crossing to or from the far Teton landing drinks 2 L. Select a destination and then land. Roads remain passable on a dry return."],["Time and care","A shift has 18 watches. A road leg uses its posted time and one measure of strength per watch. Rest restores three strength. A drink from the can restores all six. At the last watch there is always a handoff, including a safe landing."],["Two circuits","Time advances on the active circuit. Switching hands opens the other carrier’s log at their own stop. Wells, people, letters and saddle water stay where they were."],["A print and its custody","A custodian grants the cut for the public sheet and the take for a named listener. The private recording stays under the awning. A credit or correction travels in a wet can back to the original rack."],["The photographic line","Adams’s Sierra pack burro and roof-mounted camera deck return in the fictional flying Woody. A field plate records the maker, stop and exposure zone. A film tree can show a local plate once it is awake."]],"origin":[{"title":"DONKEY WATER SCIFI","url":"https://youtu.be/ZZlDs10FCZk"},{"title":"THRESHOLD / zones","url":"https://hartswf0.github.io/make-photo/zones/"},{"title":"The Ansel Adams Gallery / timeline","url":"https://www.anseladams.com/pages/ansel-adams-timeline"}],"storyGrammar":[["LOOK","Read the place, its witnesses and available equipment. Reading a room costs no time."],["PUMP / OVERDRAW","Fill at a marked well. An emergency draw has a separate confirmation and a lasting cost."],["GO \u003cstop>","Walk a connected road with the animal and the live cargo."],["TAKE OFF / FLY \u003cstop> / LAND","Lift off in Woody in the west, commit the wet travel cost, then land with the donkey and the can."],["ASK / COOL / COPY","See the custodian, fund the clean rack branch, then dock the saddle and take the licensed cuts."],["WATER / REST / TAP","Water the animal, rest at a stop or allocate water to households."],["AERIAL / SCREEN / LISTEN / FILE","Wake local film trees, exhibit only the licensed cut, leave the household copy on its recipient’s phone and return the correction."],["EXPOSE / PROJECT","Make a field plate and hang it on a frond where a projection is permitted."],["MAP / JOURNAL / BOOK","Read the atlas, turn transcript or worldtext. Each view preserves the active place."],["HANDOFF / SWITCH","Close the local watch or take up the other circuit. The well remembers what was drawn."]],"starts":{"west":"overlook","ahiya":"basalt"},"sidePost":{"west":{"from":"oxbow","to":"switchback","name":"The baker’s price slip","ask":"Nell needs the current meal price before she bakes tomorrow’s order.","reply":"Six measures a sack, marked with this morning’s date.","delivered":"Nell writes the dated price on her flour bin. The chalk survives after the can is empty."},"ahiya":{"from":"basalt","to":"beacon","name":"Three sounds from one room","ask":"The children challenge the ridge crew to name a rasping sound.","reply":"The ridge team guesses a cooling fan. Rahel’s cousin wagers it was a spoon on a washboard.","delivered":"The children turn over a washboard and laugh. They set aside three sounds for the next run."}},"transitionTable":[{"verb":"pump","requires":"at well, open, can has space, stock above floor","effects":"transfer min(can space, well stock − floor); top up return water to 4 L","watches":1},{"verb":"overdraw","requires":"at open well exactly at its floor, space aboard, player confirms","effects":"draw min(4, can space, stock); close the well for two local handoffs and until stock exceeds floor","watches":1},{"verb":"go:\u003cstop>","requires":"ground, adjacent road, enough watches and animal strength","effects":"move both carrier and can; spend the edge time and the same strength","watches":"edge.watches"},{"verb":"launch","requires":"western ground stop, live water, positive strength, watch available","effects":"put Woody, Mistletoe and the can in the air","watches":0},{"verb":"fly:\u003cstop>","requires":"airborne, different western stop, 1 L available or 2 L for the far Tetons","effects":"set destination; spend travel water from reserve first; reduce strength by one; require landing","watches":1},{"verb":"land","requires":"air or crossing","effects":"land at the destination or return to the departure dock with the cargo","watches":0},{"verb":"rest","requires":"ground, strength below six","effects":"restore up to three strength","watches":1},{"verb":"water","requires":"ground, at least one liter, strength below six","effects":"spend one liter beginning with the reserve; restore full strength","watches":1},{"verb":"ask","requires":"at the custodian, first receipt","effects":"license separate household and public cuts","watches":1},{"verb":"invite","requires":"Ahiya beacon, permit granted, invitation open","effects":"aunt accepts the single public performance at the compound","watches":1},{"verb":"cool","requires":"at the archive, cooler not yet supplied for this order, at least 9 free liters","effects":"move 9 L to the clean cooling ledger; open the master rack","watches":1},{"verb":"copy","requires":"at archive, live water, cooling and permission, an outstanding cut","effects":"load outstanding licensed cuts into wet storage","watches":1},{"verb":"tap","requires":"at a public tap, at least four free liters, new local shift","effects":"give four liters to the household line and obtain its receipt","watches":1},{"verb":"release","requires":"at a public tap with water, player confirms","effects":"release entire can; discard wet-only copies; preserve authorized phone copies","watches":1},{"verb":"aerial","requires":"at a dormant western grove, wet can, local antenna height meets threshold","effects":"wake each reachable local grove; retain it across shifts","watches":1},{"verb":"expose","requires":"ground, new stop and zone combination","effects":"record plate, maker, place, zone and shift","watches":1},{"verb":"project","requires":"active grove or Ahiya compound, owned plate, unshown here, one free liter","effects":"hang latest field exposure and transfer one liter to the reader","watches":1},{"verb":"screen","requires":"licensed public cut in wet storage, correct yard, three free liters; grove awake in west or aunt invited in Ahiya","effects":"transfer three liters to the root bowl; record one public showing","watches":1},{"verb":"listen","requires":"named yard, unreceived household cut on saddle","effects":"recipient keeps a phone copy; leave reply in phone and wet water; remove delivered private take from saddle","watches":1},{"verb":"reply","requires":"named yard, family heard its cut, reply still outstanding, live can","effects":"copy the family phone’s reply back to wet storage","watches":1},{"verb":"file","requires":"at source archive, family heard its cut, return reply aboard, open request","effects":"file the requested credit or second take; preserve the old master","watches":1},{"verb":"witness","requires":"western registry, Etta’s permission and witness offer, unentered claim","effects":"enter Imani as June’s guardian; spend two watches","watches":2},{"verb":"mail / mailanswer / mailreturn","requires":"meet the requester, respondent and requester again on their own circuit, with a live letter","effects":"carry an outgoing request and return a dated answer","watches":1},{"verb":"handoff","requires":"ground, player confirms","effects":"preserve location and cargo; start the next local shift; replenish local wells up to capacity; recover strength","watches":0},{"verb":"switch","requires":"the other circuit exists","effects":"change perspective; keep both sets of liters, permissions, local time and messages in place","watches":0}],"entities":["circuit","carrier","donkey","saddle can","return reserve","well","relay","Woody","archive","wet copy","phone copy","custodian","film grove","field plate","dispatch slip"],"invariants":["0 \u003c= reserve \u003c= min(4, liters) \u003c= 20","drawn == aboard + cooling + public tap + grove + animal + flight","liters == 0 implies all wet copies clear","reading or changing perspective spends zero water and zero watches","a household take never enters the public screening action"],"initialState":{"schema":1,"rev":0,"active":"west","routes":{"west":{"place":"overlook","phase":"ground","dest":null,"day":1,"watch":0,"strength":6,"liters":0,"reserve":0,"wet":[],"phone":[],"flags":{},"wells":{"overlook":{"stock":32,"closed":0,"resting":false},"apron":{"stock":29,"closed":0,"resting":false}},"zone":5,"plates":[],"visited":["overlook"],"awake":["g1","g7","g8"],"projected":[],"side":0,"lastTap":0,"ledger":{"drawn":0,"cooling":0,"tap":0,"screen":0,"animal":0,"flight":0},"log":[{"day":1,"watch":0,"place":"overlook","verb":"Shift opened","text":"June’s wedding film ends when the bride drops her shoe. “Mum left the camera running,” she says, winding one earphone around her thumb. Mistletoe waits under the cold pump."}],"handovers":0},"ahiya":{"place":"basalt","phase":"ground","dest":null,"day":1,"watch":0,"strength":6,"liters":0,"reserve":0,"wet":[],"phone":[],"flags":{},"wells":{"basalt":{"stock":30,"closed":0,"resting":false}},"zone":5,"plates":[],"visited":["basalt"],"awake":[],"projected":[],"side":0,"lastTap":0,"ledger":{"drawn":0,"cooling":0,"tap":0,"screen":0,"animal":0,"flight":0},"log":[{"day":1,"watch":0,"place":"basalt","verb":"Shift opened","text":"Saba unties the chalk from the lower pump. Rahel wants the rehearsal her cousin recorded on the far side of the ridge. She knows the take by the sound of a chair scraping before the first note."}],"handovers":0}}}}</script>

<script id="book-data" type="application/json">{"worldtext":"# Donkey Water, 2086 · Night Post\n\n## Worldtext\n\nMistletoe stops under the pump because Imani has taken her hand off the rein. June holds out a cup. On the rack uphill, in a room where nobody has heard of June, a reel runs eight seconds past the place everybody remembers. The girl and the machine are waiting for the same animal.\n\n## Ahiya after sundown\n\nSaba keeps a piece of thread on the pump to show where the last public draw ended. Children on the ridge can see the light in the can before they hear the pack. One comes out to send a rehearsal. Another wants to play a guessing game that lasts the time it takes a donkey to go there and back.\n\n## The western Basin\n\nInside the archive window, the cooler has already signed for its share. Outside, a woman has put her chair beside the tap to sign for what reaches the yard. The two numbers have had a habit of saying different things. Imani can ask the woman to stay. It will cost her the next leg of daylight.\n\n## How film grows\n\nEtta wrapped a ruined reel around a cottonwood cutting and put its root in an enamel bowl. After the third wet season the tree made leaves with sprocket holes of their own. A screening takes three liters. A phone holds the sound beneath the sheet even after the bowl is dry.\n\n## The far landing\n\nFrom the Woody’s roof, the range appears close enough to touch. Then the wheels leave the last escarpment and the second liter goes through the saddle. Mistletoe turns her head to watch the valley recede. In the letters aboard, the people waiting are already talking about tomorrow.\n\n## The circle of play\n\n**Invitation**  \nTake a sealed can and a request. Decline the screening, close the shift early or change carriers.\n\n**Player**  \n\u003ccarrier> chooses who receives the next available measure and who may receive the recording.\n\n**Boundary**  \nOne local shift holds eighteen forty-minute watches. Menus and reading live outside the clock.\n\n**Material**  \n\u003cwell>, \u003ccan>, \u003cdonkey>, \u003cphone> and \u003cmaster> each hold a different part of a delivery.\n\n**Moves**  \n[draw], [walk], [fly], [dock], [screen], [listen], [return] and [handoff] change the world.\n\n**Consent**  \nThe listener and custodian set the audience. A private voice stays in the earphone.\n\n**Uncertainty**  \nA well can close after an emergency draw. An answer can wait in a phone after its traveling copy dries.\n\n**Illusion**  \nThe office can see a complete route while a child still has an empty cup. Read the separate receipts.\n\n**Break in play**  \nDump the full can at the tap and an undelivered recording disappears. Carry the consequence to the next visit.\n\n**Change test**  \nComplete the same order by the road and by air. Compare who you met, liters remaining, watches used and the condition of the animal.\n\n## Western Basin\n\nJune knows where the bride loses her shoe. Her mother left the camera running afterward. There are eight more seconds on the hill master. June wants to hear them.\n\n### Overlook Wellhead\n\nThe pump keeper has chalked a white line across the can. Four liters belong to the animal and the return. The casting says HAND PUMP. Somebody has scratched two smaller words into the handle. BOTH WAYS. A girl in the yard is holding a cup in exactly the way grown people hold a microphone.\n\n### Moraine Switchback Cistern\n\nA wooden trough sits in the lee of the bluff. The relief keeper has hung the resting animals’ names beside the wage book. A mended saddle pad is drying inside out. From the cut in the road you can make out five loops of perforated film against the lighter pines. A stallholder chalks the price of meal onto a box.\n\n### Silver Ford Relay\n\nEtta keeps the key to the wedding master on a length of cotton. She is sitting where the old ferry rope once met the bank. One ferryman points to the wet post. His brother points to a stone some distance away. From the camera’s height the two landmarks line up. An enamel bowl has taken root on the island.\n\n### Cottonwood Oxbow Kiosk\n\nTwo sheets hang at different depths. The cup, the root bowl and June’s phone all wait on the same bench. Etta bound a damaged reel along a young cottonwood shoot. Three wet seasons later the shoot put out a leaf with square holes along its edge. A baker has a price slip for the far bank.\n\n### Highland Pueblo Plaza\n\nTess can see the coolant gauge in the reflection of June’s empty cup. The archive dock and the household tap face the same line. Behind the wire glass, a hose knocks twice. The registrar has a line for a deed holder. She keeps the rest of the page blank for guardians who bring their own witness.\n\n### Whale Fluke Cistern\n\nThe roofs give way to the ribs of a wreck. Between them the projectionist stretches a strip of cloth wide enough for two endings. Two screenings went out on the tide. Both poles kept their seats. The film keeper has a comedy in two captions and two wooden chairs for people who remember the joke differently.\n\n### Half Dome East Apron\n\nA second licensed pump draws from a narrow seep. A retired keeper wants the missing angle of a brass float recorded. The keeper can free the float with half a turn of her wrist. In the old film her sleeve covers her hand. She has left a flat place on the shelf for a new camera.\n\n### Teton Range Landing\n\nThe survey cairn throws a short shadow. The road below bends out of sight well before the next gleam of water. On the roof deck the tripod holes sit under the saddle cradle. Looking down, you can count three valleys by the turns a carrier would have to make. The cairn holds a dry dispatch box.\n\n## Ahiya Highlands\n\nRahel can tell her cousin’s recording by a chair scraping just before the first note. Her aunt wants the three rehearsal takes back. She will sing the answer herself if the compound gives her a night.\n\n### Basalt Pump\n\nSaba listens for the short stroke before she opens the valve. A clean line of chalk marks the well’s reserve. The wind between pump strokes sounds like somebody breathing in to sing. In the handle’s shadow a piece of thread marks the height of the last entirely public draw.\n\n### Cross-Beacon Watch\n\nThe congregation lends its high wall to the watch. Different people give the beam different names. Rahel’s aunt has folded a rehearsal sheet into her pocket. She lets people hear an early entrance in the wrong key if they will listen to what the other singer did next.\n\n### Hill Archive\n\nOne operator logs the crossing. Another clears a space on the shelf for the returning rehearsal. The fans carry on between sightings. A map can tell the operator where a can was seen. To learn who sang the lower voice she needs a recording and someone who knows the family. Saba’s signed gauge reading lies under the keyboard.\n\n### Daylight Compound\n\nTwo people take the handles before the pack frame comes away. The phones go dark in the direct morning sun. A clay bowl sits beside the household tap. There is a stool for a singer under the awning. Somebody has pegged an ordinary sheet between the walls for tonight’s backing reel.\n\n## People and custody\n\n**Imani**  \nA western saddle mechanic and June’s guardian. She hears a split in the pack frame before she sees water at the seam.\n\n**June**  \nRuth’s daughter. She wants to hear the end of her mother’s film and decide what can be played outside the family.\n\n**Etta**  \nPrint keeper at Silver Ford. She can license the wedding and witness June’s household claim.\n\n**Tess**  \nCooling operator at the plaza. She records public water and rack water on two different slips.\n\n**Saba**  \nKeeper of the basalt pump. She can close the intake even when the remote map shows a full tank.\n\n**Rahel**  \nSound runner on the night route. She knows the singers by the chairs they move before a take.\n\n**The aunt**  \nCustodian of three rehearsal takes. She can grant listening at home and sing a single public answer in person.\n\n**Mistletoe**  \nA living carrier. The wet saddle keeps the recording legible in motion, including on Woody’s roof. Her western namesake traveled into the Sierra with Ansel Adams and Francis Holman.\n\n## Rules of the road\n\n**Water and WiFi**  \nA live can holds up to 20 L. A donkey keeps its moving recording in order. A dry can loses its traveling copies. An approved recording saved on its recipient’s phone survives.\n\n**At a marked pump**  \nA routine draw stops at the well’s reserve. An emergency draw below the line closes that well for at least two local shift changes and until its level recovers. Cisterns receive water. Only wells produce it.\n\n**The return mark**  \nThe first four liters aboard are set aside for travel and animal care. Cooling, the public tap and the grove draw from the water above that mark. An explicit emergency release can empty the whole can.\n\n**Flight**  \nImani and Mistletoe fly together in Woody. A local flight drinks 1 L. A direct crossing to or from the far Teton landing drinks 2 L. Select a destination and then land. Roads remain passable on a dry return.\n\n**Time and care**  \nA shift has 18 watches. A road leg uses its posted time and one measure of strength per watch. Rest restores three strength. A drink from the can restores all six. At the last watch there is always a handoff, including a safe landing.\n\n**Two circuits**  \nTime advances on the active circuit. Switching hands opens the other carrier’s log at their own stop. Wells, people, letters and saddle water stay where they were.\n\n**A print and its custody**  \nA custodian grants the cut for the public sheet and the take for a named listener. The private recording stays under the awning. A credit or correction travels in a wet can back to the original rack.\n\n**The photographic line**  \nAdams’s Sierra pack burro and roof-mounted camera deck return in the fictional flying Woody. A field plate records the maker, stop and exposure zone. A film tree can show a local plate once it is awake.\n\n## The photographic record\n\n[DONKEY WATER SCIFI](https://youtu.be/ZZlDs10FCZk)\n\n[THRESHOLD / zones](https://hartswf0.github.io/make-photo/zones/)\n\n[The Ansel Adams Gallery / timeline](https://www.anseladams.com/pages/ansel-adams-timeline)\n","gametext":"# Donkey Water · Night Post / Gametext\n\nUse buttons or the command line. Each line below is generated by an actual playthrough.\n\n## Command grammar\n\n**LOOK**  \nRead the place, its witnesses and available equipment. Reading a room costs no time.\n\n**PUMP / OVERDRAW**  \nFill at a marked well. An emergency draw has a separate confirmation and a lasting cost.\n\n**GO \u003cstop>**  \nWalk a connected road with the animal and the live cargo.\n\n**TAKE OFF / FLY \u003cstop> / LAND**  \nLift off in Woody in the west, commit the wet travel cost, then land with the donkey and the can.\n\n**ASK / COOL / COPY**  \nSee the custodian, fund the clean rack branch, then dock the saddle and take the licensed cuts.\n\n**WATER / REST / TAP**  \nWater the animal, rest at a stop or allocate water to households.\n\n**AERIAL / SCREEN / LISTEN / FILE**  \nWake local film trees, exhibit only the licensed cut, leave the household copy on its recipient’s phone and return the correction.\n\n**EXPOSE / PROJECT**  \nMake a field plate and hang it on a frond where a projection is permitted.\n\n**MAP / JOURNAL / BOOK**  \nRead the atlas, turn transcript or worldtext. Each view preserves the active place.\n\n**HANDOFF / SWITCH**  \nClose the local watch or take up the other circuit. The well remembers what was drawn.\n\n## The last eight seconds\n\nDonkey Water · Night Post\nCarrier log · Imani\n\nShift 1 · 18:00 · Overlook Wellhead\n  Shift opened\n  June’s wedding film ends when the bride drops her shoe. “Mum left the camera running,” she says, winding one earphone around her thumb. Mistletoe waits under the cold pump.\n\nShift 1 · 18:40 · Overlook  · 00:40 · Cottonwood Oxbow Kiosk\n  Walk to Cottonwood Oxbow Kiosk\n  You walk one watch to Cottonwood Oxbow Kiosk. Two sheets hang at different depths. The cup, the root bowl and June’s phone all wait on the same bench.\n\nShift 1 · 01:20 · Cottonwood Oxbow Kiosk\n  Raise the saddle aerial\n  Cottonwood Oxbow Film Forest opens 5 film trees. Tonight’s program is “A double bill chosen by the yard.”\n\nShift 1 · 02:00 · Cottonwood Oxbow Kiosk\n  Screen the public wedding cut\n  The bride steps off the ferry. A shoe falls through the boards. In the front row the bride, now an old woman, raises her own foot a second before it happens.\n\nShift 1 · 02:40 · Cottonwood Oxbow Kiosk\n  Let June hear the last eight seconds\n  A thumbnail against a latch. A breath close to the microphone. A laugh from farther down the ferry. June turns her phone face down to listen again. “Put down that she made the picture. Leave a space for who was laughing.” The return message is in the wet can and on the family phone.\n\nShift 1 · 03:20 · Highland Pueblo Plaza\n  Walk to Highland Pueblo Plaza\n  You walk one watch to Highland Pueblo Plaza. Tess can see the coolant gauge in the reflection of June’s empty cup. The archive dock and the household tap face the same line.\n\nShift 1 · 04:00 · Highland Pueblo Plaza\n  File Ruth’s camera credit\n  Tess takes June’s correction. The catalog now names Ruth as camera operator. A separate space stays open for the voice at the end. The public showing is in the yard’s book.\n\n## The chair in the harmony\n\nDonkey Water · Night Post\nCarrier log · Rahel\n\nShift 1 · 18:00 · Basalt Pump\n  Shift opened\n  Saba unties the chalk from the lower pump. Rahel wants the rehearsal her cousin recorded on the far side of the ridge. She knows the take by the sound of a chair scraping before the first note.\n\nShift 1 · 18:40 · Basalt Pump\n  Draw 20 L\n  The keeper weighs 20 L into the saddle. 10 L remain in the well. 4 L aboard carry the animal’s chalk mark.\n\nShift 1 · 19:20 · Cross-Beacon Watch\n  Walk to Cross-Beacon Watch\n  You walk one watch to Cross-Beacon Watch. The congregation lends its high wall to the watch. Different people give the beam different names.\n\nShift 1 · 20:00 · Cross-Beacon Watch\n  Ask the aunt’s permission\n  At the white wall the aunt grants household listening. She will allow the backing at one public performance if she can sing the answer there herself.\n\nShift 1 · 20:40 · Cross-Beacon Watch\n  Invite the aunt to sing in person\n  The aunt sends her stool ahead to the compound. She agrees to one performance and keeps custody of her rehearsal.\n\nShift 1 · 21:20 · Hill Archive\n  Walk to Hill Archive\n  You walk one watch to Hill Archive. One operator logs the crossing. Another clears a space on the shelf for the returning rehearsal. The fans carry on between sightings.\n\nShift 1 · 22:00 · Hill Archive\n  Send 9 L to the cooler\n  The hill keeper opens the inner rack. Nine liters pass into the clean cooling branch. Three versions of the same verse turn up in the catalog.\n\nShift 1 · 22:40 · Hill Archive\n  Dock and load the licensed cuts\n  The hill keeper writes the listening takes and the permitted backing to the saddle water. The sealed lacquer label names the aunt as custodian.\n\nShift 1 · 23:20 · Daylight Compound\n  Walk to Daylight Compound\n  You walk one watch to Daylight Compound. Two people take the handles before the pack frame comes away. The phones go dark in the direct morning sun.\n\nShift 1 · 00:00 · Daylight Compound\n  Pour 4 L at the public tap\n  Four liters reach the waiting cups. A household witness signs a different slip from the one on the cooling meter.\n\nShift 1 · 00:40 · Daylight Compound\n  Play the backing for the aunt\n  Her aunt sings the answer in the flesh while the approved backing plays from the root bowl. Someone catches the wrong-key entrance and sings it back. The whole yard knows that take.\n\nShift 1 · 01:20 · Daylight Compound\n  Pass the rehearsal earphone\n  Rahel passes her aunt the earphone. In the third take a chair scrapes stone. She knows at once which cousin sat where. The aunt keeps a listening copy on her own phone. “Keep the wrong one too. That’s the only one where we all came in together.” The return message is in the wet can and on the family phone.\n\nShift 1 · 02:00 · Hill Archive\n  Walk to Hill Archive\n  You walk one watch to Hill Archive. One operator logs the crossing. Another clears a space on the shelf for the returning rehearsal. The fans carry on between sightings.\n\nShift 1 · 02:40 · Hill Archive\n  File the second harmony\n  The hill keeper files the aunt’s new answer beside the cousin’s first take. Both names stay with the rehearsal, and only their households receive the listening copies. The public showing is in the yard’s book.\n\n## A different return\n\nAt the plaza, choose GIVE THE WHOLE CAN TO THE YARD and confirm. The yard gets the water, and any undelivered wet recording clears. A family phone that already received its take still holds the reply. Refill at a marked station, meet the family again and carry the reply back.\n","example":"PUMP → GO SWITCHBACK → GO FORD → ASK → GO OXBOW → GO PLAZA → COOL → COPY → TAP → GO OXBOW → AERIAL → SCREEN → LISTEN → GO PLAZA → FILE."}</script>
<script>/* A pure turn engine. The interface, command line and tests use the same choices. */
function NightPost(world) {
  "use strict";
  const L = world.limits;
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const unique = (list, value) => { if (!list.includes(value)) list.push(value); };
  const idOf = (s) => s.active;
  const carrier = s => s.routes[idOf(s)];
  const charter = s => world.circuits[idOf(s)];
  const free = c => c.liters - c.reserve;
  const wet = (c, what) => c.wet.includes(what);
  const here = c => world.places[c.place];
  const reaches = c => world.groves.filter(g => g.station === c.place);
  function clock(t) {
    const minutes = (18 * 60 + t * 40) % (24 * 60);
    return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2,'0');
  }
  function newCarrier(key) {
    const q = world.circuits[key];
    const wells = Object.fromEntries(Object.entries(world.wells).filter(([k]) => world.places[k].circuit === key)
      .map(([k,w]) => [k,{stock:w.stock,closed:0,resting:false}]));
    return {place:q.home, phase:"ground", dest:null, day:1, watch:0, strength:L.maxStrength,
      liters:0, reserve:0, wet:[], phone:[], flags:{}, wells, zone:5, plates:[], visited:[q.home],
      awake:key==="west" ? world.groves.filter(g=>g.open).map(g=>g.id) : [],
      projected:[], side:0, lastTap:0, ledger:{drawn:0,cooling:0,tap:0,screen:0,animal:0,flight:0},
      log:[{day:1,watch:0,place:q.home,verb:"Shift opened",text:q.opening}], handovers:0};
  }
  function start() { return {schema:1,rev:0,active:"west",routes:{west:newCarrier("west"),ahiya:newCarrier("ahiya")}}; }
  function validate(s) {
    if (!s || s.schema!==1 || !Number.isInteger(s.rev) || !Object.hasOwn(world.circuits,s.active) || !s.routes) return false;
    return Object.keys(world.circuits).every(key=>{
      const c=s.routes[key];
      if(!c || world.places[c.place]?.circuit!==key || !["ground","air","crossing"].includes(c.phase)) return false;
      if(c.phase==="crossing" && world.places[c.dest]?.circuit!==key) return false;
      if(!Number.isInteger(c.liters)||c.liters<0||c.liters>L.capacity||!Number.isInteger(c.reserve)||c.reserve<0||c.reserve>Math.min(L.reserve,c.liters)) return false;
      if(!Number.isInteger(c.watch)||c.watch<0||c.watch>L.watches||!Number.isInteger(c.day)||c.day<1||!Number.isInteger(c.strength)||c.strength<0||c.strength>L.maxStrength) return false;
      if(![c.wet,c.phone,c.visited,c.plates,c.awake,c.projected,c.log].every(Array.isArray)||!c.log.length||!c.flags||!c.ledger||!c.wells)return false;
      if(!Number.isInteger(c.zone)||c.zone<0||c.zone>10||!Number.isInteger(c.side)||c.side<0||c.side>3) return false;
      for(const [id,w] of Object.entries(world.wells)) {
        if(world.places[id].circuit!==key) continue;
        const state=c.wells[id];
        if(!state||!Number.isInteger(state.stock)||state.stock<0||state.stock>w.capacity||!Number.isInteger(state.closed)||state.closed<0) return false;
      }
      const ledgerKeys=["drawn","cooling","tap","screen","animal","flight"];
      if(!ledgerKeys.every(k=>Number.isInteger(c.ledger[k])&&c.ledger[k]>=0))return false;
      return c.ledger.drawn===c.liters+ledgerKeys.slice(1).reduce((n,k)=>n+c.ledger[k],0);
    });
  }
  function safeDraw(c) {
    const w=c.wells[c.place], defs=world.wells[c.place];
    return w&&!w.resting?Math.max(0,Math.min(L.capacity-c.liters,w.stock-defs.floor)):0;
  }
  function emergencyDraw(c) {
    const w=c.wells[c.place], defs=world.wells[c.place];
    if(!w || w.resting || w.stock>defs.floor) return 0;
    return Math.min(L.emergencyLiters,w.stock,L.capacity-c.liters);
  }
  function flightWater(a,b){return a==="tetons"||b==="tetons"?2:1;}
  function waterIn(c,n){
    c.liters+=n;
    c.reserve+=Math.min(n,L.reserve-c.reserve);
    c.ledger.drawn+=n;
  }
  function waterOut(c,n,account,takesReserve=false){
    if(n<0 || n>(takesReserve?c.liters:free(c))) throw Error("Unavailable water");
    if(takesReserve)c.reserve-=Math.min(c.reserve,n);
    c.liters-=n;c.ledger[account]+=n;
    if(c.liters===0)c.wet=[];
  }
  function options(s){
    const c=carrier(s), k=idOf(s), q=charter(s), a=[], pl=here(c), left=L.watches-c.watch;
    const item=(id,label,group,turns,reason="",detail="")=>{
      const why=reason || (turns>left?"The shift has "+left+" watches left. Hand off to continue.":"");
      a.push({id,label,group,turns,enabled:!why,reason:why,detail});
    };
    if(c.phase==="crossing"){
      item("land","Land together","work",0,"","Set Woody and Mistletoe down at "+world.places[c.dest].name+".");
      return a;
    }
    if(c.phase==="air"){
      for(const [id,p] of Object.entries(world.places)){
        if(p.circuit!==k || id===c.place)continue;
        const n=flightWater(c.place,id);
        item("fly:"+id,id==="tetons"?"Fly to the far Tetons":"Fly to "+p.name,"travel",1,c.liters<n?"The crossing needs "+n+" L.":"",n+" L in flight");
      }
      item("land","Land back at "+pl.name,"work",0,"","Return to the departure dock.");
      return a;
    }
    const w=c.wells[c.place];
    if(w){
      const amt=safeDraw(c),n=emergencyDraw(c);
      item("pump",amt?"Draw "+amt+" L":"Draw at the pump","work",1,amt?"":w.resting?"The well is resting. Its float must recover over shift changes.":c.liters===L.capacity?"The 20 L can is full.":"The chalk reserve has been reached.","Refill to the safe line.");
      if(n>0)item("overdraw","Draw "+n+" L below the chalk","extra",1,"","Closes this well for at least two local handoffs.");
    }
    if(c.place===q.permission){
      if(!c.flags.permit)item("ask",k==="west"?"Ask Etta for the two cuts":"Ask the aunt’s permission","work",1);
      if(k==="ahiya"&&c.flags.permit&&!c.flags.invited)item("invite","Invite the aunt to sing in person","work",1);
    }
    if(c.place===q.hub){
      if(!c.flags.cooled)item("cool","Send 9 L to the cooler","work",1,free(c)<L.cooling?"Needs 9 L above the return mark.":"","Opens this order’s master rack.");
      if((!c.flags.shown && !wet(c,"public")) || (!c.flags.listened && !wet(c,"private")))item("copy","Dock and load the licensed cuts","work",1,!c.flags.permit?"The custodian must license the cuts.":!c.flags.cooled?"The master rack needs cooling.":!c.liters?"Bring a live can to the dock.":"");
      if(c.flags.listened&&!c.flags.filed)item("file",k==="west"?"File Ruth’s camera credit":"File the second harmony","work",1,wet(c,"reply")?"":"Load the phone’s reply into live water at the yard.");
      if(k==="west"&&c.flags.permit&&!c.flags.witnessed)item("witness","Enter Etta as June’s witness","extra",2,"","Give up two watches at the registry window.");
    }
    if(c.place===q.yard){
      if(!c.flags.listened)item("listen",k==="west"?"Let June hear the last eight seconds":"Pass the rehearsal earphone","work",1,!wet(c,"private")?"Bring the licensed household take from the rack.":"");
      if(!c.flags.shown)item("screen",k==="west"?"Screen the public wedding cut":"Play the backing for the aunt","work",1,!wet(c,"public")?"Bring the public cut from the archive.":(k==="west"&&!reaches(c).some(g=>c.awake.includes(g.id)))?"Raise the saddle aerial at Oxbow to wake the filmstrip.":(k==="ahiya"&&!c.flags.invited)?"Invite the aunt at the beacon. She sings the answer live.":free(c)<L.screen?"The root bowl needs 3 L above the return mark.":"","3 L to the root bowl");
      if(c.flags.listened&&!c.flags.filed&&!wet(c,"reply"))item("reply","Load the reply from the family phone","work",1,!c.liters?"A traveling reply needs a wet can.":"");
    }
    if(c.place===(k==="west"?"plaza":"compound")){
      item("tap","Pour 4 L at the public tap","work",1,c.lastTap===c.day?"This shift’s public cup round is complete.":free(c)<L.tap?"Needs 4 L above the return mark.":"");
      if(c.liters)item("release","Give the whole can to the yard","extra",1,"","Includes the return share. Wet-only recordings will be lost.");
    }
    const side=world.sidePost[k];
    if(c.side<3){
      if(c.place===side.from && (c.side===0 || (c.side===1&&!wet(c,"post"))))item("mail","Collect the short post","extra",1,c.liters?"":"Letters travel in wet water.",side.ask);
      if(c.place===side.to && ((c.side===1&&wet(c,"post"))||(c.side===2&&!wet(c,"postReply"))))item("mailanswer","Collect the far-end answer","extra",1,c.liters?"":"Bring some wet water.",side.name);
      if(c.place===side.from && c.side===2 && wet(c,"postReply"))item("mailreturn","Deliver the short reply","extra",1,"",side.name);
    }
    const closed=reaches(c).filter(g=>!c.awake.includes(g.id));
    if(closed.length)item("aerial","Raise the saddle aerial",c.place===q.yard?"work":"extra",1,!c.liters?"The aerial needs live saddle water.":!closed.some(g=>pl.altitude>=g.height)?"Find higher ground on this route.":"","Wake the film trees at this stop.");
    const plate=c.plates.find(p=>p.place===c.place&&p.zone===c.zone);
    item("expose","Expose an 8×10 plate","extra",1,plate?"You already hold this exposure from this stop.":"","Zone "+world.zones[c.zone].zone);
    if(k==="west"&&reaches(c).length || k==="ahiya"&&c.place==="compound"){
      const canProject=k==="ahiya"||reaches(c).some(g=>c.awake.includes(g.id));
      item("project","Hang your field plate","extra",1,!c.plates.length?"Make a field plate first.":!canProject?"Raise the aerial to wake the grove.":free(c)<1?"The reader needs 1 L above the return mark.":c.projected.includes(c.place+"|"+c.plates[c.plates.length-1].id)?"This plate already hangs here.":"","1 L to the reader · latest exposure");
    }
    if(c.strength<L.maxStrength){
      item("rest","Rest the pack","care",1,"","Recover up to three strength.");
      item("water","Water the animal","care",1,c.liters?"":"The can is empty. Rest is available.","1 L restores full strength.");
    }
    for(const road of world.roads){
      const id=road.a===c.place?road.b:road.b===c.place?road.a:null;
      if(id)item("go:"+id,"Walk to "+world.places[id].name,"travel",road.watches,c.strength<road.watches?"Rest the animal before this leg.":"","Road · "+road.watches+" strength");
    }
    if(q.flight)item("launch","Take off in Woody","travel",0,!c.liters?"Pump water for Mistletoe before flying.":!c.strength?"Rest Mistletoe before taking off.":left<1?"Hand off before committing to a flight.":"","Mistletoe and the can ride on the roof.");
    item("handoff","Close this shift","shift",0,"","Pass the can and outstanding promises to the next shift.");
    return a;
  }
  function witnessResults(c) {
    const texts=[];
    for(const [id,w] of Object.entries(c.wells)){
      const base=world.wells[id],before=w.stock;
      w.stock=Math.min(base.capacity,w.stock+base.recharge);
      if(w.resting){
        w.closed=Math.max(0,w.closed-1);
        if(w.closed===0 && w.stock>base.floor){w.resting=false;texts.push(world.places[id].name+" reopens at "+w.stock+" L.");}
        else texts.push(world.places[id].name+" stays closed at "+w.stock+" L.");
      } else if(w.stock>before)texts.push(world.places[id].name+" rises to "+w.stock+" L.");
    }
    return texts;
  }
  function entry(c,id,t){
    c.log.push({day:c.day,watch:c.watch,place:c.place,verb:id,text:t});
    if(c.log.length>260)c.log.splice(0,c.log.length-260);
  }
  function act(s,id){
    const old=carrier(s),q=charter(s),k=idOf(s);
    const choice=options(s).find(it=>it.id===id);
    if(!choice||!choice.enabled)return {ok:false,state:s,text:choice?.reason||"This action belongs at another stop."};
    const n=clone(s),c=carrier(n),[v,arg]=id.split(":");
    const beforeWet=c.wet.length;
    c.watch+=choice.turns;
    let txt="",pl=here(c);
    switch(v){
      case "pump":case "overdraw":{
        const amt=v==="pump"?safeDraw(c):emergencyDraw(c);
        const well=c.wells[c.place];well.stock-=amt;waterIn(c,amt);
        if(v==="overdraw"){well.closed=L.overdraftShifts;well.resting=true;txt="The float drops below the chalk. "+amt+" emergency liters enter the can. The pump closes for at least two local handoffs.";}
        else txt="The keeper weighs "+amt+" L into the saddle. "+well.stock+" L remain in the well. "+c.reserve+" L aboard carry the animal’s chalk mark.";
        break;
      }
      case "ask":c.flags.permit=true;txt=q.permissionText;break;
      case "invite":c.flags.invited=true;txt="The aunt sends her stool ahead to the compound. She agrees to one performance and keeps custody of her rehearsal.";break;
      case "cool":waterOut(c,L.cooling,"cooling");c.flags.cooled=true;txt=q.coolText;break;
      case "copy":unique(c.wet,"public");if(!c.flags.listened)unique(c.wet,"private");txt=q.dockText;break;
      case "screen":waterOut(c,L.screen,"screen");c.flags.shown=true;txt=q.publicDesc;break;
      case "listen":
        c.flags.listened=true;unique(c.phone,"private");unique(c.phone,"reply");unique(c.wet,"reply");c.wet=c.wet.filter(x=>x!=="private");
        txt=q.privateDesc+" "+q.replyLine+" The return message is in the wet can and on the family phone.";break;
      case "reply":unique(c.wet,"reply");txt="The household phone touches the yard reader. Its saved reply travels in the saddle water again.";break;
      case "file":
        c.flags.filed=true;c.wet=c.wet.filter(x=>x!=="reply");txt=q.returnDesc+" "+(c.flags.shown?"The public showing is in the yard’s book.":"The public sheet is still folded.");break;
      case "witness":c.flags.witnessed=true;txt="The clerk rules a new line for Etta’s name. June can draw tomorrow’s household measure under Imani’s guardianship. The family keeps Ruth’s voice. Two watches pass at the window.";break;
      case "tap":waterOut(c,L.tap,"tap");c.lastTap=c.day;txt="Four liters reach the waiting cups. A household witness signs a different slip from the one on the cooling meter.";break;
      case "release":{
        const amt=c.liters;waterOut(c,amt,"tap",true);c.lastTap=c.day;txt=amt+" L go into the yard’s kettles. The return line stands empty. The donkey can walk to a pump after a rest.";break;
      }
      case "mail":c.side=1;unique(c.wet,"post");txt=world.sidePost[k].ask+" The outgoing slip is live in the can.";break;
      case "mailanswer":c.side=2;c.wet=c.wet.filter(x=>x!=="post");unique(c.wet,"postReply");txt=world.sidePost[k].reply;break;
      case "mailreturn":c.side=3;c.wet=c.wet.filter(x=>x!=="postReply");txt=world.sidePost[k].delivered;break;
      case "aerial":{
        const g=reaches(c).filter(x=>!c.awake.includes(x.id)&&pl.altitude>=x.height);
        g.forEach(x=>unique(c.awake,x.id));txt=g.map(x=>x.name+" opens "+x.trees+" film trees. Tonight’s program is “"+x.program+".”").join(" ");break;
      }
      case "expose":{
        const z=world.zones[c.zone].zone;
        c.plates.push({id:c.place+"/"+z,place:c.place,zone:c.zone,day:c.day,maker:q.carrier});
        txt=q.carrier+" exposes an 8×10 at "+pl.name+", Zone "+z+". The plate carries its maker and place on the back.";break;
      }
      case "project":{
        const p=c.plates[c.plates.length-1];waterOut(c,1,"screen");unique(c.projected,c.place+"|"+p.id);
        txt="Your plate of "+world.places[p.place].name+" falls across the linen at "+pl.name+". The strip carries "+p.maker+"’s field credit.";break;
      }
      case "rest":c.strength=Math.min(L.maxStrength,c.strength+L.restGain);txt="The pad comes off. The animal rolls once in the dust and stands easier. Strength is "+c.strength+" of "+L.maxStrength+".";break;
      case "water":waterOut(c,1,"animal",true);c.strength=L.maxStrength;txt="A liter goes into the clay bowl. The animal drinks, noses the rim and is ready for a full leg.";break;
      case "go":{
        c.strength-=choice.turns;c.place=arg;unique(c.visited,arg);
        txt="You walk "+(choice.turns===1?"one watch":"two watches")+" to "+here(c).name+". "+here(c).summary;break;
      }
      case "launch":c.phase="air";txt="The sail opens. Woody lifts with Mistletoe on the camera deck. The water stays coupled. Choose the crossing.";break;
      case "fly":{
        const amt=flightWater(c.place,arg);waterOut(c,amt,"flight",true);c.strength=Math.max(0,c.strength-1);c.phase="crossing";c.dest=arg;
        txt="The wagon crosses toward "+world.places[arg].name+". "+amt+" L go through the saddle on the passage. The landing is in sight.";break;
      }
      case "land":{
        const arrived=c.dest;if(arrived)c.place=arrived;c.dest=null;c.phase="ground";unique(c.visited,c.place);
        txt="Woody’s wheels settle at "+here(c).name+". Mistletoe and the can are still aboard. "+here(c).summary;break;
      }
      case "handoff":{
        const score=c.flags.filed?q.storyEnd:c.flags.listened?"The family has its recording. The catalog is still waiting for the return.":c.flags.cooled?"The rack is cool. The household request stays open.":"The request remains in the yard book.";

  }
  function downloadable(type){
    if(type==="downloadGame"){saveFile("Donkey_Water_Night_Post.html",originalHTML,"text/html;charset=utf-8");return;}
    if(type==="modeljson"){saveFile("Donkey_Water_World_Model.json",JSON.stringify(w,null,2),"application/json");return;}
    if(type==="worldtxt"){saveFile("Donkey_Water_Worldtext.md",books.worldtext,"text/markdown;charset=utf-8");return;}
    if(type==="gametxt"){saveFile("Donkey_Water_Gametext.md",books.gametext,"text/markdown;charset=utf-8");return;}
    if(type==="logtxt")saveFile("Donkey_Water_"+state.active+"_Transcript.txt",g.exportsFor(state),"text/plain;charset=utf-8");
  }
  function ui(id){
    if(["worldtxt","gametxt","modeljson","logtxt","downloadGame"].includes(id)){downloadable(id);return;}
    if(id==="yes"){const saved=confirming;confirming="";if(saved)act(saved,true);return;}
    if(id==="no"){confirming="";render();return;}
    if(id==="change"){swap();return;}
    if(id==="look"){view="play";reading=true;feedback="";confirming="";render();return;}
    if(id==="play"){changeView("play");return;}
    if(id==="objective"){selected=g.target(state)[0];changeView("atlas");return;}
    if(id==="flyhere"){flightTo(selected);return;}
    if(id==="earlier"){logMax+=30;render();}
  }
  function normalize(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
  function resolvePlace(v){
    const qv=normalize(v);if(!qv)return null;
    return listFor().find(k=>qv===k||qv===normalize(name(k)))||listFor().find(k=>normalize(name(k)).includes(qv));
  }
  function command(line){
    const cmd=normalize(line),[verb,...rest]=cmd.split(" "),obj=rest.join(" ");
    if(!cmd)return;
    if(cmd==="look"||cmd==="l"){ui("look");return;}
    if(["map","atlas","journal","log","book","help"].includes(cmd)){
      if(cmd==="help")book="commands";changeView(["map","atlas"].includes(cmd)?"atlas":["log","journal"].includes(cmd)?"log":"book");return;
    }
    if(["switch","switch route"].includes(cmd)){swap();return;}
    if(["worldtext","world model","gametext"].includes(cmd)){book=cmd==="worldtext"?"worldtext":cmd==="world model"?"model":"commands";changeView("book");return;}
    if(verb==="zone"){
      const i=w.zones.findIndex((z,j)=>z.zone.toLowerCase()===obj||String(j)===obj);
      if(i<0){note("Use ZONE 0 through X.");return;}commit(g.setZone(state,i));note("The exposure is set to Zone "+w.zones[i].zone+".");return;
    }
    if((verb==="go"||verb==="walk"||verb==="fly")&&obj){
      const target=resolvePlace(obj.replace(/^to (the )?/,""));
      if(!target){note("That stop is outside this circuit. The atlas lists local destinations.");return;}
      if(verb==="fly"){flightTo(target);return;}
      const next="go:"+target;
      if(!g.options(state).some(a=>a.id===next)){selected=target;changeView("atlas");note(target===c().place?"You are here.":"Use the marked first leg to reach this station.");return;}
      act(next);return;
    }
    if(cmd==="land"){act("land");return;}
    if(["yes","confirm"].includes(cmd)&&confirming){ui("yes");return;}
    if(["cancel","no"].includes(cmd)){ui("no");return;}
    if(cmd==="travel"){group="travel";render();return;}
    const synonyms={"take off":"launch","fly":"launch","water mistletoe":"water","water the animal":"water","register":"witness","give":"tap","dock":"copy","pump water":"pump","listen privately":"listen","send":"file","expose plate":"expose","raise aerial":"aerial","look around":"look","end shift":"handoff","read receipt":"file","take post":"mail","answer":"mailanswer","deliver post":"mailreturn"};
    const opts=g.options(state);const match=opts.find(o=>o.id===cmd||o.id===synonyms[cmd]||normalize(o.label)===cmd);
    if(match){act(match.id);return;}
    note("That verb cannot be used here. Type HELP for the commands, or choose an action at this stop.");
  }
  function withLatest(action){
    function run(){
      try{
        const raw=localStorage.getItem(KEY);
        if(raw){
          const latest=JSON.parse(raw);
          if(g.validate(latest)&&latest.rev>state.rev){
            state=latest;confirming="";selected=null;lastVerb="";reading=false;
            note("Another tab has entered a turn. The current log is open. Choose your next move.");return;
          }
        }
      }catch(error){}
      action();
    }
    if(navigator.locks&&window.isSecureContext){navigator.locks.request(KEY,run).catch(()=>{note("The turn could not acquire this browser’s save lock. Choose the move again.");});}
    else run();
  }
  document.addEventListener("click",e=>{
    const node=e.target.closest("[data-view],[data-group],[data-book],[data-stop],[data-act],[data-ui]");if(!node||node.disabled)return;
    e.preventDefault();
    if(node.dataset.view){changeView(node.dataset.view);return;}
    if(node.dataset.ui){const id=node.dataset.ui;if(["yes","change","flyhere"].includes(id))withLatest(()=>ui(id));else ui(id);return;}
    if(node.dataset.group){group=node.dataset.group;confirming="";feedback="";render();return;}
    if(node.dataset.book){book=node.dataset.book;render();return;}
    if(node.dataset.stop){selected=node.dataset.stop;feedback="";render();return;}
    if(node.dataset.act)withLatest(()=>act(node.dataset.act));
  });
  document.addEventListener("submit",e=>{
    if(e.target.id!=="cmdform")return;e.preventDefault();const input=e.target.elements.command;
    const value=input.value;input.value="";commandOpen=true;withLatest(()=>{command(value);document.querySelector("#cmd")?.focus({preventScroll:true});});
  });
  document.addEventListener("toggle",e=>{if(e.target.classList?.contains("command"))commandOpen=e.target.open;},true);
  document.addEventListener("change",e=>{if(e.target.id==="zone"){const zone=Number(e.target.value);withLatest(()=>{commit(g.setZone(state,zone));render();});}});
  window.addEventListener("storage",e=>{
    if(e.key!==KEY||!e.newValue)return;
    try{const s=JSON.parse(e.newValue);if(g.validate(s)&&s.rev>=state.rev){state=s;selected=null;confirming="";feedback="";reading=false;lastVerb="";render();}}catch(error){}
  });
  window.addEventListener("hashchange",()=>{const n=location.hash.slice(1);if(["play","atlas","book","log"].includes(n)){view=n;render();}});
  loadSave();view=["play","atlas","book","log"].includes(location.hash.slice(1))?location.hash.slice(1):"play";render();
})();
</script>
</body></html>
