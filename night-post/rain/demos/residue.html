<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101a24">
<title>Residue · Donkey Water stones</title><style>html,body{margin:0;height:100%;background:#101a24;overflow:hidden;overscroll-behavior:none}canvas{display:block;position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}
a.back{position:fixed;left:10px;top:10px;z-index:2;color:#cfe9e6;font:italic 20px Georgia,serif;text-decoration:none;padding:8px 12px;opacity:.6}</style></head>
<body><canvas></canvas><a class="back" href="./" aria-label="All stones">‹</a><script src="./water.js?v=1"></script><script>
// STONE 1. Every act that changes a number leaves one bead where it happened. Beads dry. A bead is the way back.
const K = Water, s = { liters: 0, dk: .3, x: .5, tx: .5, beads: [], hold: null };
const snap = () => ({ liters: s.liters, dk: s.dk, x: s.x });
const leave = (x, y, before, label, tone) => { s.beads.push({ x, y, born: st.t, ttl: 26, before, label, tone }); K.splash(x, y, 1.1, tone || '178,247,240'); };
const P = () => ({ pump: [st.W * .78, st.ground + st.H * .12], donkey: [st.W * .22, st.ground + st.H * .12], me: [st.W * s.x, st.ground + st.H * .17] });
const st = K.stage((g, st, dt) => {
  const p = P(); s.x = K.lerp(s.x, s.tx, .08); s.dk = Math.max(0, s.dk - dt * .004);
  K.scene(g, st); K.pump(g, p.pump[0], p.pump[1]); K.donkey(g, p.donkey[0], p.donkey[1], 1, s.dk < .06); K.person(g, p.me[0], p.me[1]); K.can(g, p.me[0] + 26, p.me[1], 1, s.liters / 20);
  const src = [[54, 70, 30]], now = st.t;
  for (const b of s.beads) { b.age = now - b.born; if (K.near(st.ptr, b.x, b.y, 44) && st.ptr.down) b.born = now - b.age * .6; b.life = 1 - b.age / b.ttl; if (b.life > 0) src.push([b.x, b.y, 12 + 14 * b.life]); }
  s.beads = s.beads.filter(b => b.life > 0); K.membrane(g, st, src);
  K.drop(g, 54, 70, 34, { fill: s.liters / 20, text: s.liters.toFixed(0), sub: 'L' });
  K.drop(g, p.donkey[0] + 30, p.donkey[1] - 120, 20, { fill: s.dk, tone: s.dk < .3 ? '255,223,168' : undefined });
  for (const b of s.beads) { const near = K.near(st.ptr, b.x, b.y, 60); K.drop(g, b.x, b.y, 14 + 14 * b.life, { fill: b.life, tone: b.tone, alpha: .35 + .65 * b.life }); if (near || b.age < 2.2) K.ink(g, b.label, b.x, b.y - 34, near ? 1 : 1 - b.age / 2.2, 15, 'center', b.tone ? '#ffdfa8' : undefined); }
  if (s.hold) { const b = s.hold.before; K.ink(g, `then: ${b.liters.toFixed(0)} L`, st.W / 2, st.H * .3, .9, 20, 'center', '#ffdfa8'); g.globalAlpha = .35; K.person(g, st.W * b.x, p.me[1], 1, '#ffdfa8'); g.globalAlpha = 1; }
  K.chrome(g, st, 'Residue', 'touch the pump, the donkey, the ground');
});
st.on.down = p => { const b = s.beads.find(b => K.near(p, b.x, b.y, 34)); s.hold = b || null; };
st.on.up = p => { const b = s.hold; s.hold = null; if (!b || p.moved > 60) { if (b && p.moved > 60) { b.ttl = 0; K.splash(p.x, p.y, .8, '255,223,168'); } return; }
  const here = snap(), me = P().me; Object.assign(s, { liters: b.before.liters, dk: b.before.dk, tx: b.before.x }); s.beads.splice(s.beads.indexOf(b), 1); leave(me[0], me[1] - 60, here, 'back', '255,223,168'); st.skipTap = true; };
st.on.tap = p => { if (st.skipTap) { st.skipTap = false; return; } const q = P();
  if (K.near(p, q.pump[0] + 20, q.pump[1] - 40, 70)) { if (s.liters >= 20) return; const b = snap(); s.tx = .66; s.liters = Math.min(20, s.liters + 5); leave(p.x, p.y, b, `${b.liters.toFixed(0)} → ${s.liters.toFixed(0)} L`); }
  else if (K.near(p, q.donkey[0], q.donkey[1] - 50, 80)) { if (s.liters < 1) { K.splash(p.x, p.y, .3, '255,223,168'); return; } const b = snap(), amt = Math.min(4, s.liters); s.tx = .34; s.liters -= amt; s.dk = Math.min(1, s.dk + amt / 12); leave(p.x, p.y, b, `${b.liters.toFixed(0)} → ${s.liters.toFixed(0)} L`); }
  else if (p.y > st.ground) { s.tx = K.clamp(p.x / st.W, .1, .9); K.splash(p.x, p.y, .3); } };

</script></body></html>
