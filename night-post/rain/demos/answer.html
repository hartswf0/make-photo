<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101a24">
<title>Answer · Donkey Water stones</title><style>html,body{margin:0;height:100%;background:#101a24;overflow:hidden;overscroll-behavior:none}canvas{display:block;position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}

<body><canvas></canvas><a class="back" href="./" aria-label="All stones">‹</a><script src="./water.js?v=1"></script><script>
// STONE 4. Touch anything. Where something can be done, the water pools and stays; where nothing can, it runs off and is gone.
const K = Water, s = { liters: 0, dk: .2, pools: [], carry: null };
const P = () => ({ can: [56, 72], pump: [st.W * .8, st.ground + st.H * .13], wall: [st.W * .48, st.ground + st.H * .1], donkey: [st.W * .2, st.ground + st.H * .14], far: [st.W * .64, st.ground - 4] });
const runoff = (x, y) => { for (let i = 0; i < 7; i++) K.parts.push({ x: x + (Math.random() - .5) * 26, y, vx: (Math.random() - .5) * 30, vy: 40 + Math.random() * 60, r: 1.4 + Math.random() * 1.6, life: 0, ttl: .7 + Math.random() * .4, tone: '178,247,240' }); };
const pool = (x, y, r, kind, word) => { s.pools = s.pools.filter(q => q.kind !== kind); s.pools.push({ x, y, r, kind, word, born: st.t }); K.splash(x, y, .5); };
const st = K.stage((g, st, dt) => {
  const p = P(); K.scene(g, st, { rain: .35 }); K.pump(g, p.far[0], p.far[1], .3); K.wall(g, p.wall[0], p.wall[1]); K.pump(g, p.pump[0], p.pump[1]); K.donkey(g, p.donkey[0], p.donkey[1]);
  const src = [[p.can[0], p.can[1], 30]]; s.pools = s.pools.filter(q => st.t - q.born < 7 || s.carry === q);
  for (const q of s.pools) { const a = Math.min(1, (st.t - q.born) * 4), w = 1 + Math.sin(st.t * 3 + q.x) * .06; src.push([q.x, q.y, q.r * a * w * 1.25, q.r * a * .8]); }
  if (s.carry) { const a = s.carry === 'can' ? p.can : [s.carry.x, s.carry.y], n = 9; for (let i = 1; i <= n; i++) src.push([K.lerp(a[0], st.ptr.x, i / n), K.lerp(a[1], st.ptr.y, i / n), 5 + 6 * i / n]); src.push([st.ptr.x, st.ptr.y, 18]); }
  K.membrane(g, st, src);
  K.drop(g, p.can[0], p.can[1], 34, { fill: s.liters / 20, text: s.liters.toFixed(0), sub: 'L' });
  K.drop(g, p.donkey[0] + 34, p.donkey[1] - 124, 18, { fill: s.dk, tone: s.dk < .3 ? '255,223,168' : undefined });
  for (const q of s.pools) if (q.word) K.ink(g, q.word, q.x, q.y - q.r - 10, Math.min(1, (st.t - q.born) * 3), 18, 'center', '#a9f7ee');
  K.chrome(g, st, 'Answer', 'touch anything');
});
st.on.tap = p => { const q = P();
  if (K.near(p, q.pump[0] + 20, q.pump[1] - 40, 66)) pool(q.pump[0] + 40, q.pump[1] - 26, 26, 'draw', s.liters >= 20 ? '' : 'Draw');
  else if (K.near(p, q.donkey[0], q.donkey[1] - 50, 76)) { if (s.liters > 0 && s.dk < .98) pool(q.donkey[0] + 52, q.donkey[1] - 52, 22, 'pour', 'Pour'); else runoff(p.x, p.y); }
  else if (K.near(p, q.far[0], q.far[1] - 12, 34)) { pool(q.far[0] + 10, q.far[1] - 8, 6, 'far', ''); for (let i = 0; i < 4; i++) setTimeout(() => K.fall(K.lerp(st.W * .5, q.far[0], (i + 1) / 5), K.lerp(st.H * .9, q.far[1] + 26, (i + 1) / 5), { tone: '255,223,168', k: .35 }), i * 260); }
  else runoff(p.x, p.y); };
st.on.down = p => { const q = P(), hit = s.pools.find(o => o.r > 12 && K.near(p, o.x, o.y, o.r + 22)); s.carry = hit && hit.kind === 'draw' ? hit : K.near(p, q.can[0], q.can[1], 44) ? 'can' : null; };
st.on.up = p => { const c = s.carry, q = P(); s.carry = null; if (!c) return;
  if (c !== 'can' && K.near(p, q.can[0], q.can[1], 60) && s.liters < 20) { s.liters = Math.min(20, s.liters + 6); K.splash(q.can[0], q.can[1], 1.5); s.pools.splice(s.pools.indexOf(c), 1); }
  else if (c === 'can') { const t = s.pools.find(o => o.kind === 'pour' && K.near(p, o.x, o.y, 50)); if (t && s.liters > 0) { const a = Math.min(5, s.liters); s.liters -= a; s.dk = Math.min(1, s.dk + a / 10); K.splash(t.x, t.y, 1.5); s.pools.splice(s.pools.indexOf(t), 1); } } };

</script></body></html>
