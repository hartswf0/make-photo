<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151613">
  <meta name="description" content="A three-dimensional pack donkey you can drive: walk, trot, climb and bray.">
  <title>Pack Donkey</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#151613;color:#f1eee6;
      font:14px/1.3 Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;
      filter:grayscale(1) sepia(.2) contrast(1.06);cursor:grab}
    #view:active{cursor:grabbing}
    .vignette{position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(10,9,7,.5) 100%)}
    .plate{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none;
      text-shadow:0 1px 10px rgba(0,0,0,.55)}
    .plate h1{margin:0;font:400 30px/1 "Instrument Serif","Iowan Old Style",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
    .plate p{margin:7px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
    .plate p span+span::before{content:" · "}
    .keys{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));
      margin:0;font-size:12px;opacity:.82;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7);line-height:1.75}
    .keys b{font-weight:600;border:1px solid rgba(241,238,230,.5);border-radius:4px;padding:1px 5px;margin-right:3px;font-size:11px}
    .bar{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
    .bar button{font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f1eee6;
      background:rgba(21,22,19,.55);border:1px solid rgba(241,238,230,.45);border-radius:999px;padding:11px 15px;min-height:40px;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
    .bar button[aria-pressed="true"]{background:#f1eee6;color:#151613;border-color:#f1eee6}
    .bar button:focus-visible{outline:2px solid #f1eee6;outline-offset:2px}
    body.study{color:#1b1a17}body.study .plate,body.study .keys,body.study .touch-hint{text-shadow:none}
    body.study .keys b{border-color:rgba(27,26,23,.5)}body.study .vignette{display:none}
    #stick{position:fixed;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;border:1px solid rgba(241,238,230,.5);
      background:rgba(21,22,19,.3);pointer-events:none;display:none}
    #stick.on{display:block}
    #nub{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:rgba(241,238,230,.85)}
    @media (hover:none),(max-width:640px){.keys{display:none}.plate h1{font-size:24px}}
    @media (hover:hover) and (min-width:641px){.touch-hint{display:none}}
    .touch-hint{position:fixed;left:0;right:0;top:max(74px,calc(env(safe-area-inset-top) + 74px));text-align:left;padding-left:max(18px,env(safe-area-inset-left));
      font-size:11px;opacity:.75;pointer-events:none;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  </style>
</head>
<body>
  <canvas id="view" aria-label="A pack donkey in a mountain meadow"></canvas>
  <div class="vignette"></div>
  <header class="plate">
    <h1>Pack Donkey</h1>
    <p><span id="gait">Stand</span><span id="speed">0.0 m/s</span></p>
  </header>
  <p class="touch-hint">Left thumb drives · edge to trot · drag right to look</p>
  <p class="keys">
    <b>W</b><b>A</b><b>S</b><b>D</b> drive &nbsp; <b>Shift</b> trot &nbsp; <b>Space</b> bray<br>
    <b>P</b> pack &nbsp; <b>C</b> view &nbsp; <b>V</b> study &nbsp; <b>R</b> reset &nbsp; drag to look, scroll to zoom
  </p>
  <div class="bar">
    <button id="b-trot" data-act="trot" aria-pressed="false">Trot</button>
    <button id="b-pack" data-act="pack" aria-pressed="true">Pack</button>
    <button data-act="bray">Bray</button>
    <button data-act="view">View</button>
    <button id="b-study" data-act="study" aria-pressed="false">Study</button>
    <button id="b-sound" data-act="sound" aria-pressed="true">Sound</button>
  </div>
  <div id="stick"><div id="nub"></div></div>
  <script src="../field-plates/fonts.js"></script>
  <script src="../field-plates/three.js"></script>
  <script src="donkey.js"></script>
  <script src="main.js"></script>
</body>
</html>
