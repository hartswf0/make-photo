<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donkey on its own</title>
  <style>html,body{margin:0;height:100%;background:#d9d5cb}canvas{display:block;width:100%;height:100%;filter:grayscale(1)}</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="../field-plates/three.js"></script>
  <script src="donkey.js"></script>
  <script>
    // The smallest use of the donkey: a flat floor, one light, and an animal that walks in a circle.
    const T = THREE, canvas = document.getElementById("c");
    const renderer = new T.WebGLRenderer({ canvas, antialias: true });
    const scene = new T.Scene(); scene.background = new T.Color(0xd9d5cb);
    const camera = new T.PerspectiveCamera(35, 1, .1, 100); camera.position.set(4.5, 2, 4.5);
    scene.add(new T.HemisphereLight(0xffffff, 0x8a8880, 1.8));
    const sun = new T.DirectionalLight(0xffffff, 2.5); sun.position.set(-4, 8, 3); scene.add(sun);

    const flat = () => 0;                                  // heightAt(x, z)
    const donkey = makeDonkey({ shells: 8 });              // pass assetPath if the textures live elsewhere
    scene.add(donkey.group);
    donkey.place(0, 0, 0, flat);
    donkey.state.brainOff = true;                          // obey without question; remove to let it decide

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      donkey.update(dt, { throttle: 1, steer: .35, pace: 0 }, flat);
      camera.lookAt(donkey.state.x, .8, donkey.state.z);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
