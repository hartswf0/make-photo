<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script type="importmap">{"imports":{"three":"../highland-exposure/motion-lab/vendor/three/three.module.js","three/addons/":"../highland-exposure/motion-lab/vendor/three/addons/"}}</script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="./suite-nav.css">
  <title>MAKE-PHOTO CITY | The Nolli Block</title>
  <style>
    :root {
      --bg: #0f1112;
      --panel: rgba(12, 16, 22, 0.78);
      --paper: #f4eedd;
      --muted: rgba(244, 238, 221, 0.72);
      --brass: #e0b46a;
      --cyan: #18b4ff;
      --rule: rgba(244, 238, 221, 0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--paper);
      font: 400 13px/1.38 Inter, system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    #canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #shutter-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 9500;
      transition: opacity 150ms ease;
    }

    /* STRICT DIEGETIC DEFAULT: Zero overlaid boxes, bars, or panels on load */
    #top-bar,
    #ledger-strip,
    #dock,
    #hint-bar,
    #context-prompt,
    #camera-hud,
    #dialogue-card,
    #toast,
    .modal {
      display: none !important;
    }

    /* Raw Ledger Stats visible ONLY if user explicitly presses Tab */
    body.mp-tab-open #ledger-strip {
      display: block !important;
      position: fixed;
      top: 44px;
      right: 14px;
      z-index: 8800;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 9px 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 230px;
      font-size: 11px;
    }
    .ledger-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 2px 0;
    }
    .ledger-label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; }
    .ledger-val { font-weight: 600; color: var(--paper); }
    .ledger-val.cyan { color: var(--cyan); }
    .ledger-val.brass { color: var(--brass); }

    /* Plain 1-line floating world-projected whisper for 3D architectural props (zero box/border) */
    #world-prop-whisper {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      z-index: 8850;
      display: none;
      pointer-events: none;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
      margin: 0;
      white-space: nowrap;
      font: 500 12px/1.25 Inter, system-ui, -apple-system, sans-serif;
      letter-spacing: 0.04em;
      color: var(--paper);
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.96), 0 0 14px rgba(6, 12, 18, 0.88);
    }
    #world-prop-whisper.visible {
      display: block;
    }

    /* Clean unboxed floating overhead subtitle + inline choices above 3D Anny V8 resident head */
    #resident-world-speech {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      z-index: 8880;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: min(390px, 88vw);
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
      pointer-events: none;
    }
    #resident-world-speech.visible {
      display: flex;
    }
    .rws-speaker {
      font: 600 10px/1.2 Inter, system-ui, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--brass);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.96), 0 0 10px rgba(0, 0, 0, 0.85);
      margin-bottom: 3px;
    }
    .rws-line {
      font: 500 13px/1.38 Georgia, 'Iowan Old Style', serif;
      color: #fbf7ec;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.98), 0 0 16px rgba(4, 8, 14, 0.92);
      margin-bottom: 5px;
    }
    .rws-choices {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 500 11.5px/1.2 Inter, system-ui, sans-serif;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.98), 0 0 12px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
    }
    .rws-choice {
      appearance: none;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 2px 1px;
      margin: 0;
      font: inherit;
      color: #7ee0ff;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: inherit;
      cursor: pointer;
    }
    .rws-choice:hover {
      color: #ffffff;
    }
    .rws-sep {
      color: rgba(244, 238, 221, 0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="shutter-flash"></div>

  <!-- World-anchored plain text whispers (hidden on default load) -->
  <div id="world-prop-whisper" aria-live="polite"></div>
  <div id="resident-world-speech" aria-live="polite">
    <div class="rws-speaker" id="rws-speaker"></div>
    <div class="rws-line" id="rws-line"></div>
    <div class="rws-choices">
      <button type="button" class="rws-choice" data-rws="job">Ask job</button>
      <span class="rws-sep">&middot;</span>
      <button type="button" class="rws-choice" data-rws="credit">Credit plate</button>
      <span class="rws-sep">&middot;</span>
      <button type="button" class="rws-choice" data-rws="water">Give 5L</button>
    </div>
  </div>

  <!-- Tab-only diagnostic ledger stats (display: none on load) -->
  <div id="ledger-strip">
    <div class="ledger-row">
      <span class="ledger-label">Carried Jerrycan</span>
      <span class="ledger-val cyan" id="val-water">0.0 / 20 L</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Standpipe Reserve</span>
      <span class="ledger-val cyan" id="val-standpipe">40.0 L</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Projector Sight-Glass</span>
      <span class="ledger-val cyan" id="val-tank">0.0 / 5.0 L (DRY)</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Severn Threshold Door</span>
      <span class="ledger-val brass" id="val-door">OPEN (13.5 KHZ)</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Optical Gate</span>
      <span class="ledger-val brass" id="val-gate">SOLID (IN FOCUS)</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Archive Plates</span>
      <span class="ledger-val" id="val-plates">0 (0 PUBLIC)</span>
    </div>
    <div class="ledger-row">
      <span class="ledger-label">Zone</span>
      <span class="ledger-val brass" id="space-badge">EXTERIOR | STREET</span>
    </div>
  </div>

  <!-- Legacy hidden containers preserved inert so external queries never throw -->
  <div id="top-bar"></div>
  <div id="context-prompt"></div>
  <div id="camera-hud"></div>
  <div id="dialogue-card"></div>
  <div id="hint-bar"></div>
  <div id="dock"></div>
  <div id="toast"></div>

  <script src="../motion-pipeline/mesh2motion/m2m-retarget.js"></script>
  <script src="../motion-pipeline/anny-human-v7.js?v=5"></script>
  <script type="module">
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    const origLoad = GLTFLoader.prototype.load;
    GLTFLoader.prototype.load = function patchedLoad(url, onLoad, onProgress, onError) {
      if (!this.meshoptDecoder) this.setMeshoptDecoder(MeshoptDecoder);
      const safeUrl = typeof url === 'string' ? url.replace(/\/clips\/talk\.glb(\?.*)?$/, '/clips/idle-talking.glb$1') : url;
      return origLoad.call(this, safeUrl, onLoad, onProgress, onError);
    };
  </script>
  <script src="../night-post/rain/carry.js?v=2"></script>
  <script src="../night-post/rain/bridge-kit.js?v=4"></script>
  <script src="./surface-bridge.js?v=2"></script>
  <script src="../night-post/rain/attach.js?v=4" data-hide="#hint-bar,#dock,#top-bar,#context-prompt,#camera-hud"></script>
  <script type="module" src="./city.js"></script>
</body>
</html>
