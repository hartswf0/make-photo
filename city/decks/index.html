<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Poem Decks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a two-deck video rig. Deck A | program monitor + mixer | Deck B, with the edit (what REC laid down) along the bottom.
   On a phone: monitor and edit strip stay; one panel at a time (A, MIX, B, EDIT) below. Single dark look by choice. */
:root{--bg:#07080c;--panel:#0e1118;--well:#0a0c12;--line:#1f2533;--ink:#e8ecf5;--dim:#7d879f;--a:#39c6ff;--b:#ff9a3c;--rec:#ff3b4a;--ok:#5ef0a0;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cond);font-size:12px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:600 11px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:#151a24;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:0 6px;min-height:30px}
button:active{filter:brightness(1.4)}
button.on{background:#1f2a3c;border-color:#5c6c90}
button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.app{height:100%;box-sizing:border-box;display:grid;gap:8px;padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  grid-template-columns:minmax(0,1fr) minmax(300px,1.05fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "a mix b" "edit edit edit"}
@media (min-width:0){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.top{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0}
.top .brand{font:600 13px var(--cond);letter-spacing:.2em;color:var(--dim);white-space:nowrap}
.top .tc{font:500 13px var(--mono);font-variant-numeric:tabular-nums;margin-left:auto}
.top .tc.live{color:var(--rec)}
#rec{color:var(--rec);border-color:#5a2028;min-width:64px}
#rec.on{background:var(--rec);color:#fff;border-color:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0}
/* deck */
.deck{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto auto;gap:6px;padding:8px}
#dA{grid-area:a;--c:var(--a)}#dB{grid-area:b;--c:var(--b)}
.dh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.dh .L{font:600 20px/1 var(--cond);color:var(--c);width:18px;text-align:center}
.dh .pick{justify-content:flex-start;text-align:left;text-transform:none;letter-spacing:.02em;font-size:13px;display:flex;gap:6px;align-items:center;min-width:0;background:var(--well)}
.dh .pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .rd{font:500 11px/1.25 var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dh .rd b{display:block;font-size:14px;font-weight:600}
.dh .rd i{font-style:normal;color:var(--dim)}
.wave{position:relative;background:var(--well);border:1px solid var(--line);border-radius:6px;cursor:pointer;touch-action:none}
.wave canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{height:30px}.zm{height:52px}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;min-height:0}
.jog{position:relative;min-height:0;touch-action:none;cursor:grab}
.jog canvas{position:absolute;inset:0;width:100%;height:100%}
.jog video{position:absolute;border-radius:50%;object-fit:cover;pointer-events:none;background:#000}
.pitchc{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:5px;min-height:0;text-align:center}
.pitchc .v{font:500 10px var(--mono);color:var(--dim)}
.fader{position:relative;background:var(--well);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:ns-resize;min-height:60px}
.fader .tk{position:absolute;left:50%;top:8px;bottom:8px;width:2px;margin-left:-1px;background:#232a3a}
.fader .mk{position:absolute;left:4px;right:4px;height:1px;background:#3a4560;top:50%}
.fader .h{position:absolute;left:3px;right:3px;height:18px;margin-top:-9px;background:#d9dfec;border-radius:3px;box-shadow:0 1px 0 #000}
.fader .h::after{content:"";position:absolute;left:3px;right:3px;top:8px;height:2px;background:#1a1f2b}
.fader.hz{cursor:ew-resize;min-height:0;height:36px}
.fader.hz .tk{left:10px;right:10px;top:50%;bottom:auto;width:auto;height:2px;margin:-1px 0 0}
.fader.hz .h{top:3px;bottom:3px;height:auto;width:22px;margin:0 0 0 -11px}
.fader.hz .h::after{left:10px;right:auto;top:3px;bottom:3px;width:2px;height:auto}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.pads button{min-height:34px;font:600 10px var(--mono);letter-spacing:0;text-transform:none;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;border-width:1px}
.pads button.set{color:#0b0d12;border-color:transparent}
.pads button em{position:absolute;left:4px;top:2px;font-style:normal;font-size:8px;opacity:.7}
.pads button span{display:block;padding-top:7px;overflow:hidden;text-overflow:ellipsis;font-family:var(--cond);font-size:10.5px}
.row{display:grid;gap:5px}
.lp{grid-template-columns:repeat(7,minmax(0,1fr))}
.lp button{font-size:10px;padding:0 2px}
.lp button.act{background:#3a3010;border-color:#c9a63a;color:#ffe08a}
.tp{grid-template-columns:1fr 1fr 1.4fr}
.tp .lkm{display:none}
.pads.planes{grid-template-columns:repeat(5,minmax(0,1fr))}
.pl{display:grid;grid-template-rows:auto 56px;gap:4px}
.pl .pb{min-height:30px;font:600 10px/1.1 var(--mono);color:var(--dim);border-color:var(--line);padding:2px}
.pl .pb small{display:block;font:500 8.5px var(--cond);letter-spacing:.04em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pb.on{color:#08090d;background:var(--pc);border-color:var(--pc)}
.pl .pb.so{box-shadow:0 0 0 2px #fff inset}
.pl .fader{min-height:0}
.tp button{min-height:44px;font-size:13px}
.cue{color:#ffb84d;border-color:#5a4520}
.cue.lit{background:#ffb84d;color:#111}
.ply{color:var(--ok);border-color:#205a3a}
.ply.lit{background:var(--ok);color:#06140c}
/* mixer */
.mix{grid-area:mix;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:8px}
.mon{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.mon canvas{position:absolute;inset:0;width:100%;height:100%}
.mon .cap{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;font:500 clamp(12px,1.5vw,16px)/1.3 var(--cond);text-shadow:0 1px 4px #000,0 0 2px #000;pointer-events:none}
.mon .cap .now{color:#ffe08a}.mon .cap .f{opacity:.55}
.mon .tag{position:absolute;left:6px;top:5px;font:600 10px var(--mono);letter-spacing:.08em;pointer-events:none;text-shadow:0 0 4px #000}
.mon .tagr{left:auto;right:6px}
.strips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
.strip{display:grid;grid-template-columns:minmax(0,1fr) 34px;grid-template-rows:repeat(4,auto) minmax(0,1fr);gap:4px 6px;align-items:center;min-height:0}
.strip .knob{grid-column:1}
.strip .vu{grid-column:2;grid-row:1/6;height:100%;width:10px;justify-self:center;border-radius:3px;background:var(--well);border:1px solid var(--line)}
.strip .fader{grid-column:1;height:100%}
.knob{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;align-items:center;touch-action:none;cursor:ns-resize}
.knob canvas{width:34px;height:34px}
.knob b{font:600 10px var(--cond);letter-spacing:.1em;color:var(--dim)}
.knob i{display:block;font:500 10px var(--mono);font-style:normal;color:var(--ink)}
.xrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.xrow .ab{font:600 16px var(--cond);width:16px;text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px}
/* edit */
.edit{grid-area:edit;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px}
.etools{display:grid;grid-template-columns:repeat(4,auto);gap:5px;align-content:start}
.etools button{min-height:32px}
.ebody{display:grid;grid-template-rows:auto 46px auto;gap:5px;min-width:0}
.einfo{font:500 11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.einfo b{color:var(--ink);font-weight:600}
.tl{position:relative;background:var(--well);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:pointer}
.tl canvas{position:absolute;inset:0;width:100%;height:100%}
.sel{display:flex;gap:5px;flex-wrap:wrap}
.sel button{min-height:28px;font-size:10px}
.tabs{display:none}
/* phone */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"top" "mon" "edit" "pane" "tabs";gap:6px}
  .mix{display:contents}
  .mon{grid-area:mon;justify-self:center;height:min(26vh,calc((100vw - 32px)*.5625));width:auto;max-width:100%}
  .mixer{grid-area:pane}
  #dA,#dB,.mixer,.eedit{grid-area:pane}
  body:not([data-pane="a"]) #dA,body:not([data-pane="b"]) #dB,body:not([data-pane="mix"]) .mixer{display:none}
  .edit{display:contents}
  .ebody{grid-area:edit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
  .etools{display:none}
  body[data-pane="edit"] .etools{display:grid;grid-area:pane;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;align-content:start}
  .ebody{grid-template-rows:auto 40px}
  .ebody .sel{display:none}
  body[data-pane="edit"] .ebody .sel{display:flex}
  .tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .tabs button{padding:0 2px;font-size:10.5px}
  body[data-pane="ab"] .app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top" "mon mon" "edit edit" "da db" "tabs tabs"}
  body[data-pane="ab"] #dA{display:grid!important;grid-area:da}body[data-pane="ab"] #dB{display:grid!important;grid-area:db}
  body[data-pane="ab"] .deck{grid-template-rows:auto auto minmax(0,1fr) auto;padding:6px;gap:5px}
  body[data-pane="ab"] .deck .zm,body[data-pane="ab"] .deck .lp,body[data-pane="ab"] .deck .pitchc,body[data-pane="ab"] .deck .pads,body[data-pane="ab"] .dh .rd i,body[data-pane="ab"] .dh .pick em,body[data-pane="ab"] .tp .setb{display:none}
  body[data-pane="ab"] .mid{grid-template-columns:1fr}
  body[data-pane="ab"] .dh{grid-template-columns:auto minmax(0,1fr);gap:4px}body[data-pane="ab"] .dh .rd{grid-column:1/3;text-align:left}body[data-pane="ab"] .dh .rd b{font-size:12px}
  body[data-pane="ab"] .dh .pick{font-size:11px;padding:0 5px}
  body[data-pane="ab"] .tp{grid-template-columns:1fr 1fr}body[data-pane="ab"] .tp .lkm{display:block}body[data-pane="ab"] .tp .ply{grid-column:1/3}
  .tabs button{min-height:40px}
  .tabs .ta{color:var(--a)}.tabs .tb{color:var(--b)}
  .mid{grid-template-columns:minmax(0,1fr) 42px}
  .ov{height:22px}.zm{height:38px}.deck{gap:5px;padding:7px}.pads button{min-height:30px}.tp button{min-height:38px}.lp button{min-height:26px}
  .pitchc{grid-template-rows:auto minmax(48px,1fr) auto auto}.pitchc button{min-height:26px}
  .top .brand{display:none}
}
.mixer{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;min-height:0}
@media (max-width:900px){.mixer{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}}
/* sheets */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(5,6,9,.97);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sh h2{margin:0 8px 0 4px;font:600 15px var(--cond);letter-spacing:.16em}
.sb{overflow:auto;min-height:0;user-select:text;-webkit-user-select:text}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.list button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;text-transform:none;letter-spacing:0;font:500 14px var(--cond);min-height:48px;padding:6px 10px}
.list button small{font:500 10.5px var(--mono);color:var(--dim)}
.list button .n{font:600 12px var(--mono);color:var(--dim)}
pre.edl{font:500 11.5px/1.5 var(--mono);margin:0;white-space:pre;color:var(--ink)}
.help{font:500 13px/1.6 var(--cond);max-width:70ch;color:var(--ink)}
.help kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 46px);z-index:20;background:#141a26;border:1px solid #33405a;border-radius:8px;padding:8px 12px;font:500 12px var(--cond);display:flex;gap:10px;align-items:center;max-width:min(92vw,560px)}
.dh .pick em{font:600 9px var(--mono);font-style:normal;letter-spacing:.08em;padding:3px 5px;border-radius:4px;background:#1b2130;color:var(--dim);flex:none}
.dh .pick em.k-reading{color:#cfe8ff}.dh .pick em.k-world{color:#9ff0c4;background:#10261c}.dh .pick em.k-sounds{color:#d9c2ff;background:#211833}
.deck.linked{box-shadow:inset 0 0 0 1px var(--c)}
button.lk{background:var(--c);color:#06080c;border-color:var(--c)}
.pitchc .v{font:500 10px var(--mono);color:var(--dim);min-height:22px;background:none;border:0;letter-spacing:0;text-transform:none}
.pads button.now{outline:2px solid #fff;outline-offset:-2px}
.pads button:disabled{opacity:.35}
.pairh{font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--dim);margin:6px 0 8px}
.list.pair button{border-color:#3a4766}
.list button img{width:44px;height:25px;object-fit:cover;border-radius:3px}
table.cr{border-collapse:collapse;width:100%;font:500 12px var(--mono)}table.cr td,table.cr th{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}table.cr a{color:var(--a)}
</style>

<div class="app" id="app">
  <div class="top">
    <span class="brand">WYGWYL · POEM DECKS</span>
    <button id="rec" type="button" title="Record the program into the edit (R)">● REC</button>
    <button id="pplay" type="button" title="Play the edit">▶ EDIT</button>
    <span class="tc" id="ptc">EDIT 00:00:00:00</span>
    <button id="edlb" type="button">EDL</button>
    <button id="helpb" type="button" aria-label="How it works">?</button>
  </div>
  <section class="panel deck" id="dA" aria-label="Deck A"></section>
  <section class="panel mix" aria-label="Mixer and program">
    <div class="mon" id="mon"><canvas></canvas><span class="tag" id="mtag"></span><span class="tag tagr" id="mtagr"></span><div class="cap" id="mcap"></div></div>
    <div class="mixer">
      <div class="strips">
        <div class="strip" id="sA"></div>
        <div class="strip" id="sB"></div>
      </div>
      <div class="xrow"><span class="ab" style="color:var(--a)">A</span><div class="fader hz" id="xf"></div><span class="ab" style="color:var(--b)">B</span></div>
      <div class="modes"><button id="mCut" type="button" title="Program shows whichever side the crossfader favours">CUT</button><button id="mMix" type="button" title="Program dissolves with the crossfader">DISSOLVE</button></div>
    </div>
  </section>
  <section class="panel deck" id="dB" aria-label="Deck B"></section>
  <section class="panel edit" aria-label="Edit">
    <div class="etools">
      <button id="eUndo" type="button">UNDO</button><button id="eDel" type="button">DELETE</button><button id="eL" type="button">◀ MOVE</button><button id="eR" type="button">MOVE ▶</button>
      <button id="eIm" type="button">IN −1f</button><button id="eIp" type="button">IN +1f</button><button id="eOm" type="button">OUT −1f</button><button id="eOp" type="button">OUT +1f</button>
      <button id="eTr" type="button">CUT/DISS</button><button id="eSplit" type="button">SPLIT</button><button id="eLoad" type="button">TO DECK</button><button id="eClr" type="button">CLEAR</button>
    </div>
    <div class="ebody"><div class="einfo" id="einfo"></div><div class="tl" id="tl"><canvas></canvas></div><div class="sel" id="selq"></div></div>
  </section>
  <nav class="tabs"><button data-p="ab" type="button">A + B</button><button class="ta" data-p="a" type="button">DECK A</button><button data-p="mix" type="button">MIXER</button><button class="tb" data-p="b" type="button">DECK B</button><button data-p="edit" type="button">EDIT</button></nav>
</div>
<video id="pv" playsinline preload="auto" hidden></video>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div><div class="sh" id="shF"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const FPS=23.976,TB=24,VENUE={D1:"Smoky Cafe",D2:"Night Club",D3:"Graffiti"};
const PADC=["#ff5a8a","#ff9a3c","#ffd166","#5ef0a0","#39c6ff","#6c8cff","#b07cff","#ff3b4a"];
const ROLEC={Foley:"#ffb347",Keynote:"#52a8ff",Sonsign:"#b07cff",Signal:"#ff5a8a",Soundmark:"#5ef0a0"};
let SRC=null,P=[],WORLD=[],SOUNDS=[],ALL={};const $=id=>document.getElementById(id);
const fmt=t=>{const n=t<0;t=Math.abs(t);return(n?'-':'')+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor(t%1*10)};
const tc=t=>{const f=Math.max(0,Math.round(t*FPS)),h=Math.floor(f/(3600*TB)),m=Math.floor(f/(60*TB))%60,s=Math.floor(f/TB)%60,fr=f%TB;return[h,m,s,fr].map(x=>String(x).padStart(2,'0')).join(':')};
const tcf=f=>{f=Math.max(0,Math.round(f));const h=Math.floor(f/(3600*TB)),m=Math.floor(f/(60*TB))%60,s=Math.floor(f/TB)%60,fr=f%TB;return[h,m,s,fr].map(x=>String(x).padStart(2,'0')).join(':')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DPR=Math.min(2,devicePixelRatio||1);
function fit(c){const r=c.getBoundingClientRect(),w=Math.max(1,Math.round(r.width*DPR)),h=Math.max(1,Math.round(r.height*DPR));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return[w,h]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- sources: a reading, a world reel, or a poem's sound reel; one shape for all three ---------- */
const poemOf=num=>P.find(p=>p.num===num);
function asReading(p){return Object.assign(p,{kind:'reading',key:'R'+p.num,file:p.clip.file,dur:p.clip.dur,base:p.clip.src_in,reel:'WYGWYL',fx:[],
  marks:[{t:p.speech[0]-.15,n:'VOICE'},...p.stages.slice(0,7).map(s=>({t:Math.max(0,s.s-.1),n:s.title}))]})}
function asWorld(w){const p=poemOf(w.poem);if(/asks/.test(w.note||''))w.note='';const marks=[0,...w.cuts].slice(0,8).map((t,i)=>({t,n:i?'SHOT '+(i+1):'HEAD'}));for(let i=marks.length;i<8;i++){const t=w.dur*i/8;marks.push({t,n:'@'+fmt(t).slice(0,-2)})}marks.sort((a,b)=>a.t-b.t);
  return Object.assign(w,{kind:'world',key:'W:'+w.key,num:w.poem,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),bpm:p?p.bpm:100,realm:p?p.realm:'C',words:[],lines:[],comments:[],stages:[],speech:[0,w.dur],fx:[],marks})}

$('helpb').onclick=()=>sheet(`<button type="button" onclick="closeSheet()">← RIG</button><h2>HOW IT WORKS</h2><button type="button" id="crb">SOUND CREDITS</button>`,`<div class="help">
<p><b>Three kinds of deck.</b> Tap a deck's title to load. <b>READING</b>: a poem from the Frame.io rough cut. <b>WORLD</b>: a butterfly-halfworld reel (the Magic Ride, the Atlantis take, Reunion shots, walks and probes). <b>SOUNDS</b>: the poem's Freesound line cues, each placed at the moment its line is spoken.</p>
<p><b>Pairing.</b> When the other deck holds a poem, the loader offers that poem's sounds and world reels at the top: one tap loads it here and turns on <b>LINK</b>.</p>
<p><b>LINK.</b> The linked deck follows the other one: play, pause, cue jumps, scratching and pitch. For the same poem it locks to the words: a sound deck lands each cue on its line, a world reel is stretched to the length of the reading. For anything else it holds the offset the two had when you linked. Press LINK again to let go.</p>
<p><b>Deck.</b> PLAY starts and pauses; CUE stores the cue point when paused, returns to it when playing, previews while held. Drag the jog wheel to scratch. The top waveform is the whole source (tap to jump); the lower one is eight seconds around the playhead with beats and the words or sound names (drag to scrub).</p>
<p><b>Pads.</b> On a reading or world deck they are hot cues: his first word and each place, or each shot. SET then a pad stores the current point; hold a pad to clear it. On a sound deck each pad is one line's sound, coloured by role (Foley, Keynote, Sonsign, Signal, Soundmark); they page by themselves as the poem moves on.</p>
<p><b>Loops, pitch.</b> IN/OUT or 1·2·4·8 beats; EXIT leaves. Pitch ±8% (double-tap for zero), SYNC matches tempo, tap the % to switch KEY lock.</p>
<p><b>Mixer.</b> HI/MID/LOW (fully down kills the band), FILTER (left low-pass, right high-pass), channel faders, crossfader. CUT shows the favoured side; DISSOLVE blends. A sound deck on air shows its card: role, sound, author and the line it scores.</p>
<p><b>Edit.</b> ● REC lays down the deck on air as program events, and the other deck, while you can hear it, as an under track. Select, trim (±1f or drag an edge), move, split, delete, set CUT/DISSOLVE, UNDO. ▶ EDIT plays the program. EDL writes CMX3600 with both tracks, every spoken line and every Freesound credit.</p>

  try{const sv=JSON.parse(localStorage.getItem('poemdecks.edit.v2')||'null');if(sv&&Array.isArray(sv.E)&&sv.E.every(e=>ALL[e.key])&&sv.E.length){E=sv.E;E2=(sv.E2||[]).filter(e=>ALL[e.key]);toast(`Your last edit is back: ${E.length} events.`)}}catch(e){}
  setTimeout(()=>{link(D[1]);toast('Deck A: the reading of poem 06. Deck B: its five-plane sound layers, LINKed to A. Press ▶ PLAY on A.')},200);
  drawTL();requestAnimationFrame(frame)}).catch(err=>{document.body.insertAdjacentHTML('beforeend',`<div class="toast">The decks did not load (${esc(err.message)}). Reload the page.</div>`)});
