<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the output is the field. Small node masses sit on it and shape the picture; the overlay is never recorded and fades when idle. The selected node's platter and dials live beside it. Single dark look by choice: it is a stage tool. */
:root{--ink:#eef3ff;--dim:rgba(220,230,255,.6);--ring:rgba(200,225,255,.38);--rec:#ff5a6e;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#020418;color:var(--ink);font:500 13px/1.4 ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#safe{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
#rig{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#out,#tx,#ov{position:fixed;display:block;border-radius:6px}
#out{z-index:1;background:#000;box-shadow:0 0 0 1px rgba(200,225,255,.16)}
#tx{z-index:2;pointer-events:none}#ov{z-index:3}
@media (orientation:portrait){#bar{gap:4px}.b{width:34px;height:34px}.seg button{width:32px}}
#bar{position:fixed;z-index:4;left:0;right:0;top:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 4px max(10px,env(safe-area-inset-left,0px));background:#020418}
.b{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,color .2s}
.b svg{width:18px;height:18px}.b.on{background:#fff;color:#06106a;border-color:#fff}#rec.on{background:var(--rec);border-color:var(--rec);color:#fff}
.b:focus-visible,.seg button:focus-visible,.poems button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.seg{flex:none;display:flex;border:1px solid var(--ring);border-radius:20px;overflow:hidden}
.seg button{width:36px;height:34px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,color .2s}
.seg button svg{width:19px;height:19px}.seg button.on{background:#fff;color:#06106a}
.sp{flex:1}
.poems{display:flex;flex:1;min-width:0}
.poems button{flex:1;min-width:0;height:36px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--dim)}
.poems button span{width:23px;height:23px;border-radius:50%;border:1px solid rgba(200,225,255,.28);display:grid;place-items:center;font:500 9px ui-monospace,monospace;transition:background .25s,color .25s}
.poems button.on span{background:#fff;color:#06106a;border-color:#fff}
@media (orientation:landscape){.sp{display:none}}
@media (orientation:portrait){.poems{order:9;flex-basis:100%}}
.rt{flex:none;font:600 11px ui-monospace,monospace;color:var(--rec)}
.sheet{position:fixed;z-index:10;background:rgba(2,5,40,.97);display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;box-sizing:border-box;box-shadow:0 0 0 1px rgba(200,225,255,.2)}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
.grid button{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(200,225,255,.3);background:#0a1690 center/cover no-repeat;position:relative;cursor:pointer;padding:0;color:#fff}
.grid button span{position:absolute;inset:auto 0 6px;font:600 10px ui-monospace,monospace;text-shadow:0 0 4px #000,0 0 2px #000}
.grid button i{position:absolute;top:7px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.grid button i b{width:6px;height:6px;border-radius:50%}
.grid button.cur{border-color:#fff;box-shadow:0 0 0 2px #fff}
.tabsk{display:flex;gap:6px}
.tabsk button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tabsk button.on{background:#fff;color:#06106a}.tabsk svg{width:18px;height:18px}
.take video{max-width:100%;max-height:52vh;border-radius:8px;display:block;margin:0 auto}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.howto div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;font:400 13.5px/1.45 system-ui,sans-serif}
.howto svg{width:52px;height:52px}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(8,16,90,.95);border:1px solid var(--ring);border-radius:22px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font:500 12px system-ui,sans-serif}
.toast button{border:1px solid var(--ring);background:transparent;color:var(--ink);border-radius:16px;min-height:30px;padding:0 10px;font:600 10px ui-monospace,monospace;cursor:pointer}
</style>

<div id="safe"></div>
<canvas id="rig" aria-label="The selected node: a platter to turn through time, four dials (mass, reach, tone, colour), and power, words, picture, sound and link. Above them, every node as a small orb."></canvas>
<canvas id="out" aria-hidden="true"></canvas>
<canvas id="tx" aria-hidden="true"></canvas>
<canvas id="ov" aria-label="The field. Drag a node to move its territory through the picture; pinch it to change its reach. Touch empty space to move the ear, which decides what you hear."></canvas>
<div id="bar">
  <button class="b" id="help" type="button" aria-label="How to play"></button>
  <button class="b" id="demo" type="button" aria-label="Watch a performance"></button>
  <div class="seg" id="fmodes" role="group" aria-label="Blend field"></div>
  <span class="sp"></span>
  <div class="poems" id="poems" aria-label="Poems"></div>
  <span class="rt" id="rt" hidden></span>
  <button class="b on" id="eye" type="button" aria-label="Show or hide the nodes on the picture"></button>
  <button class="b" id="stage" type="button" aria-label="Big picture"></button>
  <button class="b" id="play" type="button" aria-label="Play or pause everything linked"></button>
  <button class="b" id="rec" type="button" aria-label="Record"></button>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

  reading:'<circle cx="12" cy="8" r="3"/><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6"/>',world:'<path d="M3 18l6-8 4 5 3-3 5 6z"/><circle cx="17" cy="7" r="2"/>',sounds:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',save:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14"/>',
  tint:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/>',tone:'<path d="M3 14c3 0 3-6 6-6s3 8 6 8 3-4 6-4"/>',lvl:'<circle cx="12" cy="14" r="6"/><path d="M9 5h6M12 5v3"/>',reach:'<circle cx="12" cy="12" r="2.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  pw:'<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',ln:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',

  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',stage:'<rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8"/>',deck:'<rect x="2" y="5" width="11" height="12" rx="1.5"/><circle cx="18" cy="11" r="3.5"/>',

const svg=(k,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

  ly.poems.forEach(x=>{const p=P(x.num);addSrc({key:'X'+x.num,kind:'layers',num:x.num,title:'Rooms · '+p.title,dur:x.dur,files:x.stems.map(s=>s.file),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,start:Math.max(0,p.speech[0]-.4),marks:x.lines.map(l=>l.t),speech:p.speech,words:t=>{const L=lastBefore(x.lines,t,'t');return L?[{w:L.beat,on:true}]:null}})})}
/* one poem clock: readings, line sounds and rooms share the clip's timeline; a world reel is stretched over the spoken span */

function fromClock(s,c){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return(c-a)/(b-a)*s.dur}return c}
function stretchOf(s){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return s.dur/(b-a)}return 1}
/* ===== audio: node → tone filter → gain → master ===== */
let AC=null,master=null,mDest=null,noise=null;

/* ===== link: every node that is on and linked turns with the anchor (the last touched) on the poem clock ===== */
const grp=()=>NODES.filter(k=>k.on&&k.link),inGrp=k=>k.on&&k.link;
function anc(){const g=grp();return g.includes(ANC)?ANC:(g.find(k=>k.s.kind==='reading')||g[0]||null)}

    ring.forEach((k,i)=>{const p=pos(i,t),col=k===Wn[1]?.05+(u*.07)%.9:k===Wn[2]?.58:0;put(k,p[0],p[1],.85,.45,col)});
    const q=Math.max(0,(u-.5)/2.2),i0=Math.floor(q)%nr,f=smo((q%1)*1.5),a=pos(i0,t),b=pos((i0+1)%nr,t);st.ear=[.5+(lerp(a[0],b[0],f)-.5)*.85,.5+(lerp(a[1],b[1],f)-.5)*.85]}
  else if(j===3){const u=t-34;st.fm=FMT.tangle;put(R,.5,.5,.85,.42);Wn.forEach((k,i)=>{const a=i*TAU/nw+1.5*u,r=.12+.05*Math.sin(.8*u);put(k,.5+r*Math.cos(a),.5+r*1.6*Math.sin(a),.8,.55,.05+(i*.23+u*.05)%.9)});put(S,.14,.86,.5);put(X,.86,.86,.5);
    st.ear=[.5+.06*Math.cos(u),.5+.06*Math.sin(u)]}
  else if(j===4){const u=t-46,order=[S,Wn[0],Wn[1],R,Wn[2],Wn[3],X].filter(Boolean),m=order.length;st.fm={G:5,veil:0,tang:0};
    order.forEach((k,i)=>put(k,.07+.86*i/(m-1),.5+.22*Math.sin(1.1*u+i*.9),.85,.26,k===R?0:0));st.ear=[.5+.42*Math.sin(.55*u),.5]}
  else{const u=t-58;st.fm=FMT.veil;put(R,.5,.48,.95*(1-smo((t-62.6)/1.3)),.45);Wn.forEach((k,i)=>{const a=i*TAU/nw;put(k,.5+.3*Math.cos(a),.5+.32*Math.sin(a),.8*(1-smo(u/2.5)),.45)});put(S,.2,.85,.5*(1-smo((t-62.3)/1.5)));put(X,.8,.85,.5*(1-smo((t-62.3)/1.5)));st.ear=[.5,.48]}
  return st}
function demoState(t){let j=0;while(j<DB.length-2&&t>=DB[j+1])j++;const a=scene(j,t);if(j>=DB.length-2||t<DB[j+1]-1.6)return a;const b=scene(j+1,t),u=smo((t-(DB[j+1]-1.6))/1.6);
  const fm={};for(const q of ['G','veil','tang'])fm[q]=lerp(a.fm[q],b.fm[q],u);const n=new Map();for(const[k,p]of a.n){const q=b.n.get(k)||p;n.set(k,{x:lerp(p.x,q.x,u),y:lerp(p.y,q.y,u),level:lerp(p.level,q.level,u),reach:lerp(p.reach,q.reach,u),col:u<.5?p.col:q.col})}
  return{fm,ear:[lerp(a.ear[0],b.ear[0],u),lerp(a.ear[1],b.ear[1],u)],n}}
function applyDemo(st,exact){Object.assign(FMP,st.fm);EAR.x=st.ear[0];EAR.y=st.ear[1];EAR.drag=EAR.glide=null;EAR.vx=EAR.vy=0;
  for(const[k,p]of st.n){k.on=true;k.link=true;k.x=p.x;k.y=p.y;k.vx=k.vy=0;k.drag=null;k.level=p.level;k.reach=p.reach;k.col=p.col;k.hue=hueOf(p.col);if(exact){k.mS=p.level;k.rS=p.reach;for(const d of KNOBS)k.kS[d.id]=k[d.id]}}
  let best='gravity',bd=1e9;for(const m of FMODES){const T=FMT[m],d=Math.abs(Math.log(T.G/FMP.G))+Math.abs(T.veil-FMP.veil)*3+Math.abs(T.tang-FMP.tang)*3;if(d<bd){bd=d;best=m}}if(best!==FM){FM=best;$('fmodes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===FM))}}
function startDemo(){if(POEM!==DEMO.poem){loadPoem(DEMO.poem);setTimeout(startDemo,900);return}ensureAC();const{R}=roles();if(!R)return;for(const k of NODES){k.loop=null;k.mom=0;k.tone=0;applyTone(k)}
  ANC=R;SEL=R;seekD(R,demoClock(0));R.motor=1;R.spd=1;R.hold=DEMO;DEMO.on=true;DEMO.t0=performance.now();$('demo').classList.add('on');buzz([10,40,10],true)}
function stopDemo(){DEMO.on=false;$('demo').classList.remove('on');for(const k of NODES)if(k.hold===DEMO)k.hold=null;const A=anc();if(A){A.spd=Math.max(A.spd,.12)}FM=FM;save()}
/* live: the reading is driven by the choreography's clock (rate when it moves forward, silent seeks otherwise); linked sources follow */
function demoTick(now){if(!DEMO.on)return;const t=(now-DEMO.t0)/1000;if(t>=DEMO.len){stopDemo();for(const k of NODES)k.motor=0;return}applyDemo(demoState(t),false);
  const{R}=roles();if(!R)return;R.hold=DEMO;ANC=R;SEL=R;const c=demoClock(t),sp=(demoClock(t+.03)-c)/.03;R.motor=sp>.07?1:0;R.spd=clamp(sp,0,4);
  if(sp>.07&&sp<4){pitchD(R,Math.abs(sp-1)<.03);rateD(R,sp);elPlay(R,true);if(Math.abs(tD(R)-c)>.2)seekD(R,c)}else{elPlay(R,false);seekD(R,c)}}
/* offline: put every source at exactly the frame's time, wait for the pictures, render, and return the frame and the sound mix */
DEMO.renderAt=async function(t){OFFLINE=true;applyDemo(demoState(t),true);const c=demoClock(t),waits=[];
  for(const k of NODES){const mt=k.s.kind==='world'?fromClock(k.s,c):c,tt=clamp(mt,0,k.s.dur-.05);k._mt=mt;for(const e of k.els)if(!e.paused)e.pause();
    const v=k.els[0];if(Math.abs(v.currentTime-tt)>1e-3){if(k.s.video)waits.push(new Promise(r=>{const to=setTimeout(r,2500);v.addEventListener('seeked',()=>{clearTimeout(to);r()},{once:true})}));for(const e of k.els)e.currentTime=tt}}
  await Promise.all(waits);field();drawOut();compose();
  return{img:rc.toDataURL('image/jpeg',.9),mix:NODES.map(k=>({key:k.s.key,kind:k.s.kind,files:k.s.files,mt:k._mt,dur:k.s.dur,g:Math.sqrt(k.earW)*.95}))}};
DEMO.prepare=function(w,h){OFFLINE=true;sizeOut(w,h);return NODES.map(k=>k.s.key)};
/* ===== persistence ===== */
function save(){try{localStorage.setItem(STORE,JSON.stringify({poem:POEM,fm:FM,stage:STAGE,eye:EYE,sel:NODES.indexOf(SEL),anc:NODES.indexOf(ANC),ear:{x:EAR.x,y:EAR.y},n:NODES.map(snap)}))}catch(e){}}
function restore(){let sv=null;try{sv=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){sv=null}if(!sv||!Array.isArray(sv.n)||!sv.n.length)return false;
  if(FMODES.includes(sv.fm))FM=sv.fm;STAGE=!!sv.stage;EYE=sv.eye!==false;POEM=typeof sv.poem==='string'?sv.poem:null;if(sv.ear){EAR.x=clamp(+sv.ear.x||.5,.03,.97);EAR.y=clamp(+sv.ear.y||.5,.04,.96)}
  const n01=(v,d)=>Number.isFinite(+v)?clamp(+v,0,1):d;
  sv.n.slice(0,MAXN).forEach(d=>{if(!d||!SK[d.key])return;makeNode(d.key,{on:d.on!==false,link:d.link!==false,route:d.route&&typeof d.route==='object'?{pic:!!d.route.pic,snd:!!d.route.snd,txt:!!d.route.txt}:undefined,level:n01(d.level,.75),reach:n01(d.reach,.45),tone:clamp(+d.tone||0,-1,1),col:n01(d.col,0),x:clamp(n01(d.x,.5),.03,.97),y:clamp(n01(d.y,.5),.04,.96)})});
  SEL=NODES[sv.sel]||NODES[0]||null;ANC=NODES[sv.anc]||null;return NODES.length>0}
/* ===== the one loop ===== */
let lastT=0,lastPlay=null;
function ui(now){const A=anc(),p=!!(A&&playing(A));if(p!==lastPlay){lastPlay=p;$('play').innerHTML=svg(p?'pause':'play',2)}if(REC.on){$('rt').hidden=false;$('rt').textContent='● '+fmt((now-REC.t0)/1000)}}
function frame(now){const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;if(!document.hidden&&!OFFLINE){try{demoTick(now);bodies(dt);scrubTick(dt);momentum(dt);follow();transport(dt);loops();syncStems();field();applyLevels();drawOut();if(REC.on)compose();drawOv(now,dt);drawRig();recSample(now);ui(now)}catch(e){console.warn(e)}}requestAnimationFrame(frame)}
function selfTest(){const bad=[];if(!SRC.length)bad.push('no sources');const w=SRC.find(s=>s.kind==='world'&&s.speech);if(w&&Math.abs(fromClock(w,toClock(w,10))-10)>1e-6)bad.push('clock');if(hueOf(0)!==null)bad.push('hue');
  for(const n of ['06','10'])if(poemNodes(n).length>MAXN)bad.push('poem '+n+' too many');
  const a={x:.3,y:.5,mS:1,rS:.5},b={x:.7,y:.5,mS:1,rS:.5};if(Math.abs(fAt(a,.5,.5)-fAt(b,.5,.5))>1e-9)bad.push('field symmetry');if(fAt(a,.3,.5)!==1)bad.push('field peak');if(bad.length)console.error('self test',bad);return bad}

ov.addEventListener('pointerdown',ovDown);ov.addEventListener('pointermove',ovMove);ov.addEventListener('pointerup',ovUp);ov.addEventListener('pointercancel',ovUp);
rig.addEventListener('pointerdown',rigDown);rig.addEventListener('pointermove',rigMove);rig.addEventListener('pointerup',rigUp);rig.addEventListener('pointercancel',rigUp);

$('fmodes').innerHTML=FMODES.map(m=>`<button type="button" data-m="${m}" aria-label="${{gravity:'Gravity: soft pools',cells:'Cells: sharp territories',veil:'Veil: the whole frame mixes',tangle:'Tangle: territories interfere'}[m]}">${svg(m,1.6)}</button>`).join('');
$('fmodes').querySelectorAll('button').forEach(b=>b.onclick=()=>{TOUCHED=true;setFM(b.dataset.m)});
