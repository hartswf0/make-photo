<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: DECKS view = disc A | preview + crossfader | disc B, poem numbers underneath. MIX view = preview + clip controls over the three lanes.
   Built for a phone held sideways; portrait and desktop reflow the same pieces. Single deep-blue look by choice. */
:root{--bg:#0a17a6;--bg2:#050c6b;--ink:#eef3ff;--dim:rgba(220,230,255,.62);--faint:rgba(220,230,255,.22);--ring:rgba(200,225,255,.5);
  --a:#7fd8ff;--b:#ffb35c;--pic:#7fd8ff;--snd:#ffb35c;--txt:#d8c9ff;--rec:#ff5a6e;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 100% at 50% 35%,#1426c4 0%,var(--bg) 42%,var(--bg2) 100%);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:rgba(10,20,120,.35);border:1px solid var(--ring);border-radius:999px;cursor:pointer;padding:0 12px;min-height:34px}
button:disabled{opacity:.3;cursor:default}
button.on{background:#fff;color:#081388;border-color:#fff}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.top h1{margin:0;font:500 12px var(--mono);letter-spacing:.3em;white-space:nowrap}
.top .sp{flex:1}
.top button{min-height:28px;padding:0 11px;font-size:10px}
.tabs{display:flex;border:1px solid var(--ring);border-radius:999px;overflow:hidden}
.tabs button{border:0;border-radius:0;min-height:28px;background:transparent}
.tabs button.on{background:#fff;color:#081388}
/* DECKS view */
.decks{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:6px 14px;min-height:0}
.deck{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:5px;min-height:0;min-width:0;justify-items:center}
.deck.a{--c:var(--a)}.deck.b{--c:var(--b)}
.dname{max-width:100%;min-height:26px;padding:0 10px;font-size:10px;letter-spacing:.06em;text-transform:none;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-color:var(--c)}
.dname b{color:var(--c);font-weight:600;margin-right:6px}
.disc{position:relative;aspect-ratio:1;height:100%;max-width:100%;min-height:0;border-radius:50%;touch-action:none;cursor:grab}
.disc video{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;object-fit:cover;background:#030840;pointer-events:none}
.disc canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drow{display:flex;gap:5px;align-items:center;justify-content:center}
.drow .r{width:34px;min-width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.drow .r.big{width:40px;height:40px;font-size:14px;border-color:var(--c)}
.route{display:flex;gap:4px;align-items:center}
.route button{width:30px;min-width:30px;height:26px;min-height:26px;padding:0;letter-spacing:0;border-radius:8px;color:var(--dim)}
.route button.on{background:var(--k);border-color:var(--k);color:#06106a}
.route button[data-c="txt"]{--k:var(--txt)}.route button[data-c="pic"]{--k:var(--pic)}.route button[data-c="snd"]{--k:var(--snd)}
.send{min-height:26px;padding:0 10px;font-size:10px;border-color:var(--c);color:var(--c)}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:6px;min-height:0;min-width:0}
.screen{position:relative;min-height:0;min-width:0;overflow:hidden}
.screen canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;box-shadow:0 0 0 1px var(--ring),0 0 50px rgba(90,170,255,.22);background:#000}
.xrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.xrow b{font:600 13px var(--mono)}.xrow .ab-a{color:var(--a)}.xrow .ab-b{color:var(--b)}
.xf{position:relative;height:34px;touch-action:none;cursor:ew-resize}
.xf canvas{position:absolute;inset:0;width:100%;height:100%}
.crow{display:flex;gap:6px;align-items:center;justify-content:center}
.crow .tc{font:500 11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;min-width:9ch;text-align:center}
#recB{color:var(--rec);border-color:var(--rec)}#recB.on{background:var(--rec);color:#fff}
.dots{grid-column:1/4;display:flex;gap:6px;justify-content:center;align-items:center}
.dots button{width:30px;min-width:30px;height:30px;padding:0;letter-spacing:0;font-size:9.5px}
/* MIX view */
.mix{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.8fr);grid-template-rows:minmax(0,1fr) auto;gap:8px 14px;min-height:0}
.side{display:grid;align-content:center;gap:10px;min-width:0}
.side .tc{font:500 12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;text-align:center}
.side .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.side .r{width:44px;min-width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:15px;letter-spacing:0}
.what{font:500 11.5px/1.45 var(--mono);color:var(--dim);text-align:center;min-height:3em}
.what b{color:var(--ink);font-weight:500}
.side label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font:500 10px var(--mono);letter-spacing:.14em;color:var(--dim)}
.side input[type=range]{width:100%;accent-color:#fff}
.tl{grid-column:1/3;position:relative;height:clamp(96px,30vh,170px);border-radius:10px;background:rgba(3,8,70,.45);box-shadow:inset 0 0 0 1px var(--faint);touch-action:none}
.tl canvas{position:absolute;inset:0;width:100%;height:100%}
/* portrait: stack the same pieces */
@media (orientation:portrait) and (max-width:820px){
  .decks{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"c c" "a b" "d d"}
  .center{grid-area:c;grid-template-rows:auto auto auto}.deck.a{grid-area:a}.deck.b{grid-area:b}.dots{grid-area:d;flex-wrap:wrap}
  .screen{height:min(28vh,calc((100vw - 32px)*.5625))}
  .disc{height:auto;width:100%;max-height:100%}
  .deck{grid-template-rows:auto auto auto auto;align-content:start}
  .drow{gap:3px}.drow .r{width:29px;min-width:29px;height:30px;font-size:11px}.drow .r.big{width:34px;height:34px}
  .route button{width:25px;min-width:25px}.send{padding:0 7px}
  .mix{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}.tl{grid-column:1;height:auto;min-height:120px}
}
.turn{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);font:500 10px var(--mono);letter-spacing:.14em;color:var(--dim);pointer-events:none;white-space:nowrap}
/* sheets and toasts */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,9,70,.97);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sh h2{margin:0 6px;font:500 13px var(--mono);letter-spacing:.22em;font-weight:500}
.sb{overflow:auto;min-height:0;user-select:text;-webkit-user-select:text}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.shelf button{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;text-align:left;text-transform:none;letter-spacing:0;font:500 13px var(--sans);min-height:56px;border-radius:14px;padding:5px 10px}
.shelf i{width:46px;height:46px;border-radius:50%;background:#0a1690 center/cover no-repeat;box-shadow:0 0 0 1px var(--faint)}
.shelf small{display:block;font:500 10px var(--mono);color:var(--dim);margin-top:2px}
pre{font:500 11.5px/1.5 var(--mono);margin:0;white-space:pre}
.help{max-width:68ch;font:400 14.5px/1.6 var(--sans)}.help b{font-weight:600}
.sb video{max-width:100%;max-height:58vh;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 40px);z-index:20;background:#0b1890;border:1px solid var(--ring);border-radius:12px;padding:8px 12px;font:500 12px var(--sans);display:flex;gap:10px;align-items:center;max-width:min(92vw,560px)}
.toast button{min-height:24px}
</style>

<div class="app">
  <div class="top">
    <h1>FOURTEEN POEMS</h1>
    <div class="tabs" role="tablist"><button type="button" id="tDecks" class="on">DECKS</button><button type="button" id="tMix">MIX</button></div>
    <span class="sp"></span>
    <button type="button" id="exp">EXPORT</button><button type="button" id="help" aria-label="How it works">?</button>
  </div>

  <section class="decks" id="vDecks" aria-label="Decks">
    <div class="deck a" id="deckA"></div>
    <div class="center">
      <div class="screen"><canvas class="pgm" width="1280" height="720"></canvas></div>
      <div class="xrow"><b class="ab-a">A</b><div class="xf" id="xf" role="slider" tabindex="0" aria-label="Crossfader"><canvas></canvas></div><b class="ab-b">B</b></div>
      <div class="crow"><button type="button" id="mode" title="DISSOLVE blends the pictures; CUT shows only the side the crossfader favours">DISSOLVE</button><button type="button" id="recB" title="Lay the live output down into the mix while decks play">● REC</button><span class="tc" id="recTc"></span></div>
    </div>
    <div class="deck b" id="deckB"></div>
    <div class="dots" id="dots" aria-label="Load a poem"></div>
  </section>

  <section class="mix" id="vMix" hidden aria-label="Mix">
    <div class="screen"><canvas class="pgm" width="1280" height="720"></canvas></div>
    <div class="side">
      <div class="tc" id="mTc">0:00.0 / 0:00.0</div>
      <div class="row"><button class="r" type="button" id="mStart" aria-label="Back to start">⏮</button><button class="r" type="button" id="mPlay" aria-label="Play the mix">▶</button></div>
      <div class="what" id="what"></div>
      <label id="lvlL" hidden><span id="lvlN">LEVEL</span><input id="lvl" type="range" min="0" max="1" step=".01"></label>
      <div class="row" id="selRow" hidden><button type="button" id="cDeck">TO DECK</button><button type="button" id="cDel">DELETE</button></div>
      <div class="row"><button type="button" id="undo">UNDO</button><button type="button" id="newMix">NEW MIX</button><button type="button" id="film">RECORD FILM</button></div>
    </div>
    <div class="tl" id="tl" aria-label="Lanes: picture, sound, words"><canvas></canvas></div>
  </section>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div><div class="sh" id="shF"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== constants and helpers ===== */
const BASE=/\/city\/mix\/?/.test(location.pathname)?'../decks/':'';
const FPS=23.976,TB=24,LIM={clips:200,undo:100,rows:4,players:24};
const LANES=[{k:'pic',n:'PICTURE',c:'#7fd8ff'},{k:'snd',n:'SOUND',c:'#ffb35c'},{k:'txt',n:'WORDS',c:'#d8c9ff'}];
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor(t%1*10)};
const tcf=f=>{f=Math.max(0,Math.round(f));return[Math.floor(f/(3600*TB)),Math.floor(f/(60*TB))%60,Math.floor(f/TB)%60,f%TB].map(x=>String(x).padStart(2,'0')).join(':')};
const tc=t=>tcf(t*FPS),DPR=Math.min(2,devicePixelRatio||1);
function fit(c){const r=c.getBoundingClientRect(),w=Math.max(1,Math.round(r.width*DPR)),h=Math.max(1,Math.round(r.height*DPR));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return[w,h]}
function toast(m,act,fn){const e=$('toast');e.innerHTML=`<span>${esc(m)}</span>`+(act?`<button type="button">${act}</button>`:'');e.hidden=false;if(act)e.querySelector('button').onclick=()=>{fn();e.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,act?6000:3200)}
/* ===== <disc>: one shape for every source ===== */
const DISC=[],DK={};let SRCNAME='';
function lineWords(p,t){if(t<p.speech[0]-.3||t>p.speech[1]+.6)return null;let li=0;for(let i=0;i<p.lines.length;i++)if(p.lines[i].s<=t)li=i;const L=p.lines[li];
  const ws=p.words.filter(w=>w[0]>=L.s-.3&&w[0]<L.e);return ws.length?ws.map(w=>({w:w[2],on:w[0]<=t})):L.text.split(' ').map(w=>({w,on:true}))}
function lastBefore(list,t,key){let r=null;for(let i=0;i<list.length;i++){if(list[i][key]<=t)r=list[i];else break}return r}
function addDisc(d){DISC.push(d);DK[d.key]=d}
function buildDiscs(su,dk,ly){SRCNAME=su.source.name;const P=n=>su.poems.find(p=>p.num===n);
  su.poems.forEach(p=>addDisc({key:'R'+p.num,kind:'reading',num:p.num,title:p.title,thumb:'thumbs/'+p.num+'.jpg',dur:p.clip.dur,files:[p.clip.file],video:true,pic:1,snd:1,txt:1,base:p.clip.src_in,reel:'WYGWYL',
    span:[Math.max(0,p.speech[0]-.4),Math.min(p.clip.dur,p.speech[1]+1)],marks:p.lines.map(l=>l.s),words:t=>lineWords(p,t)}));
  dk.world.forEach(w=>addDisc({key:'W'+w.key,kind:'world',num:w.poem,title:w.title,thumb:w.thumb,dur:w.dur,files:[w.file],video:true,pic:1,snd:1,txt:0,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),span:[0,w.dur],marks:[0,...w.cuts]}));
  dk.sounds.forEach(s=>{const p=P(s.num);addDisc({key:'S'+s.num,kind:'sounds',num:s.num,title:'Line sounds · '+p.title,dur:s.dur,files:[s.file],video:false,pic:0,snd:1,txt:1,base:0,reel:'FS'+s.num,
    span:[Math.max(0,p.speech[0]-.4),Math.min(s.dur,p.speech[1]+2)],marks:s.cues.map(c=>c.t),words:t=>{const c=lastBefore(s.cues,t,'t');return c&&t-c.t<6?[{w:'♪ '+c.title,on:true},{w:'— '+c.author,on:false}]:null}})});
  ly.poems.forEach(x=>{const p=P(x.num);addDisc({key:'X'+x.num,kind:'layers',num:x.num,title:'Rooms · '+p.title,dur:x.dur,files:x.stems.map(s=>s.file),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,
    span:[Math.max(0,p.speech[0]-.4),Math.min(x.dur,p.speech[1]+2)],marks:x.lines.map(l=>l.t),xl:x.lines,words:t=>{const L=lastBefore(x.lines,t,'t');return L?[{w:L.beat,on:true}]:null}})})}
const KIND={reading:'READING',world:'WORLD',sounds:'LINE SOUNDS',layers:'ROOMS'};
/* ===== audio graph (created on the first tap) ===== */
const G={xf:.5,mode:'mix',view:'decks'};let AC=null,master=null,mDest=null,noiseBuf=null;
function ensureAC(){if(AC){AC.resume().catch(()=>{});return}AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
  try{mDest=AC.createMediaStreamDestination();master.connect(mDest)}catch(e){mDest=null}
  noiseBuf=AC.createBuffer(1,AC.sampleRate>>2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  DECK.forEach(k=>k.pl&&k.pl.wire());MIX.clips.forEach(c=>c.pl&&c.pl.wire())}
function scratch(v){if(!AC||v<.01)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=400+Math.min(1,v)*2600;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.06);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+.07)}
/* <player>: the synced media elements of one disc (1 element, or 5 for rooms). Picture players are muted. */
function makePlayer(d,muted,first){const els=d.files.map((f,i)=>{const e=(i===0&&first)?first:(d.video&&i===0?document.createElement('video'):new Audio());e.preload='auto';e.playsInline=true;e.muted=!!muted;e.src=BASE+f;return e});
  return{d,els,g:null,muted,
    wire(){if(this.g||!AC||this.muted)return;this.g=AC.createGain();this.g.gain.value=0;this.g.connect(master);for(const e of this.els){let n=e._node;if(!n){try{n=e._node=AC.createMediaElementSource(e)}catch(x){continue}}try{n.disconnect()}catch(x){}n.connect(this.g)}},
    t(){return this.els[0].currentTime||0},paused(){return this.els[0].paused},
    seek(t){for(const e of this.els){try{e.currentTime=t}catch(x){}}},
    play(){this.wire();for(const e of this.els)e.play().catch(()=>{})},
    pause(){for(const e of this.els)e.pause()},
    sync(){const t=this.t(),p=this.paused();for(let i=1;i<this.els.length;i++){const e=this.els[i];if(Math.abs(e.currentTime-t)>.08)e.currentTime=t;if(e.paused!==p)p?e.pause():e.play().catch(()=>{})}},
    vol(v){if(this.g)this.g.gain.setTargetAtTime(v,AC.currentTime,.03)},
    release(){for(const e of this.els){if(e.tagName==='VIDEO'&&e.isConnected)continue;e.pause();e.removeAttribute('src');e.load()}if(this.g){try{this.g.disconnect()}catch(x){}}}}}
/* ===== <deck> ×2 ===== */
if(matchMedia('(orientation:portrait) and (max-width:820px)').matches)setTimeout(()=>toast('Turn the phone sideways: the decks get much more room.'),1200);
const DECK=[{id:'A',col:'#7fd8ff'},{id:'B',col:'#ffb35c'}].map(k=>Object.assign(k,{d:null,pl:null,in:0,out:0,route:{pic:true,snd:true,txt:true},scr:null,err:false}));
const otherDeck=k=>k===DECK[0]?DECK[1]:DECK[0];
function deckHTML(k){return`<button class="dname" type="button" id="nm${k.id}" title="Load another disc on deck ${k.id}"><b>${k.id}</b><span id="nt${k.id}">—</span> ▾</button>
  <div class="disc" id="ds${k.id}" title="Drag along the ring to jump; drag inside to nudge"><video playsinline preload="auto" id="v${k.id}"></video><canvas></canvas></div>
  <div class="drow"><button class="r" type="button" id="pv${k.id}" title="Previous line">|◀</button><button class="r" type="button" id="mi${k.id}" title="Mark IN">[</button><button class="r big" type="button" id="pl${k.id}" aria-label="Play deck ${k.id}">▶</button><button class="r" type="button" id="mo${k.id}" title="Mark OUT">]</button><button class="r" type="button" id="nx${k.id}" title="Next line">▶|</button></div>
  <div class="drow"><div class="route" id="rt${k.id}"><button type="button" data-c="txt" title="Words reach the output">T</button><button type="button" data-c="pic" title="Picture reaches the output">V</button><button type="button" data-c="snd" title="Sound reaches the output">A</button></div><button class="send" type="button" id="sd${k.id}">SEND</button></div>`}
function deckT(k){return k.scr?k.scr.t:(k.pl?k.pl.t():0)}
function loadDeck(i,key){const k=DECK[i],d=DK[key];if(!d)return false;if(k.pl){k.pl.pause();k.pl.release()}k.d=d;k.err=false;
  const v=$('v'+k.id);v.style.visibility=d.video?'visible':'hidden';if(!d.video){v.pause();v.removeAttribute('src');v.load()}
  k.pl=makePlayer(d,false,d.video?v:null);if(AC)k.pl.wire();k.pl.els[0].onerror=()=>{k.err=true};
  k.in=d.span[0];k.out=d.span[1];k.route={pic:!!d.pic,snd:!!d.snd,txt:!!d.txt};k.pl.els[0].addEventListener('loadedmetadata',()=>k.pl.seek(k.in),{once:true});
  $('nt'+k.id).textContent=(d.kind==='reading'?d.num+' ':'')+d.title;routeUI(k);save();return true}
function routeUI(k){$('rt'+k.id).querySelectorAll('button').forEach(b=>{const c=b.dataset.c,ok=k.d&&k.d[c];b.disabled=!ok;b.classList.toggle('on',!!(ok&&k.route[c]))});

let SHELF='reading';
function shelf(i){const k=DECK[i];sheet(`<button type="button" onclick="closeSheet()">← BACK</button><h2>LOAD DECK <span style="color:${k.col}">${k.id}</span></h2>${Object.keys(KIND).map(x=>`<button type="button" data-f="${x}" class="${SHELF===x?'on':''}">${KIND[x]}</button>`).join('')}`,
  `<div class="shelf">${DISC.filter(d=>d.kind===SHELF).map(d=>`<button type="button" data-k="${d.key}"><i style="${d.thumb?`background-image:url(${BASE+d.thumb})`:`background:radial-gradient(circle at 40% 35%,${d.kind==='layers'?'#2ad1c4':'#ffb35c'}66,#0a1690 70%)`}"></i><span>${esc(d.title)}<small>${fmt(d.dur).slice(0,-2)} · ${['T','V','A'].filter((x,j)=>d[['txt','pic','snd'][j]]).join(' ')}${otherDeck(k).d===d?' · on '+otherDeck(k).id:''}</small></span></button>`).join('')}</div>`);
  $('shH').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{SHELF=b.dataset.f;shelf(i)});$('shB').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{closeSheet();loadDeck(i,b.dataset.k);dotUI()})}
function poemDots(){$('dots').innerHTML=DISC.filter(d=>d.kind==='reading').map(d=>`<button type="button" data-n="${d.num}" title="${esc(d.title)}: reading on A, its world or rooms on B">${d.num}</button>`).join('');
  $('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=b.dataset.n,w=DISC.find(d=>d.kind==='world'&&d.num===n);loadDeck(0,'R'+n);loadDeck(1,w?w.key:'X'+n);dotUI()})}
function dotUI(){const n=DECK[0].d&&DECK[0].d.kind==='reading'?DECK[0].d.num:null;$('dots').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.n===n))}
function cmx(){const tracks=[];['pic','snd'].forEach(l=>{const rows=[...new Set(MIX.clips.filter(c=>c.lane===l).map(c=>c.row))].sort();rows.forEach((r,i)=>tracks.push({l,r,name:(l==='pic'?'V':'A')+(i+1)}))});
  let o='TITLE: WYGWYL MIX\nFCM: NON-DROP FRAME\n\n',n=0;tracks.forEach(tk=>{o+=`* ---- TRACK ${tk.name} (${tk.l==='pic'?'picture':'sound'}) ----\n\n`;
    MIX.clips.filter(c=>c.lane===tk.l&&c.row===tk.r).sort((a,b)=>a.at-b.at).forEach(c=>{const d=DK[c.key],ch=tk.l==='pic'?'V    ':(tk.name==='A1'?'A    ':tk.name.padEnd(5));
      o+=`${String(++n).padStart(3,'0')}  ${d.reel.padEnd(8)} ${ch} C        ${tc(d.base+c.in)} ${tc(d.base+c.out)} ${tcf(86400+c.at*FPS)} ${tcf(86400+(c.at+len(c))*FPS)}\n* FROM CLIP NAME: ${d.kind==='reading'?SRCNAME:d.files.map(f=>f.split('/').pop()).join(' + ')}\n* ${d.title} · ${tk.l==='pic'?'OPACITY':'LEVEL'} ${Math.round(c.lvl*100)}%\n\n`})});
  const tx=MIX.clips.filter(c=>c.lane==='txt').sort((a,b)=>a.at-b.at);if(tx.length){o+='* ---- WORDS (titles) ----\n';tx.forEach(c=>{const d=DK[c.key];o+=`* TEXT ${tcf(86400+c.at*FPS)} → ${tcf(86400+(c.at+len(c))*FPS)} from ${d.title} ${tc(d.base+c.in)}–${tc(d.base+c.out)} · opacity ${Math.round(c.lvl*100)}%\n`})}return o}
function projJSON(){return JSON.stringify({version:2,source:SRCNAME,fps:FPS,clips:MIX.clips.map(({pl,...c})=>({...c,disc:DK[c.key].title,reel:DK[c.key].reel,src_in_tc:tc(DK[c.key].base+c.in),src_out_tc:tc(DK[c.key].base+c.out),rec_in_tc:tcf(86400+c.at*FPS)}))},null,1)}
let DL=null;const dlReady=(window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(d=>{DL=d}).catch(()=>{DL=null});
async function saveFile(name,data){await dlReady;if(DL){try{await DL.save({filename:name,data});toast('Saved '+name+'.')}catch(e){toast(e&&e.code==='declined'?'Not saved.':'Saving is not available here.')}return}
  const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied.')).catch(()=>{const r=document.createRange();r.selectNodeContents($('shB'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Copying is blocked here. The text is selected.')})}
function exportSheet(){if(!MIX.clips.length)return toast('The mix is empty.');sheet(`<button type="button" onclick="closeSheet()">← BACK</button><h2>EXPORT</h2>`,`<pre>${esc(cmx())}</pre>`,`<span style="flex:1;color:var(--dim);font:500 10.5px var(--mono)">CMX3600 · V1… picture · A1… sound · words as notes</span><button type="button" id="xC">COPY EDL</button><button type="button" id="xE">SAVE EDL</button><button type="button" id="xJ">SAVE PROJECT</button>`);
  $('xC').onclick=()=>copy(cmx());$('xE').onclick=()=>saveFile('wygwyl-mix-edl.txt',cmx());$('xJ').onclick=()=>saveFile('wygwyl-mix.json',projJSON())}
/* RECORD FILM: play the mix once from the start and capture the preview with its sound */
const FILM={on:false,mr:null};
function recordFilm(){const cv=$('vMix').querySelector('canvas.pgm');if(!window.MediaRecorder||!cv.captureStream)return toast('This browser cannot record the film.');if(!MIX.clips.length)return toast('The mix is empty.');ensureAC();
  const st=cv.captureStream(30);if(mDest)mDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));const type=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let mr;try{mr=new MediaRecorder(st,type?{mimeType:type,videoBitsPerSecond:4e6}:{})}catch(e){return toast('Recording could not start.')}const parts=[];mr.ondataavailable=e=>{if(e.data.size&&parts.length<4000)parts.push(e.data)};
  mr.onstop=()=>{FILM.on=false;const ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm',b=new Blob(parts,{type:mr.mimeType||'video/webm'}),u=URL.createObjectURL(b);
    sheet(`<button type="button" onclick="closeSheet()">← BACK</button><h2>YOUR FILM</h2>`,`<video src="${u}" controls playsinline></video><p class="help">${(b.size/1e6).toFixed(1)} MB · ${fmt(mixDur())}</p>`,`<button type="button" id="xF">SAVE FILM</button>`);$('xF').onclick=()=>saveFile('wygwyl-mix.'+ext,b)};
  view('mix');MIX.PT=0;mixStop();mixSync(true);setTimeout(()=>{FILM.on=true;FILM.mr=mr;mr.start(500);mixPlay();toast('Recording the film in real time. Press ■ to stop early.')},600)}
function helpSheet(){sheet(`<button type="button" onclick="closeSheet()">← BACK</button><h2>HOW IT WORKS</h2>`,`<div class="help">
<p><b>Two decks.</b> Each disc holds picture, sound or words. Tap a poem number to put its reading on A and its world (or rooms) on B, or tap a deck's name to load any disc.</p>
<p><b>Scrub.</b> Drag along a disc's ring to jump anywhere; drag inside it to nudge, finely (one turn is eight seconds). |◀ and ▶| jump to the previous or next spoken line.</p>
<p><b>Route.</b> T · V · A under a deck decide whether its words, picture and sound reach the output. The crossfader blends A and B. DISSOLVE mixes the pictures; CUT shows only the side the crossfader favours.</p>
<p><b>Lay it down.</b> Mark <b>[</b> IN and <b>]</b> OUT on a deck and SEND: its routed channels go into the mix at the mix playhead, each on its own lane. Or press <b>● REC</b> and play: whatever is routed and playing is laid down as you perform.</p>
<p><b>Edit.</b> MIX shows the lanes. Tap a clip to set its opacity or volume, delete it, or put it back on a deck; drag to move; drag an edge to trim; UNDO steps back. ▶ plays the mix, exactly as it will be.</p>
<p><b>Finish.</b> EXPORT gives the edit list and the project. RECORD FILM plays the mix once and records it.</p>
<p><b>Keys.</b> Space play mix · X / M play A / B · ← → crossfader · R record · Ctrl/⌘-Z undo · Esc close.</p></div>`)}
/* ===== wiring ===== */
function wireDeck(k,i){const el=$('ds'+k.id);el.addEventListener('pointerdown',e=>scrubStart(k,e));el.addEventListener('pointermove',e=>scrubMove(k,e));el.addEventListener('pointerup',()=>scrubEnd(k));el.addEventListener('pointercancel',()=>scrubEnd(k));
  $('nm'+k.id).onclick=()=>{SHELF=k.d?k.d.kind:'reading';shelf(i)};$('pl'+k.id).onclick=()=>deckPlay(k);$('pv'+k.id).onclick=()=>jumpLine(k,-1);$('nx'+k.id).onclick=()=>jumpLine(k,1);
  $('mi'+k.id).onclick=()=>{if(!k.d)return;k.in=clamp(deckT(k),0,k.out-.2);routeUI(k)};$('mo'+k.id).onclick=()=>{if(!k.d)return;k.out=clamp(deckT(k),k.in+.2,k.d.dur);routeUI(k)};
  $('rt'+k.id).querySelectorAll('button').forEach(b=>b.onclick=()=>{k.route[b.dataset.c]=!k.route[b.dataset.c];routeUI(k);applyLive()});$('sd'+k.id).onclick=()=>send(k)}
function wireXF(){const el=$('xf');const set=e=>{const r=el.getBoundingClientRect();G.xf=clamp((e.clientX-r.left-14)/(r.width-28),0,1);if(Math.abs(G.xf-.5)<.03)G.xf=.5;applyLive()};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);set(e)});el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))set(e)});el.addEventListener('dblclick',()=>{G.xf=.5;applyLive()});
  el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){G.xf=clamp(G.xf+(e.key==='ArrowLeft'?-.05:.05),0,1);applyLive();e.preventDefault();e.stopPropagation()}})}
let clearArm=0;
function wireAll(){DECK.forEach((k,i)=>{$('deck'+k.id).innerHTML=deckHTML(k);wireDeck(k,i)});wireXF();poemDots();
  $('mode').onclick=()=>{G.mode=G.mode==='mix'?'cut':'mix';$('mode').textContent=G.mode==='mix'?'DISSOLVE':'CUT';applyLive()};
  $('recB').onclick=()=>{REC.on?recStop():recStart()};$('tDecks').onclick=()=>view('decks');$('tMix').onclick=()=>view('mix');
  $('mPlay').onclick=()=>{MIX.playing?mixStop():mixPlay()};$('mStart').onclick=()=>{MIX.PT=0;mixSync(true)};$('undo').onclick=undo;$('film').onclick=recordFilm;
  $('newMix').onclick=()=>{if(!MIX.clips.length)return;if(Date.now()-clearArm>2500){clearArm=Date.now();return toast('Press NEW MIX again to clear the whole mix.')}snap();mixStop();setClips([]);MIX.PT=0;toast('Mix cleared.','UNDO',undo)};
  $('lvl').onpointerdown=()=>snap();$('lvl').oninput=e=>{const c=MIX.clips.find(x=>x.id===MIX.sel);if(c){c.lvl=+e.target.value;mixSync();save()}};
  $('cDel').onclick=()=>{const c=MIX.clips.find(x=>x.id===MIX.sel);if(!c)return;snap();if(c.pl)c.pl.release();MIX.clips=MIX.clips.filter(x=>x!==c);MIX.sel=null;sideUI();save();toast('Clip deleted.','UNDO',undo)};
  $('cDeck').onclick=()=>{const c=MIX.clips.find(x=>x.id===MIX.sel);if(!c)return;const i=G.xf<=.5?0:1,k=DECK[i];if(!k.d||k.d.key!==c.key)loadDeck(i,c.key);k.in=c.in;k.out=c.out;setTimeout(()=>k.pl.seek(c.in),250);routeUI(k);view('decks');toast(`Clip put back on deck ${k.id}, with its IN and OUT.`)};
  const tl=$('tl');tl.addEventListener('pointerdown',tlDown);tl.addEventListener('pointermove',tlMove);tl.addEventListener('pointerup',tlUp);tl.addEventListener('pointercancel',tlUp);
  $('exp').onclick=exportSheet;$('help').onclick=helpSheet;
  addEventListener('keydown',e=>{if(!$('sheet').hidden){if(e.key==='Escape')closeSheet();return}if(e.target.closest('input'))return;const K=e.key.toLowerCase();
    if((e.metaKey||e.ctrlKey)&&K==='z'){e.preventDefault();undo();return}if(e.metaKey||e.ctrlKey)return;
    if(K===' '){e.preventDefault();$('mPlay').click()}else if(K==='x')deckPlay(DECK[0]);else if(K==='m')deckPlay(DECK[1]);else if(K==='r')$('recB').click();
    else if((K==='arrowleft'||K==='arrowright')&&!e.target.closest('[role=slider]')){G.xf=clamp(G.xf+(K==='arrowleft'?-.1:.1),0,1);applyLive()}})}
function save(){try{localStorage.setItem('mixdiscs.v2',JSON.stringify({clips:MIX.clips.map(({pl,...c})=>c),decks:DECK.map(k=>k.d&&k.d.key)}))}catch(e){}}
function uiTick(){DECK.forEach(k=>{$('pl'+k.id).textContent=k.pl&&!k.pl.paused()?'❚❚':'▶'});$('recB').classList.toggle('on',REC.on);$('recB').textContent=REC.on?'■ STOP REC':'● REC';$('recTc').textContent=REC.on?fmt(recNow()-REC.base):'';
  $('mPlay').textContent=MIX.playing?'■':'▶';$('mTc').textContent=`${fmt(MIX.PT)} / ${fmt(mixDur())}`}
/* ===== the one open loop: does nothing while the page is hidden ===== */
function frame(){if(!document.hidden){try{
    if(MIX.playing){MIX.PT=MIX.pt0+(performance.now()-MIX.p0)/1000;if(MIX.PT>=mixDur()){MIX.PT=mixDur();mixStop()}}
    mixSync(false);releaseFar(false);DECK.forEach(k=>k.pl&&k.pl.sync());recTick();applyLive();
    if(G.view==='decks'){DECK.forEach(drawDisc);drawXF();drawOut($('vDecks').querySelector('canvas.pgm'))}else{drawOut($('vMix').querySelector('canvas.pgm'));drawTL()}uiTick()
  }catch(e){console.warn(e)}}requestAnimationFrame(frame)}
/* ===== self test: the invariants hold on sample data ===== */
function selfTest(){const bad=[],d=DISC[0];if(!d)bad.push('no discs');else{if(!validClip({key:d.key,lane:'pic',in:0,out:1,at:0,row:0,lvl:1}))bad.push('valid clip rejected');if(validClip({key:d.key,lane:'pic',in:2,out:1,at:0,row:0,lvl:1}))bad.push('reversed clip accepted');if(validClip({key:'nope',lane:'pic',in:0,out:1,at:0,row:0,lvl:1}))bad.push('unknown disc accepted');if(DK.S01&&validClip({key:'S01',lane:'pic',in:0,out:1,at:0,row:0,lvl:1}))bad.push('picture accepted from a sound disc')}
  if(bad.length)console.error('Mix Discs self test failed:',bad);return bad}
function example(){const R=DK.R06,s0=R.span[0],s1=s0+40;return[{id:1,lane:'pic',key:'W06',in:0,out:40,at:0,row:0,lvl:1},{id:2,lane:'snd',key:'R06',in:s0,out:s1,at:0,row:0,lvl:1},{id:3,lane:'txt',key:'R06',in:s0,out:s1,at:0,row:0,lvl:1},{id:4,lane:'pic',key:'R06',in:s0+14,out:s0+24,at:14,row:1,lvl:.55},{id:5,lane:'snd',key:'X06',in:s0,out:s1,at:0,row:1,lvl:.6}]}
Promise.all(['suite.json','decks.json','layers.json'].map(u=>fetch(BASE+u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()}))).then(([s,d,x])=>{buildDiscs(s,d,x);wireAll();selfTest();
  let sv=null;try{sv=JSON.parse(localStorage.getItem('mixdiscs.v2')||'null')}catch(e){sv=null}
  if(sv&&Array.isArray(sv.clips)&&sv.clips.length){setClips(sv.clips);toast(`Your last mix is back: ${MIX.clips.length} clips.`)}else setClips(example());
  const dk=sv&&Array.isArray(sv.decks)?sv.decks:[];loadDeck(0,DK[dk[0]]?dk[0]:'R06');loadDeck(1,DK[dk[1]]?dk[1]:'W06');dotUI();view('decks');requestAnimationFrame(frame)})
  .catch(err=>{document.body.insertAdjacentHTML('beforeend',`<div class="toast">The discs did not load (${esc(err.message)}). Reload the page.</div>`)});
</script>
