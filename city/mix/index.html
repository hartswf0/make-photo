<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the output fills the screen; the discs float on it as gears. A few icon buttons sit at the edges. Single dark look by choice. */
:root{--ink:#eef3ff;--dim:rgba(220,230,255,.6);--ring:rgba(200,225,255,.5);--rec:#ff5a6e;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#020418;color:var(--ink);font:500 13px/1.4 ui-monospace,"IBM Plex Mono",Menlo,monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#out{z-index:0}#rig{z-index:1}
.ic{position:fixed;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--ring);background:rgba(4,10,60,.45);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ic svg{width:20px;height:20px}
.ic:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ic.on{background:var(--rec);border-color:var(--rec)}
#add{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 56px)}
#rec{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px))}
#help{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));width:36px;height:36px}
.poems{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.poems button{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,225,255,.35);background:rgba(4,10,60,.4);color:var(--dim);font:500 9px ui-monospace,monospace;padding:0;cursor:pointer}
.poems button.on{background:#fff;color:#06106a;border-color:#fff}
.rt{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);font:600 12px ui-monospace,monospace;color:var(--rec);text-shadow:0 0 6px #000;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(2,5,40,.94);display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sh{display:flex;gap:10px;align-items:center}
.sh .ic{position:static}
.sb{overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.grid button{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(200,225,255,.3);background:#0a1690 center/cover no-repeat;position:relative;cursor:pointer;padding:0;color:#fff}
.grid button span{position:absolute;inset:auto 0 6px;font:600 10px ui-monospace,monospace;text-shadow:0 0 4px #000,0 0 2px #000}
.grid button i{position:absolute;top:7px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.grid button i b{width:6px;height:6px;border-radius:50%}
.grid button.cur{border-color:#fff;box-shadow:0 0 0 2px #fff}
.tabsk{display:flex;gap:6px}
.tabsk button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tabsk button.on{background:#fff;color:#06106a}
.tabsk svg{width:18px;height:18px}
.take video{max-width:100%;max-height:62vh;border-radius:12px;display:block;margin:0 auto}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:980px}
.howto div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;font:400 14px/1.45 system-ui,sans-serif;color:var(--ink)}
.howto svg{width:52px;height:52px}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);background:rgba(8,16,90,.92);border:1px solid var(--ring);border-radius:22px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font:500 12px system-ui,sans-serif}
.toast button{border:1px solid var(--ring);background:transparent;color:var(--ink);border-radius:16px;min-height:28px;padding:0 10px;font:600 10px ui-monospace,monospace;cursor:pointer}
</style>

<canvas id="out" aria-label="The output"></canvas>
<canvas id="rig" aria-label="Discs. Tap a centre to play, turn a ring to move in time, drag a centre to move a disc, push two discs together to link them."></canvas>
<button class="ic" id="help" type="button" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg></button>
<button class="ic" id="add" type="button" aria-label="Add a disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg></button>
<button class="ic" id="rec" type="button" aria-label="Record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg></button>
<div class="rt" id="rt" hidden></div>
<div class="poems" id="poems" aria-label="Poems"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== constants ===== */
const BASE=/\/city\/mix\/?/.test(location.pathname)?'../decks/':'';
const FPS=23.976,TB=24,TURN=8,TEETH=40,MAXD=4,SNAP=26;   // one ring turn = 8 s; at most 4 discs
const KCOL={reading:'#7fd8ff',world:'#9ff0c4',sounds:'#ffb35c',layers:'#d6a8ff'};
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcf=f=>{f=Math.max(0,Math.round(f));return[Math.floor(f/(3600*TB)),Math.floor(f/(60*TB))%60,Math.floor(f/TB)%60,f%TB].map(x=>String(x).padStart(2,'0')).join(':')};
const tc=t=>tcf(t*FPS),fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const DPR=Math.min(2,devicePixelRatio||1),buzz=p=>{if(!TOUCHED)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};let TOUCHED=false;
const ICON={pic:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',snd:'<path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/>',txt:'<path d="M5 7h14M5 12h14M5 17h9"/>',
  reading:'<circle cx="12" cy="8" r="3"/><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6"/>',world:'<path d="M3 18l6-8 4 5 3-3 5 6z"/><circle cx="17" cy="7" r="2"/>',sounds:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',save:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>'};
const svg=(k,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
function toast(m,act,fn){const e=$('toast');e.innerHTML=`<span>${esc(m)}</span>`+(act?`<button type="button">${act}</button>`:'');e.hidden=false;if(act)e.querySelector('button').onclick=()=>{fn();e.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,act?5000:2400)}
/* ===== sources: every disc is one of these ===== */
const SRC=[],SK={};let SRCNAME='';
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function wav(w){return w?{rate:w.rate,lo:dec(w.lo),mid:dec(w.mid),hi:dec(w.hi)}:null}
function lastBefore(list,t,k){let r=null;for(let i=0;i<list.length;i++){if(list[i][k]<=t)r=list[i];else break}return r}
function lineWords(p,t){if(t<p.speech[0]-.3||t>p.speech[1]+.6)return null;let L=p.lines[0];for(const l of p.lines){if(l.s<=t)L=l;else break}const ws=p.words.filter(w=>w[0]>=L.s-.3&&w[0]<L.e);return ws.length?ws.map(w=>({w:w[2],on:w[0]<=t})):[{w:L.text,on:true}]}
function addSrc(s){SRC.push(s);SK[s.key]=s}
function build(su,dk,ly){SRCNAME=su.source.name;const P=n=>su.poems.find(p=>p.num===n);
  su.poems.forEach(p=>addSrc({key:'R'+p.num,kind:'reading',num:p.num,title:p.title,thumb:'thumbs/'+p.num+'.jpg',dur:p.clip.dur,files:[p.clip.file],video:true,pic:1,snd:1,txt:1,base:p.clip.src_in,reel:'WYGWYL',start:Math.max(0,p.speech[0]-.4),marks:p.lines.map(l=>l.s),wave:wav(p.wave),words:t=>lineWords(p,t),speech:p.speech}));
  dk.world.forEach(w=>{const p=w.poem&&P(w.poem);addSrc({key:'W'+w.key,kind:'world',num:w.poem,title:w.title,thumb:w.thumb,dur:w.dur,files:[w.file],video:true,pic:1,snd:1,txt:0,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),start:0,marks:[0,...w.cuts],wave:wav(w.wave),speech:p?p.speech:null})});
  dk.sounds.forEach(s=>{const p=P(s.num);addSrc({key:'S'+s.num,kind:'sounds',num:s.num,title:'Line sounds · '+p.title,dur:s.dur,files:[s.file],video:false,pic:0,snd:1,txt:1,base:0,reel:'FS'+s.num,start:Math.max(0,p.speech[0]-.4),marks:s.cues.map(c=>c.t),wave:wav(s.wave),speech:p.speech,
    words:t=>{const c=lastBefore(s.cues,t,'t');return c&&t-c.t<6?[{w:'♪ '+c.title,on:true}]:null}})});
  ly.poems.forEach(x=>{const p=P(x.num);addSrc({key:'X'+x.num,kind:'layers',num:x.num,title:'Rooms · '+p.title,dur:x.dur,files:x.stems.map(s=>s.file),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,start:Math.max(0,p.speech[0]-.4),marks:x.lines.map(l=>l.t),wave:wav(x.wave),speech:p.speech,
    words:t=>{const L=lastBefore(x.lines,t,'t');return L?[{w:L.layers.map(y=>y.label).slice(3).join(' · '),on:true}]:null}})})}
/* poem time: a world reel is stretched over the reading of its poem, so meshed discs of one poem keep the words together */
function toClock(s,t){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return a+t/s.dur*(b-a)}return t}
function fromClock(s,c){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return(c-a)/(b-a)*s.dur}return c}
function rateOf(s){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return s.dur/(b-a)}return 1}
/* ===== audio ===== */
let AC=null,master=null,mDest=null,noise=null;
function ensureAC(){if(AC){AC.resume().catch(()=>{});return}AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);try{mDest=AC.createMediaStreamDestination();master.connect(mDest)}catch(e){mDest=null}
  noise=AC.createBuffer(1,AC.sampleRate>>3,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;DISCS.forEach(k=>wire(k))}
function tick(v,f){if(!AC||v<=0)return;const s=AC.createBufferSource(),b=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;b.type='bandpass';b.frequency.value=f||1800;b.Q.value=4;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.04);s.connect(b);b.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+.05)}
function wire(k){if(!AC||k.g)return;k.g=AC.createGain();k.g.gain.value=0;k.g.connect(master);for(const e of k.els){let n=e._n;if(!n){try{n=e._n=AC.createMediaElementSource(e)}catch(x){continue}}try{n.disconnect()}catch(x){}n.connect(k.g)}}
/* ===== discs (gears) ===== */
const DISCS=[];let uid=1;
function makeDisc(key,x,y){const s=SK[key];if(!s||DISCS.length>=MAXD)return null;
  const els=s.files.map((f,i)=>{const e=s.video&&i===0?document.createElement('video'):new Audio();e.preload='auto';e.playsInline=true;e.muted=false;e.loop=false;e.src=BASE+f;return e});
  const k={id:uid++,s,els,g:null,x,y,route:{pic:!!s.pic,snd:!!s.snd,txt:s.kind==='reading'},dir:1,phase:0,loop:null,level:0,err:false,hold:null};
  els[0].onerror=()=>{k.err=true};els[0].addEventListener('loadedmetadata',()=>seekD(k,s.start),{once:true});wire(k);DISCS.push(k);return k}
function removeDisc(k){for(const e of k.els){e.pause();e.removeAttribute('src');e.load()}if(k.g)try{k.g.disconnect()}catch(e){}DISCS.splice(DISCS.indexOf(k),1)}
const tD=k=>k.els[0].currentTime||0,playing=k=>!k.els[0].paused;
function seekD(k,t){t=clamp(t,0,k.s.dur-.05);for(const e of k.els){try{e.currentTime=t}catch(x){}}}
function playD(k,on){if(on){ensureAC();wire(k);if(tD(k)>=k.s.dur-.1)seekD(k,0);for(const e of k.els)e.play().catch(()=>{})}else for(const e of k.els)e.pause()}
/* geometry: discs live in screen space; size follows the screen */
let W=0,H=0;
function radius(){const m=Math.min(W,H);return clamp(m*(DISCS.length>2?.2:.24),54,190)}
const pos=k=>({x:k.x*W,y:k.y*H});
/* level comes from position: the nearer the centre, the stronger in the output */
function levelOf(k){const p=pos(k),d=Math.hypot(p.x-W/2,p.y-H/2)/(Math.min(W,H)*.62);return clamp(1.15-d,0,1)}
/* ===== meshing: discs whose rims touch are linked like gears ===== */
let MESH=new Set(),GROUP=new Map(),ANCHOR=new Map();
const pairKey=(a,b)=>a.id<b.id?a.id+'-'+b.id:b.id+'-'+a.id;
function computeMesh(){const r=radius(),next=new Set();for(let i=0;i<DISCS.length;i++)for(let j=i+1;j<DISCS.length;j++){const a=DISCS[i],b=DISCS[j],pa=pos(a),pb=pos(b),d=Math.hypot(pa.x-pb.x,pa.y-pb.y);
    const was=MESH.has(pairKey(a,b));if(d<2*r+(was?SNAP*1.6:SNAP))next.add(pairKey(a,b))}
  for(const p of next)if(!MESH.has(p))onMesh(p,true);for(const p of MESH)if(!next.has(p))onMesh(p,false);MESH=next;groups()}
function groups(){GROUP=new Map();let gid=0;for(const k of DISCS){if(GROUP.has(k.id))continue;gid++;const stack=[k];GROUP.set(k.id,gid);k.dir=1;let guard=0;
    while(stack.length&&guard++<MAXD*4){const c=stack.pop();for(const o of DISCS){if(GROUP.has(o.id)||!MESH.has(pairKey(c,o)))continue;GROUP.set(o.id,gid);o.dir=-c.dir;stack.push(o)}}}}
const groupOf=k=>DISCS.filter(o=>GROUP.get(o.id)===GROUP.get(k.id));
function onMesh(p,on){const[a,b]=p.split('-').map(Number).map(id=>DISCS.find(k=>k.id===id));if(!a||!b)return;buzz(on?[18,40,18]:12);tick(on?.5:.25,on?900:2400);
  FLASH.push({x:(pos(a).x+pos(b).x)/2,y:(pos(a).y+pos(b).y)/2,t:performance.now(),on});if(FLASH.length>8)FLASH.shift();if(on)anchor(a)}
/* the anchor of a group is the disc last touched; the others keep the time offset they had when it became the anchor */
function anchor(k){const g=groupOf(k),c=toClock(k.s,tD(k));for(const o of g){o.off=toClock(o.s,tD(o))-c}ANCHOR.set(GROUP.get(k.id),k)}
function follow(){for(const k of DISCS){const a=ANCHOR.get(GROUP.get(k.id));if(!a||a===k||!DISCS.includes(a))continue;if(k.off==null)k.off=0;
    const tgt=fromClock(k.s,toClock(a.s,tD(a))+k.off-(a.off||0)),inR=tgt>=0&&tgt<k.s.dur-.05,want=playing(a)&&!a.hold&&inR;
    if(want&&!playing(k)){seekD(k,tgt);playD(k,true)}else if(!want&&playing(k))playD(k,false);
    for(const e of k.els)e.playbackRate=clamp(a.els[0].playbackRate*rateOf(k.s)/rateOf(a.s),.25,4);
    if(inR&&Math.abs(tD(k)-tgt)>(playing(k)?.25:.04))seekD(k,tgt)}}
/* ===== touch: hub = play / move; ring = turn time; hold the hub = swap; double-tap the hub = loop the line ===== */
const PTR=new Map();
function hit(x,y){const r=radius();let best=null;for(let i=DISCS.length-1;i>=0;i--){const k=DISCS[i],p=pos(k),d=Math.hypot(x-p.x,y-p.y);if(d<=r*1.08){best={k,zone:d<r*.42?'hub':'ring',d};break}}
  if(!best){for(const k of DISCS){const p=pos(k);const ch=chanAt(k,x,y);if(ch)return{k,zone:'chan',ch}}}return best}
function chanSpots(k){const r=radius(),p=pos(k),out=[];['txt','pic','snd'].forEach((c,i)=>{if(!k.s[c])return;const a=-Math.PI/2+(i-1)*.42;out.push({c,x:p.x+Math.cos(a)*(r+20),y:p.y+Math.sin(a)*(r+20)})});return out}
function chanAt(k,x,y){for(const s of chanSpots(k))if(Math.hypot(x-s.x,y-s.y)<17)return s.c;return null}
function down(e){TOUCHED=true;const x=e.clientX,y=e.clientY,h=hit(x,y);if(!h)return;e.preventDefault();ensureAC();rig.setPointerCapture(e.pointerId);
  if(h.zone==='chan'){h.k.route[h.ch]=!h.k.route[h.ch];buzz(8);tick(.2,3200);return}
  const k=h.k,p=pos(k);DISCS.push(DISCS.splice(DISCS.indexOf(k),1)[0]);anchor(k);
  const st={k,zone:h.zone,x0:x,y0:y,ox:p.x-x,oy:p.y-y,a:Math.atan2(y-p.y,x-p.x),t:tD(k),was:playing(k),moved:0,t0:performance.now(),last:0,vel:0};
  if(h.zone==='ring'){k.hold=st;for(const e of k.els)e.pause()}
  else st.timer=setTimeout(()=>{if(st.moved<8){st.long=true;buzz(30);picker(k)}},560);
  PTR.set(e.pointerId,st)}
function move(e){const st=PTR.get(e.pointerId);if(!st)return;const k=st.k,x=e.clientX,y=e.clientY;st.moved=Math.max(st.moved,Math.hypot(x-st.x0,y-st.y0));
  if(st.zone==='hub'){if(st.moved<8)return;clearTimeout(st.timer);const rr=radius()*1.15;k.x=clamp((x+st.ox)/W,rr/W,1-rr/W);k.y=clamp((y+st.oy)/H,(rr+40)/H,1-(rr+30)/H);computeMesh();return}
  const p=pos(k),a=Math.atan2(y-p.y,x-p.x);let da=a-st.a;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;st.a=a;
  const dt=da*k.dir/(Math.PI*2)*TURN,nt=clamp(st.t+dt,0,k.s.dur-.05),now=performance.now();st.vel=dt/Math.max(1,now-(st.lastT||now))*1000;st.lastT=now;
  const toothA=Math.floor(nt/TURN*TEETH),toothB=Math.floor(st.t/TURN*TEETH);if(toothA!==toothB){buzz(4);tick(.16,1400+Math.min(2,Math.abs(st.vel))*900)}
  st.t=nt;seekD(k,nt);for(const o of groupOf(k))if(o!==k){o.hold=st;const tgt=fromClock(o.s,toClock(k.s,nt)+o.off-(k.off||0));if(tgt>=0&&tgt<o.s.dur)seekD(o,tgt);for(const e of o.els)e.pause()}}
function up(e){const st=PTR.get(e.pointerId);if(!st)return;PTR.delete(e.pointerId);const k=st.k;clearTimeout(st.timer);
  if(st.zone==='hub'){if(st.long)return;if(st.moved<8){const now=performance.now();if(now-(k.lastTap||0)<320){toggleLoop(k);k.lastTap=0;return}k.lastTap=now;setTimeout(()=>{if(k.lastTap===now){const on=!playing(k);for(const o of groupOf(k))if(o===k)playD(o,on);buzz(10)}},330)}else{const o=snapMesh(k);computeMesh();phaseFor(k,o);save()}return}

/* ===== loop: one open loop; idle while hidden ===== */
function resize(){W=innerWidth;H=innerHeight;rig.width=Math.round(W*DPR);rig.height=Math.round(H*DPR);const s=Math.min(1,1280/W);out.width=Math.round(W*DPR*s);out.height=Math.round(H*DPR*s);computeMesh()}
function frame(now){if(!document.hidden){try{follow();loops();syncStems();applyLevels();drawOut();drawRig(now);recSample(now);if(REC.on){$('rt').hidden=false;$('rt').textContent='● '+fmt((now-REC.t0)/1000)}}catch(e){console.warn(e)}}requestAnimationFrame(frame)}
function selfTest(){const bad=[];if(!SRC.length)bad.push('no sources');const w=SRC.find(s=>s.kind==='world'&&s.speech);if(w){const c=toClock(w,10);if(Math.abs(fromClock(w,c)-10)>1e-6)bad.push('clock round trip')}if(MAXD<2)bad.push('MAXD');if(bad.length)console.error('self test',bad);return bad}
addEventListener('resize',resize);rig.addEventListener('pointerdown',down);rig.addEventListener('pointermove',move);rig.addEventListener('pointerup',up);rig.addEventListener('pointercancel',up);
$('add').onclick=()=>{if(DISCS.length>=MAXD)return toast('Four discs at most');picker(null)};$('rec').onclick=recToggle;$('help').onclick=helpSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key===' '&&$('sheet').hidden&&DISCS.length){e.preventDefault();const k=DISCS[DISCS.length-1];playD(k,!playing(k))}if(e.key==='r'&&$('sheet').hidden)recToggle()});
Promise.all(['suite.json','decks.json','layers.json'].map(u=>fetch(BASE+u).then(r=>{if(!r.ok)throw new Error(u);return r.json()}))).then(([s,d,x])=>{build(s,d,x);resize();poemDots();selfTest();if(!restore())loadPoem('06');else{computeMesh();poemUI()}requestAnimationFrame(frame)})
  .catch(e=>{document.body.insertAdjacentHTML('beforeend',`<div class="toast">Could not load (${esc(e.message)}). Reload.</div>`)});
</script>

</html>
