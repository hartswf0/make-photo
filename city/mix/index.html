<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the output owns its own rectangle; nodes live in the rest of the screen on a computed grid, so nothing ever covers the picture or another node. Single dark look by choice: it is a stage tool. */
:root{--ink:#eef3ff;--dim:rgba(220,230,255,.6);--ring:rgba(200,225,255,.4);--rec:#ff5a6e;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#020418;color:var(--ink);font:500 13px/1.4 ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#safe{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
#rig{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#out{position:fixed;z-index:1;display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(200,225,255,.18);background:#000;cursor:pointer}
#bar{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 4px max(10px,env(safe-area-inset-left,0px));background:#020418}
.b{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.b svg{width:19px;height:19px}.b.on{background:var(--rec);border-color:var(--rec)}
.b:focus-visible,.seg button:focus-visible,.poems button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.seg{flex:none;display:flex;border:1px solid var(--ring);border-radius:20px;overflow:hidden}
.seg button{width:40px;height:36px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.seg button svg{width:20px;height:20px}.seg button.on{background:#fff;color:#06106a}
.sp{flex:1}
.poems{display:flex;flex:1;min-width:0}
.poems button{flex:1;min-width:0;height:38px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--dim)}
.poems button span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(200,225,255,.3);display:grid;place-items:center;font:500 9px ui-monospace,monospace}
.poems button.on span{background:#fff;color:#06106a;border-color:#fff}
@media (orientation:landscape){.sp{display:none}}
@media (orientation:portrait){.poems{order:9;flex-basis:100%}}
.rt{flex:none;font:600 11px ui-monospace,monospace;color:var(--rec)}
.sheet{position:fixed;z-index:10;background:rgba(2,5,40,.97);display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;box-sizing:border-box;box-shadow:0 0 0 1px rgba(200,225,255,.2)}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
.grid button{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(200,225,255,.3);background:#0a1690 center/cover no-repeat;position:relative;cursor:pointer;padding:0;color:#fff}
.grid button span{position:absolute;inset:auto 0 6px;font:600 10px ui-monospace,monospace;text-shadow:0 0 4px #000,0 0 2px #000}
.grid button i{position:absolute;top:7px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.grid button i b{width:6px;height:6px;border-radius:50%}
.grid button.cur{border-color:#fff;box-shadow:0 0 0 2px #fff}
.tabsk{display:flex;gap:6px}
.tabsk button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tabsk button.on{background:#fff;color:#06106a}.tabsk svg{width:18px;height:18px}
.take video{max-width:100%;max-height:52vh;border-radius:8px;display:block;margin:0 auto}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.howto div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;font:400 13.5px/1.45 system-ui,sans-serif}
.howto svg{width:52px;height:52px}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(8,16,90,.95);border:1px solid var(--ring);border-radius:22px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font:500 12px system-ui,sans-serif}
.toast button{border:1px solid var(--ring);background:transparent;color:var(--ink);border-radius:16px;min-height:30px;padding:0 10px;font:600 10px ui-monospace,monospace;cursor:pointer}
</style>

<div id="safe"></div>
<canvas id="rig" aria-label="Nodes. Each is a dial: tap the centre to play, turn the middle band to move in time, slide around the outer edge to set level (top), tone (right), colour (bottom) and blend (left). Under each dial: power, words, picture, sound, link."></canvas>
<canvas id="out" aria-label="The output. Tap to play or pause everything linked."></canvas>
<div id="bar">
  <button class="b" id="help" type="button" aria-label="How to play"></button>
  <div class="seg" id="views" role="group" aria-label="View"></div>
  <span class="sp"></span>
  <div class="poems" id="poems" aria-label="Poems"></div>
  <span class="rt" id="rt" hidden></span>
  <button class="b" id="play" type="button" aria-label="Play or pause everything linked"></button>
  <button class="b" id="add" type="button" aria-label="Add a node"></button>
  <button class="b" id="rec" type="button" aria-label="Record"></button>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== constants ===== */
const BASE=/\/city\/mix\/?/.test(location.pathname)?'../decks/':'';
const FPS=23.976,TB=24,TURN=8,TEETH=40,MAXN=8,HOLD_MS=430,SPAN=80*Math.PI/180,HUB=.34,JOG=.64;
const KCOL={reading:'#7fd8ff',world:'#9ff0c4',sounds:'#ffb35c',layers:'#d6a8ff'},CHC={pic:'#7fd8ff',snd:'#ffb35c',txt:'#d8c9ff'};
const BLENDS=['source-over','screen','multiply','difference','lighter'],MODES=['split','rack','focus','out'],SLOTS=['pw','txt','pic','snd','ln'];
const STORE='mixdiscs.rack.v5';
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcf=f=>{f=Math.max(0,Math.round(f));return[Math.floor(f/(3600*TB)),Math.floor(f/(60*TB))%60,Math.floor(f/TB)%60,f%TB].map(x=>String(x).padStart(2,'0')).join(':')};
const tc=t=>tcf(t*FPS),fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const wrapA=a=>a>Math.PI?a-2*Math.PI:a<-Math.PI?a+2*Math.PI:a;
const DPR=Math.min(2,devicePixelRatio||1);
/* haptics: teeth tick, lines and detents thunk; throttled so a fast turn stays a texture */
let TOUCHED=false,lastBuzz=0;

const ICON={pic:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',snd:'<path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/>',txt:'<path d="M5 7h14M5 12h14M5 17h9"/>',
  reading:'<circle cx="12" cy="8" r="3"/><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6"/>',world:'<path d="M3 18l6-8 4 5 3-3 5 6z"/><circle cx="17" cy="7" r="2"/>',sounds:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',save:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14"/>',
  blend:'<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',tint:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/>',tone:'<path d="M3 14c3 0 3-6 6-6s3 8 6 8 3-4 6-4"/>',lvl:'<path d="M5 19v-4M10 19v-8M15 19v-11M20 19V5"/>',
  pw:'<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',ln:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  play:'<path d="M7 5l12 7-12 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',plus:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/>',
  split:'<rect x="2" y="6" width="11" height="12" rx="1.5"/><circle cx="18" cy="8.5" r="2.6"/><circle cx="18" cy="15.5" r="2.6"/>',
  rack:'<rect x="2" y="9" width="6" height="6" rx="1"/><circle cx="13" cy="8" r="2.6"/><circle cx="19.5" cy="8" r="2.6"/><circle cx="13" cy="16" r="2.6"/><circle cx="19.5" cy="16" r="2.6"/>',
  focus:'<rect x="2" y="6" width="9" height="8" rx="1.5"/><circle cx="17" cy="10" r="5"/><circle cx="4" cy="20" r="1.3"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="15" cy="20" r="1.3"/>',
  out:'<rect x="2" y="4" width="20" height="12" rx="1.5"/><circle cx="6" cy="20" r="1.4"/><circle cx="12" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>'};
const svg=(k,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
function toast(m,act,fn){const e=$('toast');e.innerHTML=`<span>${esc(m)}</span>`+(act?`<button type="button">${act}</button>`:'');e.hidden=false;if(act)e.querySelector('button').onclick=()=>{fn();e.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,act?5000:2400)}
/* ===== sources ===== */
const SRC=[],SK={};let SRCNAME='';
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const wav=w=>w?{rate:w.rate,lo:dec(w.lo),mid:dec(w.mid),hi:dec(w.hi)}:null;
function lastBefore(list,t,k){let r=null;for(let i=0;i<list.length;i++){if(list[i][k]<=t)r=list[i];else break}return r}
function lineWords(p,t){if(t<p.speech[0]-.3||t>p.speech[1]+.6)return null;let L=p.lines[0];for(const l of p.lines){if(l.s<=t)L=l;else break}const ws=p.words.filter(w=>w[0]>=L.s-.3&&w[0]<L.e);return ws.length?ws.map(w=>({w:w[2],on:w[0]<=t})):[{w:L.text,on:true}]}
function addSrc(s){SRC.push(s);SK[s.key]=s}
function build(su,dk,ly){SRCNAME=su.source.name;const P=n=>su.poems.find(p=>p.num===n);
  su.poems.forEach(p=>addSrc({key:'R'+p.num,kind:'reading',num:p.num,title:p.title,thumb:'thumbs/'+p.num+'.jpg',dur:p.clip.dur,files:[p.clip.file],video:true,pic:1,snd:1,txt:1,base:p.clip.src_in,reel:'WYGWYL',start:Math.max(0,p.speech[0]-.4),marks:p.lines.map(l=>l.s),wave:wav(p.wave),words:t=>lineWords(p,t),speech:p.speech}));
  dk.world.forEach(w=>{const p=w.poem&&P(w.poem);addSrc({key:'W'+w.key,kind:'world',num:w.poem,title:w.title,thumb:w.thumb,dur:w.dur,files:[w.file],video:true,pic:1,snd:1,txt:0,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),start:0,marks:[0,...w.cuts],wave:wav(w.wave),speech:p?p.speech:null})});
  dk.sounds.forEach(s=>{const p=P(s.num);addSrc({key:'S'+s.num,kind:'sounds',num:s.num,title:'Line sounds · '+p.title,dur:s.dur,files:[s.file],video:false,pic:0,snd:1,txt:1,base:0,reel:'FS'+s.num,start:Math.max(0,p.speech[0]-.4),marks:s.cues.map(c=>c.t),wave:wav(s.wave),speech:p.speech,words:t=>{const c=lastBefore(s.cues,t,'t');return c&&t-c.t<6?[{w:'♪ '+c.title,on:true}]:null}})});
  ly.poems.forEach(x=>{const p=P(x.num);addSrc({key:'X'+x.num,kind:'layers',num:x.num,title:'Rooms · '+p.title,dur:x.dur,files:x.stems.map(s=>s.file),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,start:Math.max(0,p.speech[0]-.4),marks:x.lines.map(l=>l.t),wave:wav(x.wave),speech:p.speech,words:t=>{const L=lastBefore(x.lines,t,'t');return L?[{w:L.beat,on:true}]:null}})})}
/* one poem clock: readings, line sounds and rooms share the clip's timeline; a world reel is stretched over the spoken span */
function toClock(s,t){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return a+t/s.dur*(b-a)}return t}
function fromClock(s,c){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return(c-a)/(b-a)*s.dur}return c}
function stretchOf(s){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return s.dur/(b-a)}return 1}
/* ===== audio: node → tone filter → gain → master ===== */
let AC=null,master=null,mDest=null,noise=null;
function ensureAC(){if(AC){AC.resume().catch(()=>{});return}AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createDynamicsCompressor();master.connect(AC.destination);try{mDest=AC.createMediaStreamDestination();master.connect(mDest)}catch(e){mDest=null}
  noise=AC.createBuffer(1,AC.sampleRate>>3,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NODES.forEach(wire)}
function click(v,f,q){if(!AC||v<=0)return;const s=AC.createBufferSource(),b=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;b.type='bandpass';b.frequency.value=f||1800;b.Q.value=q||5;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.035);s.connect(b);b.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+.045)}
function wire(k){if(!AC||k.g)return;k.flt=AC.createBiquadFilter();k.flt.type='lowpass';k.flt.frequency.value=22000;k.g=AC.createGain();k.g.gain.value=0;k.flt.connect(k.g);k.g.connect(master);
  for(const e of k.els){let n=e._n;if(!n){try{n=e._n=AC.createMediaElementSource(e)}catch(x){continue}}try{n.disconnect()}catch(x){}n.connect(k.flt)}applyTone(k)}
function applyTone(k){if(!k.flt)return;const v=k.tone;if(Math.abs(v)<.04){k.flt.type='lowpass';k.flt.frequency.value=22000;k.flt.Q.value=.7}else if(v<0){k.flt.type='lowpass';k.flt.frequency.value=22000*Math.pow(180/22000,-v);k.flt.Q.value=1.6}else{k.flt.type='highpass';k.flt.frequency.value=20*Math.pow(6000/20,v);k.flt.Q.value=1.6}}
/* ===== nodes ===== */
const NODES=[];let uid=1,ANC=null,FOCUS=null,MODE='split',POEM=null;
const hueOf=c=>c<.03?null:c*360;
function makeNode(key,o){const s=SK[key];if(!s||NODES.length>=MAXN)return null;
  const els=s.files.map((f,i)=>{const e=s.video&&i===0?document.createElement('video'):new Audio();e.preload='auto';e.playsInline=true;e.muted=false;e.src=BASE+f;e.preservesPitch=true;return e});
  const k=Object.assign({id:uid++,s,els,g:null,flt:null,on:true,link:true,route:{pic:!!s.pic,snd:!!s.snd,txt:s.kind==='reading'},level:.75,tone:0,col:0,blend:0,loop:null,hold:null,mom:0,err:false,lastTap:0,colTap:{}},o||{});
  k.route=Object.assign({pic:!!s.pic,snd:!!s.snd,txt:s.kind==='reading'},o&&o.route||{});k.hue=hueOf(k.col);k.blv=k.blend;

const tD=k=>k.els[0].currentTime||0,playing=k=>!k.els[0].paused;
function seekD(k,t){t=clamp(t,0,k.s.dur-.05);for(const e of k.els){try{e.currentTime=t}catch(x){}}}
function playD(k,on){if(on){ensureAC();wire(k);if(tD(k)>=k.s.dur-.1)seekD(k,0);for(const e of k.els)e.play().catch(()=>{})}else for(const e of k.els)e.pause()}
function rateD(k,r){for(const e of k.els)e.playbackRate=clamp(r,.25,4)}
/* ===== link: every node that is on and linked turns with the anchor (the last one touched) on the poem clock ===== */
const grp=()=>NODES.filter(k=>k.on&&k.link),inGrp=k=>k.on&&k.link;
function anc(){const g=grp();return g.includes(ANC)?ANC:(g.find(k=>k.s.kind==='reading')||g[0]||null)}
const tgtAt=(k,a,at)=>fromClock(k.s,toClock(a.s,at));
function follow(){const A=anc();if(!A)return;for(const k of grp()){if(k===A||k.hold)continue;const t=tgtAt(k,A,tD(A)),inR=t>=0&&t<k.s.dur-.05,want=playing(A)&&!A.hold&&inR;
    if(want&&!playing(k)){seekD(k,t);playD(k,true)}else if(!want&&playing(k))playD(k,false);
    rateD(k,A.els[0].playbackRate*stretchOf(k.s)/stretchOf(A.s));if(inR&&Math.abs(tD(k)-t)>(playing(k)?.3:.04))seekD(k,t)}}
function setPower(k,on){k.on=on;if(!on){playD(k,false);k.mom=0}buzz(on?[12,24,12]:14,true);click(on?.4:.25,on?900:500,3);save()}
function togglePlay(){const A=anc()||FOCUS||NODES[0];if(!A)return;if(!A.on)A.on=true;playD(A,!playing(A));buzz(12,true);click(.3,700,3)}
/* ===== layout: computed rectangles, never stacked =====
   output: a 16:9 rectangle of its own. side: everything else, holding a grid of dials (split, rack), a big dial plus a strip (focus), or a strip only (out). */
let W=0,H=0,L={O:{x:0,y:0,w:1,h:1},side:{x:0,y:0,w:1,h:1},items:[],bad:[]};
function gridItems(R,list){const n=list.length,items=[];if(!n)return items;let best=null;
  for(let c=1;c<=n;c++){const rows=Math.ceil(n/c),cw=R.w/c,ch=R.h/rows,bh=clamp(Math.min(cw,ch)*.2,30,42),d=Math.min(cw-12,ch-bh-14,280);if(!best||d>best.d)best={c,rows,cw,ch,bh,d}}
  const{c,rows,cw,ch,bh}=best,d=Math.max(24,best.d),lastN=n-(rows-1)*c;
  list.forEach((k,i)=>{const row=Math.floor(i/c),col=i%c,off=row===rows-1?(c-lastN)*cw/2:0,cx=R.x+off+col*cw+cw/2,top=R.y+row*ch+(ch-(d+6+bh))/2,rw=Math.min(cw-8,Math.max(d,5*34));
    items.push({k,type:'full',x:cx,y:top+d/2,r:d/2,row:{x:cx-rw/2,y:top+d+6,w:rw,h:bh}})});return items}
function stripItems(R,list){const n=list.length,items=[];if(!n)return items;const sw=R.w/n,m=Math.max(10,Math.min((R.h-6)/2,(sw-8)/2,34));
  list.forEach((k,i)=>items.push({k,type:'mini',x:R.x+sw*(i+.5),y:R.y+R.h/2,r:m,cell:{x:R.x+sw*i,y:R.y,w:sw,h:R.h}}));return items}

/* ===== the jam ===== */
function applyLevels(){for(const k of NODES){if(!k.on&&playing(k))playD(k,false);if(k.g&&AC)k.g.gain.setTargetAtTime(k.on&&k.route.snd&&k.s.snd?Math.sin(k.level*Math.PI/2):0,AC.currentTime,.04)}}

const REC={on:false,mr:null,parts:[],t0:0,log:[],last:0};
function recToggle(){if(REC.on){if(REC.mr&&REC.mr.state==='recording')REC.mr.stop();return}if(!window.MediaRecorder||!out.captureStream)return toast('Recording is not available in this browser');ensureAC();
  const st=out.captureStream(30);if(mDest)mDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));const type=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';

function recSample(now){if(!REC.on||now-REC.last<250)return;REC.last=now;if(REC.log.length>14400)return recToggle();REC.log.push({t:(now-REC.t0)/1000,d:NODES.map(k=>({key:k.s.key,t:tD(k),lv:k.level,on:k.on&&playing(k),r:{...k.route},blend:k.blend,hue:k.hue,tone:k.tone}))})}
function edl(){const ev=[],open={};const close=(id,end)=>{const e=open[id];if(e){e.recOut=end;if(e.recOut-e.recIn>=.2)ev.push(e);delete open[id]}};

      if(live&&e&&Math.abs(d.t-e.lastT-(s.t-e.lastS))>.4)close(id,s.t);if(live&&!open[id])open[id]={src,ch,deck:j,srcIn:d.t,recIn:s.t,lv:[],fx:d};if(live){open[id].srcOut=d.t;open[id].lastT=d.t;open[id].lastS=s.t;open[id].lv.push(d.lv)}else close(id,s.t)})});
    Object.keys(open).forEach(id=>{if(!seen.has(id))close(id,s.t)})});const end=REC.log.length?REC.log[REC.log.length-1].t:0;Object.keys(open).forEach(id=>close(id,end));

    o+=`${String(i+1).padStart(3,'0')}  ${e.src.reel.padEnd(8)} ${e.ch==='pic'?'V    ':'A    '} C        ${tc(e.src.base+e.srcIn)} ${tc(e.src.base+(e.srcOut||e.srcIn))} ${tcf(86400+e.recIn*FPS)} ${tcf(86400+e.recOut*FPS)}\n* FROM CLIP NAME: ${e.src.kind==='reading'?SRCNAME:e.src.files.map(x=>x.split('/').pop()).join(' + ')}\n* NODE ${e.deck+1} · ${e.src.title} · LEVEL ~${lv}%${e.ch==='pic'?` · BLEND ${BLENDS[f.blend]}${f.hue!=null?' · TINT '+Math.round(f.hue)+'°':''}`:(Math.abs(f.tone)>.04?' · TONE '+(f.tone<0?'LP ':'HP ')+Math.round(Math.abs(f.tone)*100):'')}\n\n`});return o}
async function save2(name,data){let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}

/* ===== sheets open over the node side, never over the output (full screen only when the side is a thin strip) ===== */
