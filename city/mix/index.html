<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the output fills the screen; discs float on it as gears; tapping empty space tucks them away. Single dark look by choice. */
:root{--ink:#eef3ff;--dim:rgba(220,230,255,.6);--ring:rgba(200,225,255,.45);--rec:#ff5a6e;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#020418;color:var(--ink);font:500 13px/1.4 ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#out{z-index:0}#rig{z-index:1}
.ic{position:fixed;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--ring);background:rgba(4,10,60,.45);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}
.ic svg{width:20px;height:20px}
.ic:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ic.on{background:var(--rec);border-color:var(--rec)}
#add{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 56px)}
#rec{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px))}
#help{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));width:36px;height:36px}
body.clear .ic:not(#rec),body.clear .poems{opacity:0;pointer-events:none}
.poems{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;transition:opacity .3s}
.poems button{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,225,255,.35);background:rgba(4,10,60,.4);color:var(--dim);font:500 9px ui-monospace,monospace;padding:0;cursor:pointer}
.poems button.on{background:#fff;color:#06106a;border-color:#fff}
.rt{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);font:600 12px ui-monospace,monospace;color:var(--rec);text-shadow:0 0 6px #000;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(2,5,40,.94);display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sh{display:flex;gap:10px;align-items:center}.sh .ic{position:static}
.sb{overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.grid button{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(200,225,255,.3);background:#0a1690 center/cover no-repeat;position:relative;cursor:pointer;padding:0;color:#fff}
.grid button span{position:absolute;inset:auto 0 6px;font:600 10px ui-monospace,monospace;text-shadow:0 0 4px #000,0 0 2px #000}
.grid button i{position:absolute;top:7px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.grid button i b{width:6px;height:6px;border-radius:50%}
.grid button.cur{border-color:#fff;box-shadow:0 0 0 2px #fff}
.tabsk{display:flex;gap:6px}
.tabsk button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ring);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tabsk button.on{background:#fff;color:#06106a}.tabsk svg{width:18px;height:18px}
.take video{max-width:100%;max-height:62vh;border-radius:12px;display:block;margin:0 auto}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}.row .ic{position:static}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1000px}
.howto div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;font:400 14px/1.45 system-ui,sans-serif}
.howto svg{width:52px;height:52px}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);background:rgba(8,16,90,.92);border:1px solid var(--ring);border-radius:22px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font:500 12px system-ui,sans-serif}
.toast button{border:1px solid var(--ring);background:transparent;color:var(--ink);border-radius:16px;min-height:28px;padding:0 10px;font:600 10px ui-monospace,monospace;cursor:pointer}
</style>

<canvas id="out" aria-label="The output"></canvas>
<canvas id="rig" aria-label="Discs. Tap a centre to play. Turn a ring to move in time. Pinch a disc to make it stronger or weaker. Drag a centre to move it. Push two discs together to link them. Hold a centre for colour, blend and tone. Tap empty space to clear the view."></canvas>
<button class="ic" id="help" type="button" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg></button>
<button class="ic" id="add" type="button" aria-label="Add a disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg></button>
<button class="ic" id="rec" type="button" aria-label="Record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg></button>
<div class="rt" id="rt" hidden></div>
<div class="poems" id="poems" aria-label="Poems"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== constants ===== */
const BASE=/\/city\/mix\/?/.test(location.pathname)?'../decks/':'';
const FPS=23.976,TB=24,TURN=8,TEETH=40,MAXD=4,SNAP=22,SMIN=.35,SMAX=1.6,HOLD_MS=430;
const KCOL={reading:'#7fd8ff',world:'#9ff0c4',sounds:'#ffb35c',layers:'#d6a8ff'},CHC={pic:'#7fd8ff',snd:'#ffb35c',txt:'#d8c9ff'};
const BLENDS=['source-over','screen','multiply','difference','lighter'];
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcf=f=>{f=Math.max(0,Math.round(f));return[Math.floor(f/(3600*TB)),Math.floor(f/(60*TB))%60,Math.floor(f/TB)%60,f%TB].map(x=>String(x).padStart(2,'0')).join(':')};
const tc=t=>tcf(t*FPS),fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const DPR=Math.min(2,devicePixelRatio||1);
/* haptics: short taps for teeth, longer for lines and meshes; throttled so a fast spin stays a texture, not a buzz */
let TOUCHED=false,lastBuzz=0;
function buzz(p,force){if(!TOUCHED)return;const now=performance.now();if(!force&&now-lastBuzz<28)return;lastBuzz=now;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const ICON={pic:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',snd:'<path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/>',txt:'<path d="M5 7h14M5 12h14M5 17h9"/>',
  reading:'<circle cx="12" cy="8" r="3"/><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6"/>',world:'<path d="M3 18l6-8 4 5 3-3 5 6z"/><circle cx="17" cy="7" r="2"/>',sounds:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',save:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14"/>',
  blend:'<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',tint:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/>',tone:'<path d="M3 14c3 0 3-6 6-6s3 8 6 8 3-4 6-4"/>',swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>'};
const svg=(k,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
function toast(m,act,fn){const e=$('toast');e.innerHTML=`<span>${esc(m)}</span>`+(act?`<button type="button">${act}</button>`:'');e.hidden=false;if(act)e.querySelector('button').onclick=()=>{fn();e.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,act?5000:2400)}
/* ===== sources ===== */
const SRC=[],SK={};let SRCNAME='';
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const wav=w=>w?{rate:w.rate,lo:dec(w.lo),mid:dec(w.mid),hi:dec(w.hi)}:null;
function lastBefore(list,t,k){let r=null;for(let i=0;i<list.length;i++){if(list[i][k]<=t)r=list[i];else break}return r}
function lineWords(p,t){if(t<p.speech[0]-.3||t>p.speech[1]+.6)return null;let L=p.lines[0];for(const l of p.lines){if(l.s<=t)L=l;else break}const ws=p.words.filter(w=>w[0]>=L.s-.3&&w[0]<L.e);return ws.length?ws.map(w=>({w:w[2],on:w[0]<=t})):[{w:L.text,on:true}]}
function addSrc(s){SRC.push(s);SK[s.key]=s}
function build(su,dk,ly){SRCNAME=su.source.name;const P=n=>su.poems.find(p=>p.num===n);
  su.poems.forEach(p=>addSrc({key:'R'+p.num,kind:'reading',num:p.num,title:p.title,thumb:'thumbs/'+p.num+'.jpg',dur:p.clip.dur,files:[p.clip.file],video:true,pic:1,snd:1,txt:1,base:p.clip.src_in,reel:'WYGWYL',start:Math.max(0,p.speech[0]-.4),marks:p.lines.map(l=>l.s),wave:wav(p.wave),words:t=>lineWords(p,t),speech:p.speech}));
  dk.world.forEach(w=>{const p=w.poem&&P(w.poem);addSrc({key:'W'+w.key,kind:'world',num:w.poem,title:w.title,thumb:w.thumb,dur:w.dur,files:[w.file],video:true,pic:1,snd:1,txt:0,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),start:0,marks:[0,...w.cuts],wave:wav(w.wave),speech:p?p.speech:null})});
  dk.sounds.forEach(s=>{const p=P(s.num);addSrc({key:'S'+s.num,kind:'sounds',num:s.num,title:'Line sounds · '+p.title,dur:s.dur,files:[s.file],video:false,pic:0,snd:1,txt:1,base:0,reel:'FS'+s.num,start:Math.max(0,p.speech[0]-.4),marks:s.cues.map(c=>c.t),wave:wav(s.wave),speech:p.speech,words:t=>{const c=lastBefore(s.cues,t,'t');return c&&t-c.t<6?[{w:'♪ '+c.title,on:true}]:null}})});
  ly.poems.forEach(x=>{const p=P(x.num);addSrc({key:'X'+x.num,kind:'layers',num:x.num,title:'Rooms · '+p.title,dur:x.dur,files:x.stems.map(s=>s.file),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,start:Math.max(0,p.speech[0]-.4),marks:x.lines.map(l=>l.t),wave:wav(x.wave),speech:p.speech,words:t=>{const L=lastBefore(x.lines,t,'t');return L?[{w:L.beat,on:true}]:null}})})}
function toClock(s,t){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return a+t/s.dur*(b-a)}return t}
function fromClock(s,c){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return(c-a)/(b-a)*s.dur}return c}
function stretchOf(s){if(s.kind==='world'&&s.speech){const[a,b]=s.speech;return s.dur/(b-a)}return 1}
/* ===== audio: each disc → tone filter → gain → master ===== */
let AC=null,master=null,mDest=null,noise=null;
function ensureAC(){if(AC){AC.resume().catch(()=>{});return}AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createDynamicsCompressor();master.connect(AC.destination);try{mDest=AC.createMediaStreamDestination();master.connect(mDest)}catch(e){mDest=null}
  noise=AC.createBuffer(1,AC.sampleRate>>3,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;DISCS.forEach(wire)}
function click(v,f,q){if(!AC||v<=0)return;const s=AC.createBufferSource(),b=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;b.type='bandpass';b.frequency.value=f||1800;b.Q.value=q||5;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.035);s.connect(b);b.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+.045)}
function wire(k){if(!AC||k.g)return;k.flt=AC.createBiquadFilter();k.flt.type='lowpass';k.flt.frequency.value=22000;k.g=AC.createGain();k.g.gain.value=0;k.flt.connect(k.g);k.g.connect(master);
  for(const e of k.els){let n=e._n;if(!n){try{n=e._n=AC.createMediaElementSource(e)}catch(x){continue}}try{n.disconnect()}catch(x){}n.connect(k.flt)}applyTone(k)}
function applyTone(k){if(!k.flt)return;const v=k.tone;if(Math.abs(v)<.04){k.flt.type='lowpass';k.flt.frequency.value=22000;k.flt.Q.value=.7}else if(v<0){k.flt.type='lowpass';k.flt.frequency.value=22000*Math.pow(180/22000,-v);k.flt.Q.value=1.6}else{k.flt.type='highpass';k.flt.frequency.value=20*Math.pow(6000/20,v);k.flt.Q.value=1.6}}
/* ===== discs ===== */
const DISCS=[];let uid=1;
function makeDisc(key,x,y,o){const s=SK[key];if(!s||DISCS.length>=MAXD)return null;
  const els=s.files.map((f,i)=>{const e=s.video&&i===0?document.createElement('video'):new Audio();e.preload='auto';e.playsInline=true;e.src=BASE+f;e.preservesPitch=true;return e});
  const k=Object.assign({id:uid++,s,els,g:null,flt:null,x,y,scale:1,route:{pic:!!s.pic,snd:!!s.snd,txt:s.kind==='reading'},dir:1,phase:0,loop:null,level:0,blend:0,hue:null,tone:0,knob:null,knobT:0,hold:null,mom:0,err:false,c0:0,ac0:0},o||{});
  els[0].onerror=()=>{k.err=true};els[0].addEventListener('loadedmetadata',()=>seekD(k,s.start),{once:true});wire(k);DISCS.push(k);return k}
function removeDisc(k){for(const e of k.els){e.pause();e.removeAttribute('src');e.load()}if(k.g)try{k.g.disconnect()}catch(e){}DISCS.splice(DISCS.indexOf(k),1)}
const tD=k=>k.els[0].currentTime||0,playing=k=>!k.els[0].paused;
function seekD(k,t){t=clamp(t,0,k.s.dur-.05);for(const e of k.els){try{e.currentTime=t}catch(x){}}}
function playD(k,on){if(on){ensureAC();wire(k);if(tD(k)>=k.s.dur-.1)seekD(k,0);for(const e of k.els)e.play().catch(()=>{})}else for(const e of k.els)e.pause()}
function rateD(k,r){for(const e of k.els)e.playbackRate=clamp(r,.25,4)}
/* geometry. Size is level: a big disc is strong in picture and sound, a small one faint. */
let W=0,H=0,CLEAR=false;
const baseR=()=>clamp(Math.min(W,H)*(DISCS.length>2?.17:.2),46,170);
const rOf=k=>baseR()*k.scale*(CLEAR?.32:1);
const pos=k=>CLEAR?dockPos(k):{x:k.x*W,y:k.y*H};
function dockPos(k){const i=DISCS.indexOf(k),r=baseR()*.32*1.15;return{x:W-24-r-(DISCS.length-1-i)*(r*2+10),y:H-24-r}}
const levelOf=k=>clamp((k.scale-SMIN)/(1.25-SMIN),0,1);
/* ===== meshing ===== */
let MESH=new Set(),GROUP=new Map(),ANCHOR=new Map();
const pairKey=(a,b)=>a.id<b.id?a.id+'-'+b.id:b.id+'-'+a.id,byId=id=>DISCS.find(k=>k.id===id);
function computeMesh(){if(CLEAR)return;const next=new Set();for(let i=0;i<DISCS.length;i++)for(let j=i+1;j<DISCS.length;j++){const a=DISCS[i],b=DISCS[j],pa=pos(a),pb=pos(b),d=Math.hypot(pa.x-pb.x,pa.y-pb.y),was=MESH.has(pairKey(a,b));
    if(d<rOf(a)+rOf(b)+(was?SNAP*1.7:SNAP))next.add(pairKey(a,b))}
  for(const p of next)if(!MESH.has(p))onMesh(p,true);for(const p of MESH)if(!next.has(p))onMesh(p,false);MESH=next;groups()}
function groups(){GROUP=new Map();let gid=0;for(const k of DISCS){if(GROUP.has(k.id))continue;gid++;const stack=[k];GROUP.set(k.id,gid);k.dir=1;let guard=0;
    while(stack.length&&guard++<MAXD*4){const c=stack.pop();for(const o of DISCS){if(GROUP.has(o.id)||!MESH.has(pairKey(c,o)))continue;GROUP.set(o.id,gid);o.dir=-c.dir;stack.push(o)}}}}
const groupOf=k=>DISCS.filter(o=>GROUP.get(o.id)===GROUP.get(k.id));
function onMesh(p,on){const[a,b]=p.split('-').map(Number).map(byId);if(!a||!b)return;buzz(on?[22,40,22]:14,true);click(on?.6:.3,on?520:2600,on?2:6);
  const pa=pos(a),pb=pos(b),f=rOf(a)/(rOf(a)+rOf(b));FLASH.push({x:pa.x+(pb.x-pa.x)*f,y:pa.y+(pb.y-pa.y)*f,t:performance.now(),on});if(FLASH.length>8)FLASH.shift();if(on){groups();anchor(a)}}
/* gear law: angular speed ∝ 1/radius, and one turn is always TURN seconds, so a smaller follower runs faster */
function anchor(k){const g=groupOf(k);for(const o of g){o.c0=toClock(o.s,tD(o));o.ac0=toClock(k.s,tD(k))}ANCHOR.set(GROUP.get(k.id),k)}
const ratio=(a,k)=>clamp(rOf(a)/rOf(k),.5,2);
function targetOf(k,a,at){return fromClock(k.s,k.c0+(toClock(a.s,at)-k.ac0)*ratio(a,k))}
function follow(){for(const k of DISCS){const a=ANCHOR.get(GROUP.get(k.id));if(!a||a===k||!DISCS.includes(a)||k.hold)continue;
    const tgt=targetOf(k,a,tD(a)),inR=tgt>=0&&tgt<k.s.dur-.05,want=playing(a)&&!a.hold&&inR;
    if(want&&!playing(k)){seekD(k,tgt);playD(k,true)}else if(!want&&playing(k))playD(k,false);
    rateD(k,a.els[0].playbackRate*ratio(a,k)*stretchOf(k.s)/stretchOf(a.s));if(inR&&Math.abs(tD(k)-tgt)>(playing(k)?.3:.04))seekD(k,tgt)}}
/* ===== touch =====
   hub: tap = play, double tap = loop the line, drag = move, hold = petals.
   ring: turn = time (forward is heard at hand speed; a flick keeps spinning). In a dial (colour / tone) the ring sets that instead.
   two fingers on a disc: pinch = size = level.   empty space: tap = clear the view. */
const PTR=new Map();let MENU=null;
function cap(id){try{rig.setPointerCapture(id)}catch(e){}}
function hit(x,y){if(MENU){const p=petalAt(x,y);if(p)return{zone:'petal',p}}
  for(let i=DISCS.length-1;i>=0;i--){const k=DISCS[i],p=pos(k),r=rOf(k),d=Math.hypot(x-p.x,y-p.y);if(d<=r*1.1)return{k,zone:CLEAR?'dock':d<r*.42?'hub':'ring'}}
  if(!CLEAR)for(const k of DISCS){const c=chanAt(k,x,y);if(c)return{k,zone:'chan',ch:c}}return null}
function chanSpots(k){if(CLEAR)return[];const r=rOf(k),p=pos(k),out=[];['txt','pic','snd'].forEach((c,i)=>{if(!k.s[c])return;const a=-Math.PI/2+(i-1)*.4/Math.max(.6,k.scale);out.push({c,x:p.x+Math.cos(a)*(r+18),y:p.y+Math.sin(a)*(r+18)})});return out}
function chanAt(k,x,y){for(const s of chanSpots(k))if(Math.hypot(x-s.x,y-s.y)<16)return s.c;return null}
function down(e){TOUCHED=true;const x=e.clientX,y=e.clientY,h=hit(x,y);ensureAC();
  if(!h){if(MENU){closeMenu();return}PTR.set(e.pointerId,{zone:'void',x0:x,y0:y,t0:performance.now()});return}
  e.preventDefault();cap(e.pointerId);
  if(h.zone==='petal'){PTR.set(e.pointerId,{zone:'petal',p:h.p});return}
  if(h.zone==='chan'){h.k.route[h.ch]=!h.k.route[h.ch];buzz(10,true);click(.25,3200);save();return}

function drawMenu(g,now){const k=MENU.k,n=MENU.items.length,grow=clamp((now-MENU.t)/140,0,1);MENU.items.forEach((it,i)=>{const q=petalPos(i,n,k),p=pos(k),x=p.x+(q.x-p.x)*grow,y=p.y+(q.y-p.y)*grow,hov=MENU.hover===it;
    g.fillStyle=hov?'#fff':'rgba(8,16,90,.92)';g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1;g.beginPath();g.arc(x,y,hov?25:22,0,7);g.fill();g.stroke();
    let col=hov?'#06106a':'#fff';if(it.id==='tint'&&k.hue!=null&&!hov)col=`hsl(${k.hue},90%,70%)`;drawIcon(g,it.ic,x,y,22,col);
    if(it.id==='blend'){g.fillStyle=hov?'#06106a':'#ffd166';for(let d=0;d<BLENDS.length;d++){g.globalAlpha=d===k.blend?1:.3;g.beginPath();g.arc(x-8+d*4,y+16,1.6,0,7);g.fill()}g.globalAlpha=1}})}
/* ===== the jam ===== */
function applyLevels(){for(const k of DISCS){k.level=levelOf(k);if(k.g&&AC)k.g.gain.setTargetAtTime(k.route.snd&&k.s.snd?Math.sin(k.level*Math.PI/2):0,AC.currentTime,.04)}}
function loops(){for(const k of DISCS)if(k.loop&&playing(k)&&!k.hold&&tD(k)>=k.loop.b)seekD(k,k.loop.a)}
function syncStems(){for(const k of DISCS){if(k.els.length<2)continue;const t=tD(k),p=!playing(k);for(let i=1;i<k.els.length;i++){const e=k.els[i];if(Math.abs(e.currentTime-t)>.08)e.currentTime=t;e.playbackRate=k.els[0].playbackRate;if(e.paused!==p)p?e.pause():e.play().catch(()=>{})}}}
function knobTimeout(now){for(const k of DISCS)if(k.knob&&now-k.knobT>3500&&!(k.hold))k.knob=null}
function setClear(on){CLEAR=on;document.body.classList.toggle('clear',on);closeMenu();buzz(14,true);if(!on)computeMesh()}
const REC={on:false,mr:null,parts:[],t0:0,log:[],last:0};
function recToggle(){if(REC.on){if(REC.mr&&REC.mr.state==='recording')REC.mr.stop();return}if(!window.MediaRecorder||!out.captureStream)return toast('Recording is not available in this browser');ensureAC();
  const st=out.captureStream(30);if(mDest)mDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));const type=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let mr;try{mr=new MediaRecorder(st,type?{mimeType:type,videoBitsPerSecond:5e6}:{})}catch(e){return toast('Recording could not start')}
  REC.parts=[];REC.log=[];REC.t0=performance.now();REC.last=0;mr.ondataavailable=e=>{if(e.data.size&&REC.parts.length<6000)REC.parts.push(e.data)};mr.onstop=takeDone;mr.start(500);REC.mr=mr;REC.on=true;$('rec').classList.add('on');buzz(20,true)}
function recSample(now){if(!REC.on||now-REC.last<250)return;REC.last=now;if(REC.log.length>14400)return recToggle();REC.log.push({t:(now-REC.t0)/1000,d:DISCS.map(k=>({key:k.s.key,t:tD(k),lv:k.level,on:playing(k),r:{...k.route},blend:k.blend,hue:k.hue,tone:k.tone}))})}
function edl(){const ev=[],open={};const close=(id,end)=>{const e=open[id];if(e){e.recOut=end;if(e.recOut-e.recIn>=.2)ev.push(e);delete open[id]}};
  REC.log.forEach(s=>{const seen=new Set();s.d.forEach((d,j)=>{const src=SK[d.key];['pic','snd'].forEach(ch=>{if(!src[ch])return;const live=d.on&&d.r[ch]&&d.lv>.1,id=j+ch+d.key;seen.add(id);const e=open[id];
      if(live&&e&&Math.abs(d.t-e.lastT-(s.t-e.lastS))>.4)close(id,s.t);if(live&&!open[id])open[id]={src,ch,deck:j,srcIn:d.t,recIn:s.t,lv:[],fx:d};if(live){open[id].srcOut=d.t;open[id].lastT=d.t;open[id].lastS=s.t;open[id].lv.push(d.lv)}else close(id,s.t)})});
    Object.keys(open).forEach(id=>{if(!seen.has(id))close(id,s.t)})});const end=REC.log.length?REC.log[REC.log.length-1].t:0;Object.keys(open).forEach(id=>close(id,end));
  ev.sort((a,b)=>a.recIn-b.recIn);let o='TITLE: WYGWYL JAM\nFCM: NON-DROP FRAME\n\n';ev.forEach((e,i)=>{const lv=Math.round(e.lv.reduce((a,b)=>a+b,0)/e.lv.length*100),f=e.fx;
    o+=`${String(i+1).padStart(3,'0')}  ${e.src.reel.padEnd(8)} ${e.ch==='pic'?'V    ':'A    '} C        ${tc(e.src.base+e.srcIn)} ${tc(e.src.base+(e.srcOut||e.srcIn))} ${tcf(86400+e.recIn*FPS)} ${tcf(86400+e.recOut*FPS)}\n* FROM CLIP NAME: ${e.src.kind==='reading'?SRCNAME:e.src.files.map(x=>x.split('/').pop()).join(' + ')}\n* DISC ${e.deck+1} · ${e.src.title} · LEVEL ~${lv}%${e.ch==='pic'?` · BLEND ${BLENDS[f.blend]}${f.hue!=null?' · TINT '+Math.round(f.hue)+'°':''}`:(Math.abs(f.tone)>.04?' · TONE '+(f.tone<0?'LP ':'HP ')+Math.round(Math.abs(f.tone)*100):'')}\n\n`});return o}
async function save2(name,data){let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data});toast('Saved')}catch(e){toast(e&&e.code==='declined'?'Not saved':'Saving is not available here')}return}
  const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function takeDone(){REC.on=false;$('rec').classList.remove('on');$('rt').hidden=true;const mr=REC.mr,ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm',b=new Blob(REC.parts,{type:mr.mimeType||'video/webm'}),u=URL.createObjectURL(b),list=edl();
  sheet(`<button class="ic" type="button" onclick="closeSheet()" aria-label="Back">${svg('back',2)}</button><span style="color:var(--dim)">${fmt(REC.log.length?REC.log[REC.log.length-1].t:0)} · ${(b.size/1e6).toFixed(1)} MB</span>`,
    `<div class="take"><video src="${u}" controls playsinline></video><div class="row"><button class="ic" type="button" id="sF" aria-label="Save the film">${svg('film')}</button><button class="ic" type="button" id="sE" aria-label="Save the edit list">${svg('save')}</button><button class="ic" type="button" id="cE" aria-label="Copy the edit list">${svg('copy')}</button></div></div>`);
  $('sF').onclick=()=>save2('wygwyl-jam.'+ext,b);$('sE').onclick=()=>save2('wygwyl-jam-edl.txt',list);$('cE').onclick=()=>navigator.clipboard.writeText(list).then(()=>toast('Copied')).catch(()=>toast('Copying is blocked here'))}
/* ===== sheets ===== */
function sheet(h,b){$('shH').innerHTML=h;$('shB').innerHTML=b;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
let KF='reading';
function picker(k){const kinds=['reading','world','sounds','layers'];
  sheet(`<button class="ic" type="button" onclick="closeSheet()" aria-label="Back">${svg('back',2)}</button><div class="tabsk">${kinds.map(x=>`<button type="button" data-f="${x}" class="${KF===x?'on':''}" aria-label="${x}">${svg(x)}</button>`).join('')}</div>`,
    `<div class="grid">${SRC.filter(s=>s.kind===KF).map(s=>`<button type="button" data-k="${s.key}" class="${k&&k.s===s?'cur':''}" title="${esc(s.title)}" aria-label="${esc(s.title)}" style="${s.thumb?`background-image:url(${BASE+s.thumb})`:`background:radial-gradient(circle at 40% 35%,${KCOL[s.kind]}88,#0a1690 72%)`}"><i>${['pic','snd','txt'].map(c=>`<b style="background:${s[c]?CHC[c]:'rgba(255,255,255,.15)'}"></b>`).join('')}</i><span>${s.num||'·'}</span></button>`).join('')}</div>`);
  $('shH').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{KF=b.dataset.f;picker(k)});
  $('shB').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{closeSheet();if(k&&DISCS.includes(k)){const keep={x:k.x,y:k.y,scale:k.scale,blend:k.blend,hue:k.hue,tone:k.tone},was=playing(k);removeDisc(k);const n=makeDisc(b.dataset.k,keep.x,keep.y,keep);if(n&&was)setTimeout(()=>playD(n,true),300)}else{const sp=freeSpot();makeDisc(b.dataset.k,sp.x,sp.y)}computeMesh();save();poemUI()})}
function freeSpot(){const c=[[.5,.3],[.5,.7],[.22,.5],[.78,.5],[.3,.3],[.7,.7]];for(const s of c){if(DISCS.every(k=>Math.hypot((k.x-s[0])*W,(k.y-s[1])*H)>baseR()*2.4))return{x:s[0],y:s[1]}}return{x:.5,y:.5}}
function helpSheet(){const card=(ic,txt)=>`<div>${ic}<span>${txt}</span></div>`,disc=inner=>`<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="26" cy="26" r="21" stroke="#7fd8ff"/><circle cx="26" cy="26" r="8"/>${inner}</svg>`;
  sheet(`<button class="ic" type="button" onclick="closeSheet()" aria-label="Back">${svg('back',2)}</button>`,`<div class="howto">
  ${card(disc('<path d="M23 22l7 4-7 4z" fill="#fff"/>'),'Tap the centre: play or pause. Tap twice: loop the line.')}
  ${card(disc('<path d="M39 13a20 20 0 0 1 5 13" stroke="#ffd166" stroke-width="3"/>'),'Turn the ring: move through time. Forward, you hear it at the speed of your hand. Flick it and it spins on.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke-width="1.6"><circle cx="26" cy="26" r="11" stroke="#7fd8ff"/><circle cx="26" cy="26" r="21" stroke="#7fd8ff" stroke-dasharray="3 4"/><path d="M14 14l-6-6M38 38l6 6" stroke="#ffd166" stroke-width="2"/></svg>','Pinch a disc: bigger is stronger in picture and sound; smaller fades it out.')}
  ${card(disc('<path d="M26 26l13 13M39 39h-6M39 39v-6" stroke="#ffd166"/>'),'Drag the centre: move the disc anywhere.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke-width="1.6"><circle cx="17" cy="26" r="14" stroke="#7fd8ff"/><circle cx="40" cy="26" r="9" stroke="#ffb35c"/><circle cx="31" cy="26" r="2.5" fill="#fff"/></svg>','Push discs rim to rim: their teeth mesh and they move together. A smaller gear runs faster.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="26" cy="34" r="10"/><circle cx="12" cy="16" r="6"/><circle cx="26" cy="10" r="6"/><circle cx="40" cy="16" r="6"/></svg>','Hold the centre: petals open. Slide to one and let go: blend, colour, tone, swap, remove.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke-width="5"><circle cx="26" cy="26" r="17" stroke="url(#hg)"/><defs><linearGradient id="hg"><stop offset="0" stop-color="#ff5a6e"/><stop offset=".5" stop-color="#5ef0a0"/><stop offset="1" stop-color="#6c8cff"/></linearGradient></defs></svg>','Colour and tone turn the ring into a dial. Turn it; tap the centre when done.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="1.4"><rect x="6" y="10" width="40" height="30" rx="4"/><circle cx="38" cy="34" r="3" fill="#fff"/><circle cx="31" cy="34" r="3" fill="#fff"/></svg>','Tap empty space: the gears tuck into the corner so you see only the picture. Tap again to bring them back.')}
  ${card('<svg viewBox="0 0 52 52" fill="none" stroke-width="1.6"><circle cx="14" cy="26" r="8" fill="#d8c9ff"/><circle cx="26" cy="26" r="8" fill="#7fd8ff"/><circle cx="38" cy="26" r="8" fill="#ffb35c"/></svg>','The dots above a disc: words, picture, sound. Tap to switch each.')}
  ${card('<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="17" fill="none" stroke="#ff5a6e" stroke-width="2"/><circle cx="26" cy="26" r="7" fill="#ff5a6e"/></svg>','Record the jam: the film and an edit list of what you played.')}</div>`)}
/* ===== poems ===== */
function poemDots(){$('poems').innerHTML=SRC.filter(s=>s.kind==='reading').map(s=>`<button type="button" data-n="${s.num}" aria-label="${esc(s.title)}">${s.num}</button>`).join('');$('poems').querySelectorAll('button').forEach(b=>b.onclick=()=>loadPoem(b.dataset.n))}
function loadPoem(n){while(DISCS.length)removeDisc(DISCS[0]);const w=SRC.find(s=>s.kind==='world'&&s.num===n),r=baseR();const a=makeDisc('R'+n,.5,.5),b=makeDisc(w?w.key:'X'+n,.5,.5);
  if(a&&b){a.x=(W/2-r)/W;b.x=(W/2+r)/W;a.y=b.y=.47}computeMesh();if(a&&b)phaseFor(b,a);if(a)anchor(a);poemUI();save()}
function poemUI(){const r=DISCS.find(k=>k.s.kind==='reading');$('poems').querySelectorAll('button').forEach(b=>b.classList.toggle('on',!!r&&b.dataset.n===r.s.num))}
/* ===== persistence ===== */
function save(){try{localStorage.setItem('mixdiscs.jam.v2',JSON.stringify(DISCS.map(k=>({key:k.s.key,x:k.x,y:k.y,scale:k.scale,route:k.route,blend:k.blend,hue:k.hue,tone:k.tone}))))}catch(e){}}
function restore(){let sv=null;try{sv=JSON.parse(localStorage.getItem('mixdiscs.jam.v2')||'null')}catch(e){sv=null}if(!Array.isArray(sv)||!sv.length)return false;
  sv.slice(0,MAXD).forEach(d=>{if(!SK[d.key])return;const k=makeDisc(d.key,clamp(+d.x||.5,.05,.95),clamp(+d.y||.5,.1,.9),{scale:clamp(+d.scale||1,SMIN,SMAX),blend:clamp(d.blend|0,0,BLENDS.length-1),hue:d.hue==null?null:+d.hue%360,tone:clamp(+d.tone||0,-1,1)});if(k&&d.route)Object.assign(k.route,d.route)});return DISCS.length>0}
/* ===== the one loop ===== */
function resize(){W=innerWidth;H=innerHeight;rig.width=Math.round(W*DPR);rig.height=Math.round(H*DPR);const s=Math.min(1,1280/(W*DPR));out.width=Math.round(W*DPR*s);out.height=Math.round(H*DPR*s);computeMesh()}
let lastT=0;
function frame(now){const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;if(!document.hidden){try{momentum(dt);follow();loops();syncStems();applyLevels();knobTimeout(now);drawOut();drawRig(now);recSample(now);if(REC.on){$('rt').hidden=false;$('rt').textContent='● '+fmt((now-REC.t0)/1000)}}catch(e){console.warn(e)}}requestAnimationFrame(frame)}
function selfTest(){const bad=[];if(!SRC.length)bad.push('no sources');const w=SRC.find(s=>s.kind==='world'&&s.speech);if(w&&Math.abs(fromClock(w,toClock(w,10))-10)>1e-6)bad.push('clock');if(levelOf({scale:SMIN})!==0||levelOf({scale:SMAX})!==1)bad.push('level ends');if(bad.length)console.error('self test',bad);return bad}
addEventListener('resize',resize);rig.addEventListener('pointerdown',down);rig.addEventListener('pointermove',move);rig.addEventListener('pointerup',up);rig.addEventListener('pointercancel',up);
rig.addEventListener('wheel',e=>{const h=hit(e.clientX,e.clientY);if(!h||!h.k)return;e.preventDefault();h.k.scale=clamp(h.k.scale*Math.exp(-e.deltaY*.0015),SMIN,SMAX);keepOn(h.k);computeMesh();save()},{passive:false});
rig.addEventListener('contextmenu',e=>e.preventDefault());
$('add').onclick=()=>{if(DISCS.length>=MAXD)return toast('Four discs at most');picker(null)};$('rec').onclick=recToggle;$('help').onclick=helpSheet;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeMenu()}if($('sheet').hidden){if(e.key===' '&&DISCS.length){e.preventDefault();const k=DISCS[DISCS.length-1];playD(k,!playing(k))}if(e.key==='r')recToggle();if(e.key==='h')setClear(!CLEAR)}});
Promise.all(['suite.json','decks.json','layers.json'].map(u=>fetch(BASE+u).then(r=>{if(!r.ok)throw new Error(u);return r.json()}))).then(([s,d,x])=>{build(s,d,x);resize();poemDots();selfTest();if(!restore())loadPoem('06');else{computeMesh();poemUI()}requestAnimationFrame(frame)})
  .catch(e=>{document.body.insertAdjacentHTML('beforeend',`<div class="toast">Could not load (${esc(e.message)}). Reload.</div>`)});
</script>
