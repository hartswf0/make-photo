<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Mix Discs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: SOURCE disc (left) → SEND lens (picture / sound / words) → MIX preview (right). Below: the disc shelf, then the mix's three lanes.
   One screen, no scroll. Single deep-blue look by choice. */
:root{--bg:#0a17a6;--bg2:#050c6b;--ink:#eef3ff;--dim:rgba(220,230,255,.62);--faint:rgba(220,230,255,.22);--ring:rgba(200,225,255,.55);
  --pic:#7fd8ff;--snd:#ffb35c;--txt:#d8c9ff;--hot:#ffffff;--rec:#ff5a6e;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 30%,#1426c4 0%,var(--bg) 40%,var(--bg2) 100%);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(10,20,120,.35);border:1px solid var(--ring);border-radius:999px;cursor:pointer;padding:0 14px;min-height:36px}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{height:100%;box-sizing:border-box;display:grid;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1.35fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;grid-template-areas:"top top top" "src lens out" "shelf shelf shelf" "tl tl tl" "insp insp insp"}
.top{grid-area:top;display:flex;align-items:baseline;gap:18px;min-width:0}
.top h1{margin:0;font:500 15px var(--mono);letter-spacing:.32em;white-space:nowrap}
.top .now{font:500 12px var(--mono);letter-spacing:.14em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.top button{min-height:30px;padding:0 12px}
/* source disc */
.src{grid-area:src;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px;min-height:0;min-width:0;justify-items:center}
.lab{font:500 11px var(--mono);letter-spacing:.24em;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lab b{color:var(--ink);font-weight:500}
.disc{position:relative;aspect-ratio:1;height:100%;max-width:100%;min-height:0;border-radius:50%;touch-action:none;cursor:grab}
.disc video{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;object-fit:cover;background:#030840;pointer-events:none}
.disc canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scrub{position:relative;width:100%;height:34px;touch-action:none;cursor:pointer}
.scrub canvas{position:absolute;inset:0;width:100%;height:100%}
.st{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.st .tc{font:500 11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;min-width:11ch;text-align:center}
.round{width:44px;min-width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:14px;letter-spacing:0}
.round.big{width:54px;height:54px;font-size:18px}
/* send lens */
.lens{grid-area:lens;display:grid;align-content:center;gap:10px;justify-items:center;width:150px}
.lens .lab{margin-bottom:2px}
.send{width:132px;display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;gap:8px;text-align:left;border-radius:14px;padding:0 12px;min-height:44px;letter-spacing:.12em}
.send svg{width:18px;height:18px}
.send.on{background:var(--c);color:#06106a;border-color:var(--c)}
.send[data-ch="pic"]{--c:var(--pic)}.send[data-ch="snd"]{--c:var(--snd)}.send[data-ch="txt"]{--c:var(--txt)}
#add{width:132px;min-height:52px;border-radius:14px;background:#fff;color:#081388;border-color:#fff;font-weight:600;line-height:1.35;letter-spacing:.1em}
#add small{display:block;font:500 9.5px var(--mono);letter-spacing:.04em;text-transform:none;opacity:.75}
/* mix preview */
.out{grid-area:out;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0;min-width:0}
.screen{position:relative;min-height:0;display:grid;place-items:center}
.screen canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;height:auto;border-radius:14px;box-shadow:0 0 0 1px var(--ring),0 0 60px rgba(90,170,255,.25);background:#000}
.ot{display:flex;gap:10px;align-items:center;justify-content:center}
.ot .tc{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.ot .meter{width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.ot .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#fff)}
/* shelf of discs */
.shelf{grid-area:shelf;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;min-width:0}
.filt{display:flex;gap:5px}
.filt button{min-height:28px;padding:0 10px;font-size:10px}
.filt button.on{background:#fff;color:#081388;border-color:#fff}
.discs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.discs::-webkit-scrollbar{display:none}
.dk{flex:none;width:52px;height:52px;border-radius:50%;padding:0;position:relative;overflow:hidden;border:1.5px solid var(--faint);background:#0a1690 center/cover no-repeat}
.dk span{position:absolute;inset:auto 0 3px 0;font:600 9px var(--mono);letter-spacing:.04em;text-shadow:0 0 4px #000,0 0 2px #000}
.dk.on{border-color:#fff;box-shadow:0 0 0 2px #fff}
.dk i{position:absolute;top:5px;left:0;right:0;display:flex;gap:2px;justify-content:center}
.dk i b{width:5px;height:5px;border-radius:50%}
/* timeline */
.tl{grid-area:tl;position:relative;height:132px;border-radius:12px;background:rgba(3,8,70,.45);box-shadow:inset 0 0 0 1px var(--faint);touch-action:none}
.tl canvas{position:absolute;inset:0;width:100%;height:100%}
.insp{grid-area:insp;display:flex;gap:10px;align-items:center;min-height:40px;flex-wrap:wrap}
.insp .what{font:500 12px var(--mono);color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp .what b{color:var(--ink);font-weight:500}
.insp label{display:flex;gap:8px;align-items:center;font:500 10px var(--mono);letter-spacing:.14em;color:var(--dim)}
.insp input[type=range]{width:160px;accent-color:#fff}
.insp button{min-height:32px}
/* sheets and toasts */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,9,70,.97);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sh h2{margin:0 8px;font:500 14px var(--mono);letter-spacing:.24em;font-weight:500}
.sb{overflow:auto;min-height:0;user-select:text;-webkit-user-select:text}
pre{font:500 11.5px/1.5 var(--mono);margin:0;white-space:pre}
.help{max-width:66ch;font:400 15px/1.6 var(--sans)}
.help b{font-weight:600}
.sb video{max-width:100%;max-height:60vh;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 50px);z-index:20;background:#0b1890;border:1px solid var(--ring);border-radius:12px;padding:9px 14px;font:500 12px var(--sans);display:flex;gap:10px;align-items:center;max-width:min(92vw,560px)}
.toast button{min-height:26px}
/* phone */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"top top" "out out" "src lens" "shelf shelf" "tl tl" "insp insp";gap:8px}
  .top h1{font-size:12px;letter-spacing:.24em}.top .now{display:none}
  .screen canvas{border-radius:10px}
  .out{grid-template-rows:auto auto}.out>.lab{display:none}
  .lens{width:118px;gap:6px}.send{width:112px;min-height:36px;padding:0 9px;font-size:10px}#add{width:112px;min-height:46px;font-size:10px}
  .src{grid-template-rows:minmax(0,1fr) auto auto;gap:4px}.src>.lab{display:none}
  .round{width:38px;min-width:38px;height:38px}.round.big{width:44px;height:44px}
  .scrub{height:28px}
  .shelf{grid-template-columns:minmax(0,1fr)}.filt{overflow-x:auto}
  .dk{width:44px;height:44px}
  .tl{height:104px}
  .insp input[type=range]{width:110px}
}
</style>

<div class="app">
  <div class="top"><h1>FOURTEEN POEMS</h1><span class="now" id="now"></span><span class="sp"></span><button id="exp" type="button">EXPORT</button><button id="help" type="button" aria-label="How it works">?</button></div>

  <section class="src" aria-label="Source disc">
    <div class="lab">SOURCE · <b id="srcName">—</b></div>
    <div class="disc" id="disc"><video id="sv" playsinline preload="auto"></video><canvas id="dc"></canvas></div>
    <div class="scrub" id="scrub" title="Tap to move. Drag the IN or OUT handle to change the cut."><canvas></canvas></div>
    <div class="st"><button class="round" id="inB" type="button" title="Mark IN here (I)">[</button><button class="round big" id="sPlay" type="button" aria-label="Play source">▶</button><button class="round" id="outB" type="button" title="Mark OUT here (O)">]</button><span class="tc" id="cutTc"></span></div>
  </section>

  <section class="lens" aria-label="Send to the mix">
    <div class="lab">SEND</div>
    <button class="send" data-ch="pic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>PICTURE</button>
    <button class="send" data-ch="snd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>SOUND</button>
    <button class="send" data-ch="txt" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M5 12h14M5 17h9"/></svg>WORDS</button>
    <button id="add" type="button">ADD TO MIX<small id="addInfo"></small></button>
  </section>

  <section class="out" aria-label="Mix preview">
    <div class="lab">MIX · WHAT THE FINAL FILM LOOKS AND SOUNDS LIKE</div>
    <div class="screen"><canvas id="pc" width="1280" height="720"></canvas></div>
    <div class="ot"><button class="round" id="pStart" type="button" aria-label="Back to start">⏮</button><button class="round big" id="pPlay" type="button" aria-label="Play the mix">▶</button><span class="tc" id="pTc">0:00.0 / 0:00.0</span><span class="meter"><i id="meter"></i></span></div>
  </section>

  <section class="shelf" aria-label="Discs">
    <div class="filt" id="filt"></div>
    <div class="discs" id="discs"></div>
  </section>

  <div class="tl" id="tl" aria-label="The mix: picture, sound and words lanes"><canvas></canvas></div>
  <div class="insp" id="insp"></div>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sh" id="shH"></div><div class="sb" id="shB"></div><div class="sh" id="shF"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const BASE=/\/city\/mix\/?/.test(location.pathname)?'../decks/':'';
const FPS=23.976,TB=24,LANES=[{k:'pic',n:'PICTURE',c:'#7fd8ff'},{k:'snd',n:'SOUND',c:'#ffb35c'},{k:'txt',n:'WORDS',c:'#d8c9ff'}];
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor(t%1*10)};
const tcf=f=>{f=Math.max(0,Math.round(f));return[Math.floor(f/(3600*TB)),Math.floor(f/(60*TB))%60,Math.floor(f/TB)%60,f%TB].map(x=>String(x).padStart(2,'0')).join(':')};
const tc=t=>tcf(t*FPS);
const DPR=Math.min(2,devicePixelRatio||1);
function fit(c){const r=c.getBoundingClientRect(),w=Math.max(1,Math.round(r.width*DPR)),h=Math.max(1,Math.round(r.height*DPR));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return[w,h]}
function toast(m,act,fn){const e=$('toast');e.innerHTML=`<span>${esc(m)}</span>`+(act?`<button type="button">${act}</button>`:'');e.hidden=false;if(act)e.querySelector('button').onclick=()=>{fn();e.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,act?6000:3400)}
/* ---------- discs: every source can offer picture, sound and words ---------- */
let D=[],DK={},SRC=null;
function lineWords(p,t){let li=0;for(let i=0;i<p.lines.length;i++)if(p.lines[i].s<=t)li=i;const L=p.lines[li];if(t<p.speech[0]-.3||t>p.speech[1]+.6)return null;
  const ws=p.words.filter(w=>w[0]>=L.s-.3&&w[0]<L.e);return ws.length?ws.map(w=>({w:w[2],on:w[0]<=t})):L.text.split(' ').map(w=>({w,on:true}))}
function build(su,dk,ly){SRC=su.source;const poems=su.poems,P=n=>poems.find(p=>p.num===n);
  poems.forEach(p=>D.push({key:'R'+p.num,kind:'reading',num:p.num,title:p.title,short:p.num,thumb:'thumbs/'+p.num+'.jpg',dur:p.clip.dur,files:[p.clip.file],video:true,pic:1,snd:1,txt:1,base:p.clip.src_in,reel:'WYGWYL',
    span:[Math.max(0,p.speech[0]-.4),Math.min(p.clip.dur,p.speech[1]+1)],words:t=>lineWords(p,t),note:`Reading · ${p.lines.length} lines`}));
  dk.world.forEach(w=>D.push({key:'W'+w.key,kind:'world',num:w.poem,title:w.title,short:w.poem||'·',thumb:w.thumb,dur:w.dur,files:[w.file],video:true,pic:1,snd:1,txt:0,base:0,reel:w.key.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase(),span:[0,w.dur],note:'World reel'}));
  dk.sounds.forEach(s=>{const p=P(s.num);D.push({key:'S'+s.num,kind:'sounds',num:s.num,title:'Line sounds · '+p.title,short:s.num,dur:s.dur,files:[s.file],video:false,pic:0,snd:1,txt:1,base:0,reel:'FS'+s.num,
    span:[Math.max(0,p.speech[0]-.4),Math.min(s.dur,p.speech[1]+2)],fx:s.cues,words:t=>{let c=null;for(const f of s.cues)if(f.t<=t)c=f;return c&&t-c.t<6?[{w:'♪ '+c.title,on:true},{w:'— '+c.author,on:false}]:null},note:`${s.cues.length} Freesound line cues`})});
  ly.poems.forEach(x=>{const p=P(x.num);D.push({key:'X'+x.num,kind:'layers',num:x.num,title:'Room & horizon · '+p.title,short:x.num,dur:x.dur,files:x.stems.map(s=>s.file),planes:x.stems.map(s=>s.name),video:false,pic:0,snd:1,txt:1,base:0,reel:'MP'+x.num,
    span:[Math.max(0,p.speech[0]-.4),Math.min(x.dur,p.speech[1]+2)],xl:x.lines,words:t=>{let L=null;for(const l of x.lines)if(l.t<=t)L=l;return L?[{w:L.beat,on:true}]:null},note:'5 sound planes from the X-sheet'})});
  D.forEach(d=>DK[d.key]=d)}
const KINDN={reading:'READINGS',world:'WORLD',sounds:'LINE SOUNDS',layers:'ROOMS'};
/* ---------- audio ---------- */
let AC=null,master,mDest,mAn,mBuf;
function ensureAC(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();mAn=AC.createAnalyser();mAn.fftSize=512;mBuf=new Uint8Array(512);master.connect(mAn);mAn.connect(AC.destination);try{mDest=AC.createMediaStreamDestination();master.connect(mDest)}catch(e){}
  srcOut=AC.createGain();srcOut.connect(AC.destination);[SP,...CL.map(c=>c.pl).filter(Boolean)].forEach(p=>p&&p.wire())}
let srcOut=null;
/* A player: one or more synced elements for one disc. Picture players are muted; sound players go through a gain. */
function Player(d,role){const els=d.files.map((f,i)=>{if(role==='src'&&d.video&&i===0)return $('sv');const e=(d.video&&i===0)?document.createElement('video'):new Audio();e.preload='auto';e.playsInline=true;e.src=BASE+f;if(role==='pic')e.muted=true;return e});
  const p={d,role,els,g:null,wired:false,
    wire(){if(this.wired||!AC||role==='pic')return;this.g=AC.createGain();this.g.connect(role==='src'?srcOut:master);this.els.forEach(e=>{let n=e._n;if(!n){try{n=e._n=AC.createMediaElementSource(e)}catch(x){return}}try{n.disconnect()}catch(x){}n.connect(this.g)});this.wired=true},
    t(){return this.els[0].currentTime},
    seek(t){this.els.forEach(e=>{try{e.currentTime=t}catch(x){}})},
    play(){this.wire();this.els.forEach(e=>e.play().catch(()=>{}))},
    pause(){this.els.forEach(e=>e.pause())},
    sync(){const t=this.els[0].currentTime;for(let i=1;i<this.els.length;i++){const e=this.els[i];if(Math.abs(e.currentTime-t)>.08)e.currentTime=t;if(e.paused!==this.els[0].paused)this.els[0].paused?e.pause():e.play().catch(()=>{})}},
    vol(v){if(this.g)this.g.gain.setTargetAtTime(v,AC.currentTime,.03)},
    get paused(){return this.els[0].paused},
    kill(){this.els.forEach(e=>{e.pause();e.removeAttribute('src');e.load()})}};
  if(role==='src'&&d.video){const sv=$('sv');sv.muted=false;sv.src=BASE+d.files[0];sv.load()}
  if(AC)p.wire();return p}
/* ---------- source state ---------- */
let SD=null,SP=null,IN=0,OUT=0,SEND={pic:true,snd:true,txt:true};
function loadDisc(key){const d=DK[key];if(!d)return;if(SP){SP.pause();if(SP.role==='src'&&!d.video&&SP.d.video){}}if(SP&&!SP.d.video)SP.kill();SD=d;
  if(!d.video){$('sv').pause();$('sv').removeAttribute('src');$('sv').load();$('sv').style.visibility='hidden'}else $('sv').style.visibility='visible';
  SP=Player(d,'src');IN=d.span[0];OUT=d.span[1];SP.els[0].addEventListener('loadedmetadata',()=>SP.seek(IN),{once:true});
  SEND={pic:!!d.pic,snd:!!d.snd,txt:!!d.txt};$('srcName').textContent=d.title;shelf();sendUI();save()}
function srcT(){return SP?SP.t():0}
function sendUI(){document.querySelectorAll('.send').forEach(b=>{const ch=b.dataset.ch,ok=SD&&SD[ch];b.disabled=!ok;b.classList.toggle('on',!!(ok&&SEND[ch]));b.title=ok?`Send this disc's ${ch==='pic'?'picture':ch==='snd'?'sound':'words'} into the mix`:`This disc has no ${ch==='pic'?'picture':ch==='snd'?'sound':'words'}`});
  const len=OUT-IN,chs=['pic','snd','txt'].filter(c=>SD&&SD[c]&&SEND[c]);$('add').disabled=!chs.length||len<.2;$('addInfo').textContent=`${fmt(len)} at ${fmt(PT)}`;$('cutTc').textContent=`${fmt(IN)} → ${fmt(OUT)}`}
document.querySelectorAll('.send').forEach(b=>b.onclick=()=>{SEND[b.dataset.ch]=!SEND[b.dataset.ch];sendUI()});
$('sPlay').onclick=()=>{if(!SP)return;ensureAC();AC.resume();if(PL)pStop();if(SP.paused){if(srcT()>=OUT-.05||srcT()<IN-.05)SP.seek(IN);SP.play()}else SP.pause()};
$('inB').onclick=()=>{IN=clamp(srcT(),0,OUT-.2);sendUI()};$('outB').onclick=()=>{OUT=clamp(srcT(),IN+.2,SD.dur);sendUI()};
/* ---------- the mix ---------- */
let CL=[],U=[],SEL=null,PT=0,PL=false,P0=0,PT0=0,uid=1;
const len=c=>c.out-c.in,mixDur=()=>CL.reduce((m,c)=>Math.max(m,c.at+len(c)),0);
function snap(){U.push(JSON.stringify(CL.map(({pl,...c})=>c)));if(U.length>100)U.shift()}
function restore(arr){CL.forEach(c=>c.pl&&c.pl.kill());CL=arr.filter(c=>DK[c.key]).map(c=>({...c}));SEL=null;uid=CL.reduce((m,c)=>Math.max(m,c.id),0)+1;syncAll(true);drawTL();insp();save()}
function freeRow(lane,at,end,skip){for(let r=0;r<4;r++){if(!CL.some(c=>c!==skip&&c.lane===lane&&c.row===r&&c.at<end-.01&&c.at+len(c)>at+.01))return r}return 3}
function addClips(){if(!SD)return;snap();const g=uid,at=PT,ls=['pic','snd','txt'].filter(c=>SD[c]&&SEND[c]);const made=[];
  ls.forEach(lane=>{const c={id:uid++,grp:g,lane,key:SD.key,in:IN,out:OUT,at,row:freeRow(lane,at,at+OUT-IN),lvl:lane==='snd'&&SD.kind!=='reading'?.7:1};CL.push(c);made.push(c)});
  SEL=made[0].id;PT=at+(OUT-IN);syncAll(true);drawTL();insp();sendUI();save();

  PT=0;pStop();syncAll(true);setTimeout(()=>{REC.on=true;REC.mr=mr;mr.start(500);pPlay();toast('Recording the mix in real time. It stops at the end.')},700)}
$('help').onclick=()=>sheet(`<button type="button" onclick="closeSheet()">← MIX</button><h2>HOW IT WORKS</h2>`,`<div class="help">
<p><b>1 · Pick a disc.</b> The shelf holds every source. The three dots on a disc show what it carries: <span style="color:#7fd8ff">picture</span>, <span style="color:#ffb35c">sound</span>, <span style="color:#d8c9ff">words</span>. READINGS are the poems from the Frame.io cut; WORLD reels are butterfly-halfworld films; LINE SOUNDS are the Freesound cue for each spoken line; ROOMS are the five X-sheet sound planes together.</p>
<p><b>2 · Cut a segment.</b> Play the disc. Press <b>[</b> to mark IN and <b>]</b> to mark OUT, or drag the white handles under it. Drag round the disc to scrub.</p>
<p><b>3 · Send.</b> Light PICTURE, SOUND or WORDS (any mix of them), then ADD TO MIX. The segment lands at the mix playhead, each part on its own lane, and the playhead moves to its end, so the next segment follows on.</p>
<p><b>4 · Combine.</b> Tap the mix lanes to move the playhead and add from other discs at any time: the Atlantis picture from a world reel, his voice from a reading, a room from ROOMS, the words from another poem. Clips that overlap stack: pictures blend by opacity, sounds add up by volume.</p>
<p><b>5 · Adjust.</b> Tap a clip: set its opacity or volume, delete it, or open its disc. Drag it to move it in time, or up and down within its lane; drag an edge to trim. UNDO steps back.</p>
<p><b>6 · Watch and hear.</b> The right-hand screen plays the mix exactly as it will be: only what is on the lanes. EXPORT gives the edit list (CMX3600) and the project, and RECORD FILM plays the mix once and records it.</p>
<p><b>Keys.</b> Space plays the mix · S plays the disc · I and O mark IN and OUT · Enter adds · Delete removes the selected clip · Ctrl/⌘-Z undoes.</p></div>`);
addEventListener('keydown',e=>{if(!$('sheet').hidden){if(e.key==='Escape')closeSheet();return}if(e.target.closest('input'))return;const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();undo();return}if(e.metaKey||e.ctrlKey)return;
  if(k===' '){e.preventDefault();$('pPlay').click()}else if(k==='s')$('sPlay').click();else if(k==='i')$('inB').click();else if(k==='o')$('outB').click();else if(k==='enter'&&!e.target.closest('button'))addClips();
  else if((k==='delete'||k==='backspace')&&SEL){const b=$('iDel');b&&b.click()}});
function save(){try{localStorage.setItem('mixdiscs.v1',JSON.stringify({clips:CL.map(({pl,...c})=>c),disc:SD&&SD.key}))}catch(e){}}
/* ---------- loop ---------- */
function frame(){try{if(PL){PT=PT0+(performance.now()-P0)/1000;if(PT>=mixDur()){PT=mixDur();pStop();if(REC.on)REC.mr.stop()}}syncAll();if(SP){SP.sync();if(!SP.paused&&srcT()>=OUT&&srcT()<OUT+.3)SP.pause()}
  drawDisc();drawScrub();drawOut();drawTL();$('pTc').textContent=`${fmt(PT)} / ${fmt(mixDur())}`;$('sPlay').textContent=SP&&!SP.paused?'❚❚':'▶';$('addInfo').textContent=`${fmt(OUT-IN)} at ${fmt(PT)}`;
  if(mAn&&PL){mAn.getByteTimeDomainData(mBuf);let s=0;for(const x of mBuf){const d=(x-128)/128;s+=d*d}$('meter').style.width=Math.min(100,Math.sqrt(s/mBuf.length)*400)+'%'}else $('meter').style.width='0';
  const d=SD;$('now').textContent=d?`${d.short} / ${d.title.toUpperCase()} · ${fmt(srcT())}`:''}catch(e){console.warn(e)}requestAnimationFrame(frame)}
/* an example mix to start from: Atlantis picture from a world reel, his voice and words from the reading, the room under it */
function example(){const R=DK.R06,W=DK.W06,X=DK.X06,s0=R.span[0],s1=R.span[0]+40;
  return[{id:1,grp:1,lane:'pic',key:'W06',in:0,out:40,at:0,row:0,lvl:1},{id:2,grp:2,lane:'snd',key:'R06',in:s0,out:s1,at:0,row:0,lvl:1},{id:3,grp:2,lane:'txt',key:'R06',in:s0,out:s1,at:0,row:0,lvl:1},
    {id:4,grp:3,lane:'pic',key:'R06',in:s0+14,out:s0+24,at:14,row:1,lvl:.55},{id:5,grp:4,lane:'snd',key:'X06',in:s0,out:s1,at:0,row:1,lvl:.6}]}
Promise.all(['suite.json','decks.json','layers.json'].map(u=>fetch(BASE+u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()}))).then(([s,d,x])=>{build(s,d,x);
  let sv=null;try{sv=JSON.parse(localStorage.getItem('mixdiscs.v1')||'null')}catch(e){}
  if(sv&&Array.isArray(sv.clips)&&sv.clips.length){restore(sv.clips);toast(`Your last mix is back: ${CL.length} clips.`)}else{restore(example());toast('An example mix is loaded: Atlantis picture from a world reel, the voice and words of poem 06, and its room underneath. Press ▶ under the mix.')}
  loadDisc(sv&&sv.disc&&DK[sv.disc]?sv.disc:'R06');insp();requestAnimationFrame(frame)}).catch(err=>{$('insp').innerHTML=`<span class="what">The discs did not load (${esc(err.message)}). Reload the page.</span>`});
