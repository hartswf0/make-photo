<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="alternate icon" href="../favicon.ico">
  <title>Tex Lexington · Ethiopia on Mars</title>
  <meta name="description" content="A third-person Mars western built from a Genie 4 take: ride Tex Lexington down the main street of an Ethiopian frontier colony until the dust storm comes through and the future is standing behind the town.">
  <style>
    :root { --ink: #fbeee2; --dim: rgba(251, 238, 226, .62); --rust: #c4552c; --line: rgba(251, 238, 226, .28); --stage: #1c0f0b;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --word: "IM Fell English", Georgia, serif; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--stage); color: var(--ink); font: 12px/1.4 var(--mono); overflow: hidden; -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
    [hidden] { display: none !important; }
    .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
      background: linear-gradient(rgba(28, 15, 11, .55), transparent); pointer-events: none; display: grid; gap: 4px; }
    .top b { font: italic 400 clamp(20px, 3vw, 28px)/1.2 var(--word); }
    .top span { color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
    #line { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); padding: 0 20px; text-align: center; font: italic 400 clamp(17px, 2.6vw, 26px)/1.35 var(--word);
      text-shadow: 0 1px 12px rgba(0, 0, 0, .85); pointer-events: none; opacity: 0; transition: opacity .8s; text-wrap: balance; }
    #line.on { opacity: 1; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: linear-gradient(transparent, rgba(28, 15, 11, .7) 40%); }
    .bar .keys { color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; margin-right: auto; }
    button { all: unset; cursor: pointer; font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line); padding: 10px 12px; }
    button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--stage); }
    #study { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); color: var(--dim); font: 600 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--line); padding: 8px 10px; }
    #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 1px solid var(--line); border-radius: 50%; pointer-events: none; }
    #stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--rust); opacity: .85; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--stage); z-index: 9; transition: opacity .6s; text-align: center; padding: 24px; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot b { display: block; font: italic 400 26px/1.3 var(--word); margin-bottom: 8px; }
    #boot span { color: var(--dim); font-size: 11px; letter-spacing: .08em; }
    @media (pointer: coarse) { .bar .keys { display: none; } }
  </style>
</head>
<body>
  <canvas id="c" tabindex="0" aria-label="Mars frontier town. W A S D to ride, Shift to gallop. On a phone, the left thumb rides."></canvas>
  <header class="top"><b>Tex Lexington</b><span id="where">Ethiopia on Mars · Main Street</span></header>
  <a id="study" href="study.html">Genie ↔ game</a>
  <div id="line" aria-live="polite"></div>
  <div class="bar">
    <span class="keys">W A S D ride · Shift gallop · F storm · C camera</span>
    <button id="storm" type="button" title="Call the dust storm (F)">Storm</button>
    <button id="cam" type="button" aria-pressed="false" title="Locked behind Tex, or the Genie framing (C)">Genie frame</button>
  </div>
  <div id="stick" hidden><i></i></div>
  <div id="boot" role="status"><div><b>Ethiopia on Mars</b><span id="boot-s">Saddling up…</span></div></div>

  <script src="../field-plates/three.js"></script>
  <script src="../donkey/donkey.js"></script>
  <script src="../donkey/scion-eye-globe.js"></script>
  <script src="../donkey/scion-eyelids.js"></script>
  <script src="../donkey/scion-neck.js"></script>
  <script src="../donkey/human-sculpt-v3.js"></script>
  <script src="../donkey/expressions-v4.js"></script>
  <script src="../donkey/characters.js"></script>
  <script src="./mars-world.js"></script>
  <script src="./mars.js"></script>
</body>
</html>
